name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: __app__, POSTGRES_USER: __app__, POSTGRES_PASSWORD: __app__-dev-password }
        ports: ["__DB_PORT__:5432"]
        options: --health-cmd "pg_isready -U __app__" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DB_PASSWORD: __app__-dev-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: docker compose --profile stack build
