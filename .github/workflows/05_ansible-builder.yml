name: 05 - Ansible Builder

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Stack name under infra/stacks
        required: true
        default: lab
        type: choice
        options: [lab]
      playbook:
        description: Builder playbook to run
        required: true
        default: harden
        type: choice
        options: [harden, docker, tailscale-update]
      limit:
        description: Optional Ansible host limit
        required: false
        default: all
      bootstrap:
        description: Use the cloud-init break-glass user for the initial hardening run
        required: true
        default: false
        type: boolean
      confirm:
        description: Type apply to make changes; any other value runs check mode
        required: false
        default: check

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible-builder-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Builder mode
        shell: bash
        run: |
          if [[ "${{ inputs.bootstrap }}" == "true" && "${{ inputs.playbook }}" != "harden" ]]; then
            echo 'bootstrap mode only supports the harden playbook' >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: ./.github/actions/setup-opentofu-pipeline
        with:
          env_dir: infra/stacks/${{ inputs.environment }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          configure_proxmox: 'false'
          # ponytail: reuse state write credentials until the Builder canary passes;
          # replace with a Builder-only R2 Object Read token afterwards.
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Install Ansible and its collections
        working-directory: builders/ansible
        run: |
          python -m pip install 'ansible-core>=2.18,<2.19'
          ansible-galaxy collection install -r requirements.yml

      - name: Render Builder inventory
        working-directory: infra/stacks/${{ inputs.environment }}
        run: |
          tofu output -json builder_machines > "$RUNNER_TEMP/builder-machines.json"
          user=gitops
          if [ "${{ inputs.bootstrap }}" = "true" ]; then user=autolab; fi
          python3 "$GITHUB_WORKSPACE/scripts/generate-ansible-inventory.py" \
            "$RUNNER_TEMP/builder-machines.json" --output "$RUNNER_TEMP/inventory.json" --user "$user"

      - name: Wait for Tailscale and SSH readiness
        run: |
          # Require both the overlay path and a known host key before Builder touches a machine.
          mapfile -t hosts < <(python3 - "$RUNNER_TEMP/inventory.json" <<'PY'
          import json, sys
          inventory = json.load(open(sys.argv[1]))
          for host in inventory["all"]["children"]["linux_servers"]["hosts"].values():
              print(host["ansible_host"])
          PY
          )
          user=gitops
          if [[ "${{ inputs.bootstrap }}" == "true" ]]; then user=autolab; fi
          for host in "${hosts[@]}"; do
            for attempt in {1..12}; do
              if ! ping_output=$(tailscale ping --timeout=5s "$host" 2>&1); then
                failure="Tailscale reachability failed for $host: $ping_output"
              elif ! ssh_output=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 "$user@$host" true 2>&1); then
                failure="SSH readiness failed for $user@$host: $ssh_output"
              else
                break
              fi
              if [[ "$attempt" == 12 ]]; then
                echo "$failure" >&2
                exit 1
              fi
              sleep 5
            done
          done

      - name: Run Builder playbook
        working-directory: builders/ansible
        run: |
          args=(-i "$RUNNER_TEMP/inventory.json" "playbooks/${{ inputs.playbook }}.yml" --limit "$BUILDER_LIMIT")
          if [ "$BUILDER_CONFIRM" != "apply" ]; then args+=(--check); fi
          ansible-playbook "${args[@]}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'true'
          ANSIBLE_SSH_COMMON_ARGS: '-o StrictHostKeyChecking=yes'
          BUILDER_LIMIT: ${{ inputs.limit }}
          BUILDER_CONFIRM: ${{ inputs.confirm }}
