name: 05 - Ansible Builder

on:
  # Observability config is provisioning files plus a container restart, so it
  # applies on merge rather than waiting for someone to remember. Deliberately
  # narrow: only these paths, only the observability playbook, never harden or
  # docker or nfs — those touch the machines themselves and keep their typed
  # confirmation.
  push:
    branches: [main]
    paths:
      - builders/ansible/roles/observability-agent/**
      - builders/ansible/roles/observability-stack/**
      - builders/ansible/playbooks/observability.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Stack name under infra/stacks
        required: true
        default: lab
        type: choice
        options: [lab]
      playbook:
        description: Builder playbook to run
        required: true
        default: harden
        type: choice
        options: [harden, docker, tailscale-update, nfs, observability]
      limit:
        description: Optional Ansible host limit
        required: false
        default: all
      tags:
        description: >-
          Optional Ansible tag filter for the harden playbook (e.g. users, ssh,
          firewall, base). Leave blank to run the whole baseline. A tagged run
          is a shortcut for urgent changes, not a substitute for the full run.
        required: false
        default: ''
      bootstrap:
        description: Use the cloud-init break-glass user for the initial hardening run
        required: true
        default: false
        type: boolean
      confirm:
        description: Type apply to make changes; any other value runs check mode
        required: false
        default: check

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible-builder-${{ inputs.environment || 'lab' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'lab' }}
    env:
      # workflow_dispatch supplies inputs; push supplies none. Resolving both
      # into one place keeps the rest of the job identical for either trigger.
      BUILDER_ENVIRONMENT: ${{ inputs.environment || 'lab' }}
      BUILDER_PLAYBOOK: ${{ inputs.playbook || 'observability' }}
      BUILDER_BOOTSTRAP: ${{ inputs.bootstrap || false }}
      BUILDER_LIMIT: ${{ inputs.limit || 'all' }}
      BUILDER_TAGS: ${{ inputs.tags || '' }}
      BUILDER_CONFIRM: ${{ inputs.confirm || 'apply' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Builder mode
        shell: bash
        run: |
          if [[ "$BUILDER_BOOTSTRAP" == "true" && "$BUILDER_PLAYBOOK" != "harden" ]]; then
            echo 'bootstrap mode only supports the harden playbook' >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: ./.github/actions/setup-opentofu-pipeline
        with:
          env_dir: infra/stacks/${{ inputs.environment || 'lab' }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          configure_proxmox: 'false'
          # Builder needs to READ state (tofu output builder_machines) but is
          # handed the read-write keys. Replacing these with an R2 Object
          # Read-only token is still open; in the meantime the keys are blanked
          # from GITHUB_ENV immediately after the inventory is rendered, so they
          # do not reach the playbook step.
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Install Ansible and its collections
        working-directory: builders/ansible
        run: |
          # Pinned to match 97_ansible-ci.yml — lint and runtime must agree, or a
          # version-specific break passes lint and fails on a real host.
          #
          # 2.18 is not usable here: its apt module emits a DeprecationWarning
          # under Python 3.13 (Debian 13's default) which contaminates the
          # module response, so Ansible misreports a successful upgrade as
          # UNREACHABLE. `state: present` misses the affected code path, so
          # harden.yml passed while tailscale-update.yml failed after doing its
          # work — a red run for a job that succeeded.
          python -m pip install 'ansible-core>=2.21,<2.22'
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml && break
            [ "$attempt" = 3 ] && { echo "failed after 3 attempts" >&2; exit 1; }
            echo "attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Render Builder inventory
        working-directory: infra/stacks/${{ inputs.environment || 'lab' }}
        run: |
          tofu output -json builder_machines > "$RUNNER_TEMP/builder-machines.json"
          user=gitops
          if [ "$BUILDER_BOOTSTRAP" = "true" ]; then user=autolab; fi
          python3 "$GITHUB_WORKSPACE/scripts/generate-ansible-inventory.py" \
            "$RUNNER_TEMP/builder-machines.json" --output "$RUNNER_TEMP/inventory.json" --user "$user"

      - name: Drop state credentials before Ansible runs
        run: |
          # setup-opentofu-pipeline writes the R2 keys to GITHUB_ENV, which is
          # job-wide, so every later step inherits them — including the playbook
          # step, which executes arbitrary Ansible content against the VMs. Only
          # `tofu init` and `tofu output` above need them. Blank them here so
          # Builder cannot reach the state bucket at all once the inventory has
          # been rendered. GITHUB_ENV is applied in order, so an empty
          # assignment overrides the earlier value for subsequent steps.
          #
          # This limits how far the credentials travel; it does not narrow the
          # credentials themselves. Scoping Builder to an R2 Object Read-only
          # token is still open — see the note in
          # docs/gitops/github-secrets-variables-reference.md.
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"

      - name: Wait for Tailscale and SSH readiness
        run: |
          # Require both the overlay path and a known host key before Builder touches a machine.
          mapfile -t hosts < <(python3 - "$RUNNER_TEMP/inventory.json" <<'PY'
          import json, sys
          inventory = json.load(open(sys.argv[1]))
          for host in inventory["all"]["children"]["linux_servers"]["hosts"].values():
              print(host["ansible_host"])
          PY
          )
          user=gitops
          if [[ "$BUILDER_BOOTSTRAP" == "true" ]]; then user=autolab; fi
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/known_hosts"
          for host in "${hosts[@]}"; do
            for attempt in {1..12}; do
              if ! ping_output=$(tailscale ping --until-direct=false --c 1 --timeout=5s "$host" 2>&1); then
                failure="Tailscale reachability failed for $host: $ping_output"
              elif ! ssh-keygen -F "$host" >/dev/null && ! ssh-keyscan -H -t ed25519 -T 5 "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
                failure="Could not collect an ED25519 host key for $host"
              elif ! ssh_output=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 "$user@$host" true 2>&1); then
                failure="SSH readiness failed for $user@$host: $ssh_output"
              else
                break
              fi
              if [[ "$attempt" == 12 ]]; then
                echo "$failure" >&2
                exit 1
              fi
              sleep 5
            done
          done

      # Written to a 0600 file rather than passed inline. `--extra-vars` on the
      # command line lands in the runner's process list, and anything echoed
      # from a shell expansion risks reaching the run log; a file keeps the
      # secret out of both. Rendered by Python from the environment so no value
      # is ever interpolated into a shell string.
      - name: Render Builder extra variables
        id: extra_vars
        env:
          AUTOLAB_PVE_HOST: ${{ vars.PROXMOX_HOST }}
          AUTOLAB_PVE_TOKEN_ID: ${{ vars.PVE_EXPORTER_TOKEN_ID }}
          AUTOLAB_PVE_TOKEN_SECRET: ${{ secrets.PVE_EXPORTER_TOKEN_SECRET }}
          # The ntfy topic is the whole credential — anyone holding it can read
          # these alerts and publish to them — so it is a secret, not a variable.
          AUTOLAB_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          out="$RUNNER_TEMP/extra-vars.json"
          umask 077
          python3 - "$out" <<'PY'
          import json, os, sys
          json.dump({
              "autolab_obs_pve_host": os.environ.get("AUTOLAB_PVE_HOST", ""),
              "autolab_obs_pve_token_id": os.environ.get("AUTOLAB_PVE_TOKEN_ID", ""),
              "autolab_obs_pve_token_secret": os.environ.get("AUTOLAB_PVE_TOKEN_SECRET", ""),
              "autolab_obs_ntfy_topic": os.environ.get("AUTOLAB_NTFY_TOPIC", ""),
          }, open(sys.argv[1], "w"))
          PY
          if [ -n "${AUTOLAB_PVE_TOKEN_ID}" ]; then
            echo "Proxmox exporter credentials supplied."
          else
            echo "No Proxmox exporter credentials; the hypervisor exporter stays disabled."
          fi
          if [ -n "${AUTOLAB_NTFY_TOPIC}" ]; then
            echo "Alert delivery configured."
          else
            echo "No ntfy topic; alerts stay in Grafana and are pushed nowhere."
          fi

      - name: Run Builder playbook
        working-directory: builders/ansible
        run: |
          set -o pipefail
          args=(-i "$RUNNER_TEMP/inventory.json" "playbooks/${BUILDER_PLAYBOOK}.yml" --limit "$BUILDER_LIMIT")
          args+=(--extra-vars "@$RUNNER_TEMP/extra-vars.json")
          if [ -n "$BUILDER_TAGS" ]; then args+=(--tags "$BUILDER_TAGS"); fi
          if [ "$BUILDER_CONFIRM" != "apply" ]; then args+=(--check); fi
          ansible-playbook "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/ansible-output.log"
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'true'
          ANSIBLE_SSH_COMMON_ARGS: '-o StrictHostKeyChecking=yes'

      # The file holds a Proxmox token and the ntfy topic; the runner is
      # ephemeral but the step is cheap and makes the lifetime explicit.
      - name: Remove the rendered extra variables
        if: always()
        run: rm -f "$RUNNER_TEMP/extra-vars.json"

      - name: Job summary
        if: always()
        run: |
          recap="unavailable (Ansible did not run or produced no host recap)"
          if [ -f "$GITHUB_WORKSPACE/ansible-output.log" ]; then
            recap_line="$(awk '/^PLAY RECAP/{getline; print; exit}' "$GITHUB_WORKSPACE/ansible-output.log")"
            if [ -n "$recap_line" ]; then recap="$recap_line"; fi
          fi
          {
            echo "## Ansible Builder"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Environment: \`$BUILDER_ENVIRONMENT\`"
            echo "- Mode: \`$([ "$BUILDER_BOOTSTRAP" = "true" ] && echo bootstrap || echo regular)\`"
            echo "- SSH user: \`$([ "$BUILDER_BOOTSTRAP" = "true" ] && echo autolab || echo gitops)\`"
            echo "- Playbook: \`$BUILDER_PLAYBOOK\`"
            echo "- Limit: \`$BUILDER_LIMIT\`"
            echo "- Tags: \`${BUILDER_TAGS:-all roles}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Ansible recap: $recap"
          } >> "$GITHUB_STEP_SUMMARY"
