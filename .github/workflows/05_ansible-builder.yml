name: 05 - Ansible Builder

on:
  # Observability config is provisioning files plus a container restart, so it
  # applies on merge rather than waiting for someone to remember. Deliberately
  # narrow: only these paths, only the observability playbook, never harden or
  # docker or nfs — those touch the machines themselves and keep their typed
  # confirmation.
  push:
    branches: [main]
    paths:
      - builders/ansible/roles/observability-agent/**
      - builders/ansible/roles/observability-stack/**
      - builders/ansible/playbooks/observability.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Stack name under infra/stacks
        required: true
        default: lab
        type: choice
        options: [lab, qnta]
      playbook:
        description: Builder playbook to run
        required: true
        default: harden
        type: choice
        options: [harden, docker, tailscale-update, nfs, storage, observability, backup, ingress, updates, reboot]
      limit:
        description: Optional Ansible host limit
        required: false
        default: all
      tags:
        description: >-
          Optional Ansible tag filter for the harden playbook (e.g. users, ssh,
          firewall, base). Leave blank to run the whole baseline. A tagged run
          is a shortcut for urgent changes, not a substitute for the full run.
        required: false
        default: ''
      bootstrap:
        description: Use the cloud-init break-glass user for the initial hardening run
        required: true
        default: false
        type: boolean
      confirm:
        description: Type apply to make changes; any other value runs check mode
        required: false
        default: check

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible-builder-${{ inputs.environment || 'lab' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'lab' }}
    env:
      # Referenced so the runner masks it from the job's first log line. A
      # public log then shows `xps-pve.***`. Not a secret, just not published.
      AUTOLAB_TAILNET_DOMAIN: ${{ secrets.TAILNET_DOMAIN }}
      # workflow_dispatch supplies inputs; push supplies none. Resolving both
      # into one place keeps the rest of the job identical for either trigger.
      BUILDER_ENVIRONMENT: ${{ inputs.environment || 'lab' }}
      BUILDER_PLAYBOOK: ${{ inputs.playbook || 'observability' }}
      BUILDER_BOOTSTRAP: ${{ inputs.bootstrap || false }}
      BUILDER_LIMIT: ${{ inputs.limit || 'all' }}
      BUILDER_TAGS: ${{ inputs.tags || '' }}
      BUILDER_CONFIRM: ${{ inputs.confirm || 'apply' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Builder mode
        shell: bash
        run: |
          if [[ "$BUILDER_BOOTSTRAP" == "true" && "$BUILDER_PLAYBOOK" != "harden" ]]; then
            echo 'bootstrap mode only supports the harden playbook' >&2
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: ./.github/actions/setup-opentofu-pipeline
        with:
          env_dir: infra/stacks/${{ inputs.environment || 'lab' }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          configure_proxmox: 'false'
          # Builder needs to READ state (tofu output builder_machines) but is
          # handed the read-write keys. Replacing these with an R2 Object
          # Read-only token is still open; in the meantime the keys are blanked
          # from GITHUB_ENV immediately after the inventory is rendered, so they
          # do not reach the playbook step.
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Ansible and its collections
        working-directory: builders/ansible
        run: |
          # Pinned to match 97_ansible-ci.yml — lint and runtime must agree, or a
          # version-specific break passes lint and fails on a real host.
          #
          # 2.18 is not usable here: its apt module emits a DeprecationWarning
          # under Python 3.13 (Debian 13's default) which contaminates the
          # module response, so Ansible misreports a successful upgrade as
          # UNREACHABLE. `state: present` misses the affected code path, so
          # harden.yml passed while tailscale-update.yml failed after doing its
          # work — a red run for a job that succeeded.
          python -m pip install 'ansible-core>=2.21,<2.22'
          for attempt in 1 2 3; do
            ansible-galaxy collection install -r requirements.yml && break
            [ "$attempt" = 3 ] && { echo "failed after 3 attempts" >&2; exit 1; }
            echo "attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Render Builder inventory
        working-directory: infra/stacks/${{ inputs.environment || 'lab' }}
        run: |
          tofu output -json builder_machines > "$RUNNER_TEMP/builder-machines.json"
          user=gitops
          if [ "$BUILDER_BOOTSTRAP" = "true" ]; then user=autolab; fi
          python3 "$GITHUB_WORKSPACE/scripts/generate-ansible-inventory.py" \
            "$RUNNER_TEMP/builder-machines.json" --output "$RUNNER_TEMP/inventory.json" --user "$user"

      - name: Drop state credentials before Ansible runs
        run: |
          # setup-opentofu-pipeline writes the R2 keys to GITHUB_ENV, which is
          # job-wide, so every later step inherits them — including the playbook
          # step, which executes arbitrary Ansible content against the VMs. Only
          # `tofu init` and `tofu output` above need them. Blank them here so
          # Builder cannot reach the state bucket at all once the inventory has
          # been rendered. GITHUB_ENV is applied in order, so an empty
          # assignment overrides the earlier value for subsequent steps.
          #
          # This limits how far the credentials travel; it does not narrow the
          # credentials themselves. Scoping Builder to an R2 Object Read-only
          # token is still open — see the note in
          # docs/gitops/github-secrets-variables-reference.md.
          echo "AWS_ACCESS_KEY_ID=" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=" >> "$GITHUB_ENV"

      # Over the tailnet the runner needs no key: Tailscale SSH vouches for it.
      # Over the management plane it talks to plain sshd on a tenant VM, and
      # sshd trusts only what is in authorized_keys. Written 0600 to the default
      # identity path so every ssh below — the gate, ProxyJump, Ansible — offers
      # it without any of them having to know about it.
      - name: Install the Builder SSH identity
        env:
          BUILDER_SSH_PRIVATE_KEY: ${{ secrets.BUILDER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$BUILDER_SSH_PRIVATE_KEY" ]; then
            echo "No Builder SSH key; tenant hosts on the management plane would be unreachable."
            exit 0
          fi
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$BUILDER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          echo "Builder SSH identity installed."

      - name: Wait for Tailscale and SSH readiness
        run: |
          # Require both the overlay path and a known host key before Builder touches a machine.
          #
          # Only the hosts this run targets. The gate used to check every machine
          # in the inventory regardless of --limit, so a single powered-off VM
          # blocked deploys to every healthy one — and `--limit jwst` did not
          # route around it, because the gate never read the limit. That is
          # backwards: a host going down is when you most need to push changes to
          # the rest. Resolved through ansible itself so the limit means the same
          # thing here as it does in the playbook run below.
          # sed, not tr: `tr -d '[:space:]'` strips the newlines as well and
          # collapses every hostname into one token, which then matches nothing.
          #
          # A tenant host is not on the runner's tailnet. For those the overlay
          # path that matters is the one to the hypervisor, and the VM's host key
          # is collected from there, since ssh-keyscan cannot hop.
          mapfile -t names < <(ansible -i "$RUNNER_TEMP/inventory.json" "$BUILDER_LIMIT" --list-hosts 2>/dev/null | tail -n +2 | sed 's/[[:space:]]//g' | grep -v '^$')
          mapfile -t targets < <(python3 - "$RUNNER_TEMP/inventory.json" "${names[@]}" <<'PY'
          import json, sys
          inventory = json.load(open(sys.argv[1]))
          wanted = set(sys.argv[2:])
          hosts = inventory["all"]["children"]["linux_servers"]["hosts"]
          for name, host in hosts.items():
              if not wanted or name in wanted:
                  print(host["ansible_host"], host.get("autolab_ssh_jump_host", "-"))
          PY
          )
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "No hosts matched limit '$BUILDER_LIMIT'; nothing to check." >&2
            exit 1
          fi
          echo "Readiness check covers ${#targets[@]} host(s) for limit '$BUILDER_LIMIT'."
          user=gitops
          if [[ "$BUILDER_BOOTSTRAP" == "true" ]]; then user=autolab; fi
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/known_hosts"
          for target in "${targets[@]}"; do
            host="${target%% *}"
            jump="${target##* }"
            base_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5)
            ssh_opts=("${base_opts[@]}")
            if [[ "$jump" == "-" ]]; then
              overlay="$host"
              keyscan=(ssh-keyscan -H -t ed25519 -T 5 "$host")
            else
              overlay="$jump"
              # The hop is made as the Builder's account on the node, never as
              # the VM user: bootstrap is break-glass on the VM, not on the node.
              # The VM's key is scanned *from* the node, since ssh-keyscan cannot hop.
              ssh_opts+=(-o "ProxyJump=gitops@$jump")
              keyscan=(ssh "${base_opts[@]}" "gitops@$jump" ssh-keyscan -H -t ed25519 -T 5 "$host")
            fi
            for attempt in {1..12}; do
              if ! ping_output=$(tailscale ping --until-direct=false --c 1 --timeout=5s "$overlay" 2>&1); then
                failure="Tailscale reachability failed for $overlay: $ping_output"
              elif [[ "$jump" != "-" ]] && ! ssh-keygen -F "$jump" >/dev/null && ! ssh-keyscan -H -t ed25519 -T 5 "$jump" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
                failure="Could not collect an ED25519 host key for jump host $jump"
              elif ! ssh-keygen -F "$host" >/dev/null && ! "${keyscan[@]}" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
                failure="Could not collect an ED25519 host key for $host"
              elif ! ssh_output=$(ssh "${ssh_opts[@]}" "$user@$host" true 2>&1); then
                failure="SSH readiness failed for $user@$host: $ssh_output"
              else
                break
              fi
              if [[ "$attempt" == 12 ]]; then
                echo "$failure" >&2
                exit 1
              fi
              sleep 5
            done
          done

      # Written to a 0600 file rather than passed inline. `--extra-vars` on the
      # command line lands in the runner's process list, and anything echoed
      # from a shell expansion risks reaching the run log; a file keeps the
      # secret out of both. Rendered by Python from the environment so no value
      # is ever interpolated into a shell string.
      - name: Render Builder extra variables
        id: extra_vars
        env:
          AUTOLAB_PVE_HOST: ${{ vars.PROXMOX_HOST }}
          AUTOLAB_PVE_TOKEN_ID: ${{ vars.PVE_EXPORTER_TOKEN_ID }}
          AUTOLAB_PVE_TOKEN_SECRET: ${{ secrets.PVE_EXPORTER_TOKEN_SECRET }}
          # The ntfy topic is the whole credential — anyone holding it can read
          # these alerts and publish to them — so it is a secret, not a variable.
          AUTOLAB_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AUTOLAB_GF_ADMIN_PASSWORD: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          AUTOLAB_BUILDER_SSH_PUBLIC_KEY: ${{ vars.BUILDER_SSH_PUBLIC_KEY }}
          # The NAS account this environment's machines mount SMB shares with.
          # Storage entries name it as credential "nas"; the values are the
          # tenant's, so they live on the tenant's environment.
          AUTOLAB_NAS_SMB_USERNAME: ${{ vars.NAS_SMB_USERNAME }}
          AUTOLAB_NAS_SMB_PASSWORD: ${{ secrets.NAS_SMB_PASSWORD }}
          # The observability stack's bridge address. A tenant VM cannot resolve
          # the stack by tailnet name, so it ships over the bridge to this.
          # Provider-owned and site-wide, hence repository-level; a tenant
          # inventory never contains the stack host, so nothing else could
          # supply it.
          AUTOLAB_OBS_STACK_ADDRESS: ${{ vars.OBSERVABILITY_STACK_ADDRESS }}
          # Shown on the login screen: which stack the host belongs to and
          # which commit its baseline came from.
          AUTOLAB_ENVIRONMENT: ${{ inputs.environment || 'lab' }}
          AUTOLAB_GIT_SHA: ${{ github.sha }}
          # The account Proxmox VE backs up with. Created on the PBS host by
          # the backup playbook and used by the hypervisor playbook (07), so
          # both read the same secret.
          AUTOLAB_PBS_PVE_PASSWORD: ${{ secrets.PBS_PVE_PASSWORD }}
        run: |
          out="$RUNNER_TEMP/extra-vars.json"
          umask 077
          python3 - "$out" <<'PY'
          import json, os, sys
          builder_key = os.environ.get("AUTOLAB_BUILDER_SSH_PUBLIC_KEY", "").strip()
          json.dump({
              # The public half of the identity installed above, so the gitops
              # account accepts the next run over the management plane. An empty
              # list is authoritative too: it removes any key installed before.
              "autolab_gitops_ssh_public_keys": [builder_key] if builder_key else [],
              "autolab_cifs_credentials": (
                  {"nas": {"username": os.environ["AUTOLAB_NAS_SMB_USERNAME"],
                           "password": os.environ["AUTOLAB_NAS_SMB_PASSWORD"]}}
                  if os.environ.get("AUTOLAB_NAS_SMB_PASSWORD") else {}
              ),
              "autolab_obs_pve_host": os.environ.get("AUTOLAB_PVE_HOST", ""),
              "autolab_obs_pve_token_id": os.environ.get("AUTOLAB_PVE_TOKEN_ID", ""),
              "autolab_obs_pve_token_secret": os.environ.get("AUTOLAB_PVE_TOKEN_SECRET", ""),
              "autolab_obs_ntfy_topic": os.environ.get("AUTOLAB_NTFY_TOPIC", ""),
              "autolab_obs_grafana_admin_password": os.environ.get("AUTOLAB_GF_ADMIN_PASSWORD", ""),
              "autolab_obs_stack_management_address": os.environ.get("AUTOLAB_OBS_STACK_ADDRESS", ""),
              "autolab_environment": os.environ.get("AUTOLAB_ENVIRONMENT", ""),
              "autolab_git_sha": os.environ.get("AUTOLAB_GIT_SHA", ""),
              "autolab_pbs_pve_password": os.environ.get("AUTOLAB_PBS_PVE_PASSWORD", ""),
          }, open(sys.argv[1], "w"))
          PY
          if [ -n "${AUTOLAB_BUILDER_SSH_PUBLIC_KEY}" ]; then
            echo "Builder public key will be installed for the gitops account."
          else
            echo "No Builder public key; the gitops account keeps no authorized keys."
          fi
          if [ -n "${AUTOLAB_NAS_SMB_PASSWORD}" ]; then
            echo "NAS SMB credential supplied for storage entries naming 'nas'."
          else
            echo "No NAS SMB credential; SMB storage entries would fail to mount."
          fi
          if [ -n "${AUTOLAB_PVE_TOKEN_ID}" ]; then
            echo "Proxmox exporter credentials supplied."
          else
            echo "No Proxmox exporter credentials; the hypervisor exporter stays disabled."
          fi
          if [ -n "${AUTOLAB_NTFY_TOPIC}" ]; then
            echo "Alert delivery configured."
          else
            echo "No ntfy topic; alerts stay in Grafana and are pushed nowhere."
          fi
          if [ -n "${AUTOLAB_GF_ADMIN_PASSWORD}" ]; then
            echo "Grafana admin password will be enforced."
          else
            echo "No Grafana admin password; the existing login is left as-is."
          fi
          if [ -n "${AUTOLAB_OBS_STACK_ADDRESS}" ]; then
            echo "Observability stack bridge address supplied for management-plane hosts."
          else
            echo "No OBSERVABILITY_STACK_ADDRESS; management-plane hosts cannot run the agent."
          fi

      # The ingress stack needs three things only the Cloudflare stack knows:
      # the tunnel token, the zone, and the hostnames. They are read from that
      # stack's state in R2 — the same bucket this job already initialised for
      # the inventory — and merged into the extra-vars file. The token never
      # touches a shell string or the log: Python reads it from tofu's stdout
      # and masks it before anything else can print it.
      - name: Read the Cloudflare stack's outputs for the ingress playbook
        if: inputs.playbook == 'ingress'
        working-directory: infra/stacks/cloudflare
        env:
          AUTOLAB_INGRESS_HOMEPAGE_CLIENT_ID: ${{ secrets.INGRESS_HOMEPAGE_CLIENT_ID }}
          AUTOLAB_INGRESS_HOMEPAGE_CLIENT_SECRET: ${{ secrets.INGRESS_HOMEPAGE_CLIENT_SECRET }}
        run: |
          for attempt in 1 2 3; do
            tofu init -input=false -backend-config="endpoint=$R2_ENDPOINT" >/dev/null && break
            [ "$attempt" = 3 ] && { echo "tofu init failed after 3 attempts" >&2; exit 1; }
            sleep $((attempt * 10))
          done
          tofu output -json > "$RUNNER_TEMP/cloudflare-outputs.json"
          python3 - "$RUNNER_TEMP/cloudflare-outputs.json" "$RUNNER_TEMP/extra-vars.json" <<'PY'
          import json, os, sys
          outputs = json.load(open(sys.argv[1]))
          token = outputs["tunnel_token"]["value"]
          print(f"::add-mask::{token}")
          extra = json.load(open(sys.argv[2]))
          extra.update({
              "autolab_ingress_tunnel_token": token,
              "autolab_ingress_zone": outputs["zone_name"]["value"],
              "autolab_ingress_hostnames": outputs["hostname_labels"]["value"],
              "autolab_ingress_homepage_client_id": os.environ.get("AUTOLAB_INGRESS_HOMEPAGE_CLIENT_ID", ""),
              "autolab_ingress_homepage_client_secret": os.environ.get("AUTOLAB_INGRESS_HOMEPAGE_CLIENT_SECRET", ""),
          })
          json.dump(extra, open(sys.argv[2], "w"))
          print(f"Tunnel {outputs['tunnel_id']['value']} for zone {outputs['zone_name']['value']}: {', '.join(outputs['hostname_labels']['value'].values())}")
          PY
          rm -f "$RUNNER_TEMP/cloudflare-outputs.json"
          if [ -n "${AUTOLAB_INGRESS_HOMEPAGE_CLIENT_ID}" ]; then
            echo "Homepage OIDC client supplied; the home route will be rendered."
          else
            echo "No INGRESS_HOMEPAGE_CLIENT_ID; the homepage keeps no route until Pocket ID has the client."
          fi

      - name: Run Builder playbook
        working-directory: builders/ansible
        run: |
          set -o pipefail
          args=(-i "$RUNNER_TEMP/inventory.json" "playbooks/${BUILDER_PLAYBOOK}.yml" --limit "$BUILDER_LIMIT")
          args+=(--extra-vars "@$RUNNER_TEMP/extra-vars.json")
          if [ -n "$BUILDER_TAGS" ]; then args+=(--tags "$BUILDER_TAGS"); fi
          if [ "$BUILDER_CONFIRM" != "apply" ]; then args+=(--check); fi
          ansible-playbook "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/ansible-output.log"
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'true'
          ANSIBLE_SSH_COMMON_ARGS: '-o StrictHostKeyChecking=yes'

      # The file holds a Proxmox token and the ntfy topic; the runner is
      # ephemeral but the step is cheap and makes the lifetime explicit.
      - name: Remove the rendered extra variables
        if: always()
        run: rm -f "$RUNNER_TEMP/extra-vars.json"

      - name: Job summary
        if: always()
        run: |
          recap="unavailable (Ansible did not run or produced no host recap)"
          if [ -f "$GITHUB_WORKSPACE/ansible-output.log" ]; then
            recap_line="$(awk '/^PLAY RECAP/{getline; print; exit}' "$GITHUB_WORKSPACE/ansible-output.log")"
            if [ -n "$recap_line" ]; then recap="$recap_line"; fi
          fi
          {
            echo "## Ansible Builder"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Environment: \`$BUILDER_ENVIRONMENT\`"
            echo "- Mode: \`$([ "$BUILDER_BOOTSTRAP" = "true" ] && echo bootstrap || echo regular)\`"
            echo "- SSH user: \`$([ "$BUILDER_BOOTSTRAP" = "true" ] && echo autolab || echo gitops)\`"
            echo "- Playbook: \`$BUILDER_PLAYBOOK\`"
            echo "- Limit: \`$BUILDER_LIMIT\`"
            echo "- Tags: \`${BUILDER_TAGS:-all roles}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Ansible recap: $recap"
          } >> "$GITHUB_STEP_SUMMARY"
