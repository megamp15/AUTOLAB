name: 96 - Renovate

# Renovate, run here rather than by a hosted service: nothing outside GitHub
# reads these repositories. It reads renovate.json, looks up newer releases
# and opens pull requests; nothing merges on its own.
#
# The token comes from a private GitHub App owned by this repository's owner
# and installed on this repository only. Each run mints a token that expires
# within the hour. Not GITHUB_TOKEN: pull requests opened with it never trigger
# workflows, so Renovate's would arrive without CI.
#
# Daily, so the Dependency Dashboard stays current; renovate.json's schedule
# (Mondays before 6am UTC) decides when pull requests are actually opened.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options: [info, debug]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint a short-lived token from the Renovate app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Renovate
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          token: ${{ steps.app.outputs.token }}
          # The action's default floats on the major version; pinned like
          # everything else here, and bumped by Renovate itself.
          renovate-version: 44.126.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits go through the API, so GitHub signs them as the app.
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}

      # One ntfy message per run, to the topic Grafana's alerts use: whether it
      # worked and which Renovate pull requests are open.
      - name: Tell ntfy
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "No NTFY_TOPIC; nothing sent."; exit 0; }
          prs=$(gh pr list -R "$GITHUB_REPOSITORY" --label dependencies --json number,title \
                  -q '.[] | "#\(.number) \(.title)"' 2>/dev/null || true)
          if [ "$RESULT" = success ]; then
            title="Renovate ran on ${GITHUB_REPOSITORY#*/}"; prio=default; tags=package
          else
            title="Renovate failed on ${GITHUB_REPOSITORY#*/}"; prio=high; tags=warning
          fi
          body=$(printf '%s\n\n%s' "${prs:-No update pull requests open.}" "$RUN_URL")
          curl -fsS -H "Title: $title" -H "Priority: $prio" -H "Tags: $tags" -H "Click: $RUN_URL" \
            -d "$body" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
