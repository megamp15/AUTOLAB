name: 99 - OpenTofu Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Stack name under infra/stacks
        required: true
        default: lab
        type: choice
        options:
          - lab
      parallelism:
        description: "OpenTofu parallelism (1 = sequential, safe for Proxmox; 10 = default parallel)"
        type: choice
        required: false
        default: "1"
        options:
          - "1"
          - "10"
      confirm:
        description: Type DESTROY to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: opentofu-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      env_dir: ${{ steps.context.outputs.env_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/opentofu-preflight
        id: context
        with:
          environment: ${{ inputs.environment }}

      - name: Validate inputs
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Type DESTROY in the confirm input to run this workflow."
            exit 1
          fi

      - name: Final job summary
        if: always()
        run: |
          {
            echo "## OpenTofu Destroy Preflight"
            echo
            echo "- Environment: \`${{ steps.context.outputs.environment }}\`"
            echo "- Directory: \`${{ steps.context.outputs.env_dir }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    needs: preflight
    if: inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-opentofu-pipeline
        with:
          env_dir: ${{ needs.preflight.outputs.env_dir }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          proxmox_host: ${{ vars.PROXMOX_HOST }}
          proxmox_port: ${{ vars.PROXMOX_PORT || '8006' }}
          proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          proxmox_insecure_tls: ${{ vars.PROXMOX_INSECURE_TLS || 'true' }}
          proxmox_node_name: ${{ vars.PROXMOX_NODE_NAME }}
          pve_ssh_private_key: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
          pve_ssh_username: root
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_account_id: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Destroy plan
        id: plan
        working-directory: ${{ needs.preflight.outputs.env_dir }}
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_VM_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_VM_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          plan_output="destroy-plan.txt"
          if ! tofu plan -destroy -input=false -no-color \
            -parallelism="${{ inputs.parallelism || '1' }}" \
            -out=tfplan > "$plan_output"; then
            cat "$plan_output"
            exit 1
          fi
          tofu show -no-color tfplan > "$plan_output"
          cat "$plan_output"
          summary_line="$(grep -E '^(Plan:|No changes\.)' "$plan_output" | tail -n 1 || true)"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            printf 'summary_line=%s\n' "${summary_line:-Destroy plan completed.}" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply destroy plan
        working-directory: ${{ needs.preflight.outputs.env_dir }}
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_VM_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_VM_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          tofu apply -input=false -auto-approve -no-color \
            -parallelism="${{ inputs.parallelism || '1' }}" tfplan | tee destroy-apply.txt

      - name: Upload destroy plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentofu-${{ needs.preflight.outputs.environment }}-destroy-plan
          path: ${{ needs.preflight.outputs.env_dir }}/destroy-plan.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload destroy apply log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentofu-${{ needs.preflight.outputs.environment }}-destroy-apply
          path: ${{ needs.preflight.outputs.env_dir }}/destroy-apply.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Job summary
        if: always()
        working-directory: ${{ needs.preflight.outputs.env_dir }}
        run: |
          apply_summary="Destroy apply did not complete."
          if [ -f destroy-apply.txt ]; then
            apply_summary="$(grep -E '^Apply complete!' destroy-apply.txt | tail -n 1 || true)"
          fi

          {
            echo "## OpenTofu destroy"
            echo
            echo "- Environment: \`${{ needs.preflight.outputs.environment }}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Plan: ${{ steps.plan.outputs.summary_line || 'did not complete' }}"
            echo "- Apply: ${apply_summary:-not available}"
          } >> "$GITHUB_STEP_SUMMARY"

  destroy-rejected:
    name: Destroy Rejected
    runs-on: ubuntu-latest
    if: inputs.confirm != 'DESTROY'
    steps:
      - name: Rejection Notice
        run: |
          echo "========================================================"
          echo "❌ OPENTOFU DESTROY REJECTED"
          echo "========================================================"
          echo "You must type 'DESTROY' in the confirm field to destroy the stack."
          echo "========================================================"
          exit 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## OpenTofu destroy rejected"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Confirmation was not \`DESTROY\`; no changes were made."
          } >> "$GITHUB_STEP_SUMMARY"
