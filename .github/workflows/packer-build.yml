name: Packer Build

run-name: Build ${{ inputs.template }} Packer template

on:
  workflow_dispatch:
    inputs:
      template:
        description: "Template to build"
        required: true
        default: debian-13
        type: choice
        options:
          - debian-13
          - ubuntu-26.04

permissions:
  contents: read

concurrency:
  group: packer-build
  cancel-in-progress: false

jobs:
  build-template:
    name: Build ${{ inputs.template }} template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-packer-pipeline
        with:
          template: ${{ inputs.template }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          proxmox_host: ${{ vars.PROXMOX_HOST }}
          pve_ssh_username: root
          proxmox_port: ${{ vars.PROXMOX_PORT || '8006' }}
          proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          proxmox_node_name: ${{ vars.PROXMOX_NODE_NAME }}
          proxmox_insecure_tls: ${{ vars.PROXMOX_INSECURE_TLS || 'true' }}
          ssh_password: ${{ secrets.PACKER_SSH_PASSWORD }}
          pve_ssh_private_key: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
          ssh_public_keys: ${{ vars.SSH_PUBLIC_KEYS }}
          pve_http_ip: ${{ vars.PROXMOX_PACKER_PRESEED_IP || vars.PROXMOX_LAN_IP }}
          network_bridge: ${{ vars.PROXMOX_PACKER_NETWORK_BRIDGE || 'vmbr0' }}

      - name: Stage Debian preseed on PVE
        if: inputs.template == 'debian-13'
        env:
          AUTOLAB_PRESEED_PASSWORD: ${{ secrets.PACKER_SSH_PASSWORD }}
          AUTOLAB_PRESEED_KEYS: ${{ vars.SSH_PUBLIC_KEYS }}
          AUTOLAB_PVE_HOST: ${{ vars.PROXMOX_HOST }}
        run: |
          set -euo pipefail
          bash scripts/render-debian-preseed.sh > "${RUNNER_TEMP}/debian-preseed.cfg"
          remote_dir="/var/tmp/autolab-debian-preseed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_opts=(-i "${HOME}/.ssh/pve_ci_key" -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "root@${AUTOLAB_PVE_HOST}" \
            "rm -rf '${remote_dir}' && install -d -m 700 '${remote_dir}'"
          scp "${ssh_opts[@]}" "${RUNNER_TEMP}/debian-preseed.cfg" \
            "root@${AUTOLAB_PVE_HOST}:${remote_dir}/preseed.cfg"
          server_pid="$(ssh "${ssh_opts[@]}" "root@${AUTOLAB_PVE_HOST}" \
            "nohup python3 -m http.server 8100 --bind 0.0.0.0 --directory '${remote_dir}' >/var/tmp/autolab-debian-preseed-${GITHUB_RUN_ID}.log 2>&1 </dev/null & echo \$!")"
          source scripts/lib/github-env.sh
          append_github_env AUTOLAB_PVE_PRESEED_DIR "${remote_dir}"
          append_github_env AUTOLAB_PVE_PRESEED_PID "${server_pid}"
          ssh "${ssh_opts[@]}" "root@${AUTOLAB_PVE_HOST}" \
            "test -s '${remote_dir}/preseed.cfg' && kill -0 '${server_pid}' && sha256sum '${remote_dir}/preseed.cfg'"

      - name: Verify Tailscale connectivity
        run: |
          echo "Waiting for Tailscale routing to establish..."
          sleep 5
          tailscale status
          echo "Checking connectivity to PVE..."
          tailscale ping ${{ vars.PROXMOX_HOST }} || true

      - name: Initialize Packer
        working-directory: ${{ env.AUTOLAB_PACKER_TEMPLATE_DIR }}
        run: packer init .

      - name: Validate Packer configuration
        working-directory: ${{ env.AUTOLAB_PACKER_TEMPLATE_DIR }}
        run: packer validate .

      - name: Build template
        working-directory: ${{ env.AUTOLAB_PACKER_TEMPLATE_DIR }}
        run: |
          echo "========================================================"
          echo "🔨 BUILDING PROXMOX VM TEMPLATE: ${{ inputs.template }}"
          echo "========================================================"
          echo "   • Catalog entry: ${AUTOLAB_PACKER_TEMPLATE_DESCRIPTION}"
          echo "   • Template file: ${AUTOLAB_PACKER_TEMPLATE_FILE}"
          echo "========================================================"

          log="${RUNNER_TEMP}/packer-proxmox.log"
          trap 'rm -f "$log"' EXIT

          if ! PACKER_LOG=1 PACKER_LOG_PATH="$log" packer build .; then
            grep -F 'failed to download iso from' "$log" ||
              echo "No PVE API error line; inspect normal output for a checksum preflight error."
            exit 1
          fi

      - name: Build summary
        if: always()
        run: |
          echo "========================================================"
          echo "🏗️ PACKER BUILD COMPLETED"
          echo "========================================================"
          echo "📋 Summary:"
          echo "   • Template: ${{ inputs.template }}"
          echo "   • Status: ${{ job.status }}"
          echo "========================================================"
          echo ""
          echo "📝 Next Steps:"
          echo "   1. Run OpenTofu Plan to verify the template is available"
          echo "   2. Run OpenTofu Apply to create VMs from this Packer template"
          echo "========================================================"

      - name: Cleanup Debian preseed server
        if: always() && inputs.template == 'debian-13'
        env:
          AUTOLAB_PVE_HOST: ${{ vars.PROXMOX_HOST }}
        run: |
          set +e
          if [[ -n "${AUTOLAB_PVE_PRESEED_PID:-}" ]]; then
            ssh -i "${HOME}/.ssh/pve_ci_key" -o BatchMode=yes \
              "root@${AUTOLAB_PVE_HOST}" \
              "kill '${AUTOLAB_PVE_PRESEED_PID}' 2>/dev/null || true; rm -rf '${AUTOLAB_PVE_PRESEED_DIR:-}' '/var/tmp/autolab-debian-preseed-${GITHUB_RUN_ID}.log'"
          fi
