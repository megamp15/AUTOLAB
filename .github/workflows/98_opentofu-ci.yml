name: 98 - OpenTofu CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    # Every stack, not just the first one. A tenant stack that fails to
    # validate would otherwise merge green and only break on dispatch.
    strategy:
      fail-fast: false
      matrix:
        stack: [lab, qnta]
    defaults:
      run:
        working-directory: infra/stacks/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-opentofu

      - name: Check formatting
        run: tofu fmt -check -recursive ../..

      - name: Init without backend
        run: |
          for attempt in 1 2 3; do
            tofu init -backend=false && break
            [ "$attempt" = 3 ] && { echo "failed after 3 attempts" >&2; exit 1; }
            echo "attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Validate
        run: tofu validate

      - name: Final job summary
        if: always()
        run: |
          {
            echo "## OpenTofu CI"
            echo
            echo "- Environment: \`${{ matrix.stack }}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Checks: formatting, init, and validation"
          } >> "$GITHUB_STEP_SUMMARY"
