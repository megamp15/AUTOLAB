name: 98 - OpenTofu CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/stacks/lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-opentofu

      - name: Check formatting
        run: tofu fmt -check -recursive ../..

      - name: Init without backend
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate

      - name: Final job summary
        if: always()
        run: |
          {
            echo "## OpenTofu CI"
            echo
            echo "- Environment: \`lab\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Checks: formatting, init, and validation"
          } >> "$GITHUB_STEP_SUMMARY"
