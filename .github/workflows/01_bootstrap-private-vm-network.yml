name: 01 - Bootstrap private VM network

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/connect-tailscale
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

      - name: Configure SSH to Proxmox
        env:
          PVE_HOST: ${{ vars.PROXMOX_HOST }}
          PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${PVE_HOST}"
          test -n "${PVE_SSH_PRIVATE_KEY}"
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${PVE_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/pve_ci_key"
          chmod 600 "${HOME}/.ssh/pve_ci_key"
          ssh-keyscan -H "${PVE_HOST}" >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true

      - name: Install and apply private VM network
        env:
          PVE_HOST: ${{ vars.PROXMOX_HOST }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/pve_ci_key" -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "root@${PVE_HOST}" 'mkdir -p /root/proxmox-setup/scripts'
          scp "${ssh_opts[@]}" docs/proxmox/scripts/setup-private-vm-network.sh \
            "root@${PVE_HOST}:/root/proxmox-setup/scripts/"
          ssh "${ssh_opts[@]}" "root@${PVE_HOST}" \
            'bash /root/proxmox-setup/scripts/setup-private-vm-network.sh --apply'
          ssh "${ssh_opts[@]}" "root@${PVE_HOST}" \
            'ip -br -4 addr show vmbr1; systemctl is-active dnsmasq autolab-private-vm-network.service'

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Bootstrap private VM network"
            echo
            echo "- Proxmox host: \`${{ vars.PROXMOX_HOST }}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
