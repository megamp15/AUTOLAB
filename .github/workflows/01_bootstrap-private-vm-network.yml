name: 01 - Bootstrap private VM network

on:
  workflow_dispatch:
    inputs:
      node:
        description: "Proxmox node to give its private VM network"
        required: true
        default: xps-pve
        type: choice
        options:
          - xps-pve
          - pve

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      # Referenced so the runner masks it from the job's first log line. A
      # public log then shows `xps-pve.***`. Not a secret, just not published.
      AUTOLAB_TAILNET_DOMAIN: ${{ secrets.TAILNET_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The node's name picks its token and gives its host; nothing about a
      # node is stored per workflow.
      - name: Resolve the Proxmox node
        id: node
        env:
          NODE: ${{ inputs.node }}
        run: |
          set -euo pipefail
          bash scripts/resolve-proxmox-node.sh --node "$NODE" >> "$GITHUB_OUTPUT"
          echo "host=${NODE}.${AUTOLAB_TAILNET_DOMAIN}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/connect-tailscale
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

      - name: Configure SSH to Proxmox
        env:
          PVE_HOST: ${{ steps.node.outputs.host }}
          PVE_SSH_PRIVATE_KEY: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${PVE_HOST}"
          test -n "${PVE_SSH_PRIVATE_KEY}"
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${PVE_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/pve_ci_key"
          chmod 600 "${HOME}/.ssh/pve_ci_key"
          ssh-keyscan -H "${PVE_HOST}" >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true

      - name: Install and apply private VM network
        env:
          PVE_HOST: ${{ steps.node.outputs.host }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "${HOME}/.ssh/pve_ci_key" -o BatchMode=yes)
          ssh "${ssh_opts[@]}" "root@${PVE_HOST}" 'mkdir -p /root/proxmox-setup/scripts'
          scp "${ssh_opts[@]}" docs/proxmox/scripts/setup-private-vm-network.sh \
            "root@${PVE_HOST}:/root/proxmox-setup/scripts/"
          ssh "${ssh_opts[@]}" "root@${PVE_HOST}" \
            'bash /root/proxmox-setup/scripts/setup-private-vm-network.sh --apply'
          ssh "${ssh_opts[@]}" "root@${PVE_HOST}" \
            'ip -br -4 addr show vmbr1; systemctl is-active dnsmasq autolab-private-vm-network.service'

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Bootstrap private VM network"
            echo
            echo "- Proxmox host: \`${{ steps.node.outputs.host }}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
