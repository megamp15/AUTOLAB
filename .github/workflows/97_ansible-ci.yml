name: 97 - Ansible CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builders/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Match 05_ansible-builder.yml. Linting on a different Python than the
          # Builder runs on is how a version-specific break reaches a real host.
          python-version: '3.13'

      - name: Install ansible-core and ansible-lint
        # Same pin as 05_ansible-builder.yml. Unpinned here meant lint ran on a
        # newer core than the Builder actually used, so a runtime break in the
        # pinned version passed lint unnoticed.
        run: python3 -m pip install --quiet 'ansible-core>=2.21,<2.22' ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check every playbook against the example inventory
        run: |
          for playbook in playbooks/*.yml; do
            echo "==> ${playbook}"
            ansible-playbook -i inventories/lab/hosts.example.yml --syntax-check "${playbook}"
          done

      - name: ansible-lint (production profile, see .ansible-lint)
        run: ansible-lint playbooks roles

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Ansible CI"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Checks: playbook syntax-check and ansible-lint (production profile)"
          } >> "$GITHUB_STEP_SUMMARY"
