name: 03 - OpenTofu Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Stack name under infra/stacks
        required: true
        default: lab
        type: choice
        options:
          - lab
          - qnta
      upload_plan_text:
        description: Upload text plan artifact
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
permissions:
  contents: read

concurrency:
  group: opentofu-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.context.outputs.environment }}
      env_dir: ${{ steps.context.outputs.env_dir }}
      text_artifact_name: ${{ steps.artifacts.outputs.text_artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/opentofu-preflight
        id: context
        with:
          environment: ${{ inputs.environment }}

      - name: Compute artifact names
        id: artifacts
        run: |
          echo "text_artifact_name=opentofu-${{ steps.context.outputs.environment }}-plan-text" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## OpenTofu Plan Preflight"
            echo
            echo "- Environment: \`${{ steps.context.outputs.environment }}\`"
            echo "- Directory: \`${{ steps.context.outputs.env_dir }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    needs: preflight
    runs-on: ubuntu-latest
    # The GitHub Environment named after the stack supplies the tenant's
    # tailnet credentials (TAILSCALE_VM_OAUTH_*) and tag; the provider's own
    # stack falls through to the repository-level values.
    environment: ${{ inputs.environment }}
    env:
      # Referenced so the runner masks it from the job's first log line. A
      # public log then shows `xps-pve.***`. Not a secret, just not published.
      AUTOLAB_TAILNET_DOMAIN: ${{ secrets.TAILNET_DOMAIN }}
      TF_VAR_tailscale_vm_tag: ${{ vars.TAILSCALE_VM_TAG || 'tag:autolab-vm' }}
      TF_VAR_builder_ssh_public_key: ${{ vars.BUILDER_SSH_PUBLIC_KEY }}
      TF_VAR_nas_server: ${{ vars.NAS_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Stack names its node; the node's name picks its token and gives
      # its host. Nothing about a node is stored per workflow.
      - name: Resolve the Stack's Proxmox node
        id: node
        env:
          STACK_DIR: ${{ needs.preflight.outputs.env_dir }}
        run: bash scripts/resolve-proxmox-node.sh --stack "$STACK_DIR" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-opentofu-pipeline
        with:
          env_dir: ${{ needs.preflight.outputs.env_dir }}
          tailscale_oauth_client_id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          proxmox_host: ${{ format('{0}.{1}', steps.node.outputs.name, secrets.TAILNET_DOMAIN) }}
          proxmox_port: ${{ vars.PROXMOX_PORT || '8006' }}
          proxmox_api_token: ${{ secrets[format('PROXMOX_API_TOKEN_{0}', steps.node.outputs.key)] }}
          proxmox_insecure_tls: ${{ vars.PROXMOX_INSECURE_TLS || 'true' }}
          proxmox_node_name: ${{ steps.node.outputs.name }}
          pve_ssh_private_key: ${{ secrets.PVE_SSH_PRIVATE_KEY }}
          # gitops, not root: the tailnet SSH policy grants CI exactly that account
          # on the hypervisor (root was dropped once playbooks/proxmox.yml created
          # it). The provider sudo-wraps pvesm, qm and tee for a non-root user, and
          # gitops holds passwordless sudo. Uploading a cloud-init snippet as root
          # is what the first tenant apply died on.
          pve_ssh_username: gitops
          r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Plan
        id: plan
        working-directory: ${{ needs.preflight.outputs.env_dir }}
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_VM_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_VM_OAUTH_SECRET }}
        run: bash ${{ github.workspace }}/scripts/tofu-plan.sh

      - name: Upload text plan
        if: inputs.upload_plan_text == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.text_artifact_name }}
          path: ${{ needs.preflight.outputs.env_dir }}/plan.txt
          retention-days: 3

      - name: Final job summary
        if: always()
        working-directory: ${{ needs.preflight.outputs.env_dir }}
        run: |
          {
            echo "## OpenTofu plan"
            echo
            echo "- Environment: \`${{ needs.preflight.outputs.environment }}\`"
            echo "- Result: \`${{ job.status }}\`; changes: \`${{ steps.plan.outputs.has_changes || 'unknown' }}\`"
            echo "- Plan: ${{ steps.plan.outputs.summary_line || 'did not complete' }}"
            echo "- Text artifact: \`${{ inputs.upload_plan_text }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
