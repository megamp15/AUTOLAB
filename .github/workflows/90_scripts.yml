name: 90 - Scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bash syntax check (all scripts)
        run: |
          find docs/proxmox/scripts scripts -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            echo "==> $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          shellcheck --version | sed -n 2p
          find docs/proxmox/scripts scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning

      - name: Install yamllint
        run: python3 -m pip install --quiet yamllint

      - name: yamllint (workflows, actions, schemas, Ansible)
        run: |
          yamllint .github/ builders/ansible/ \
            infra/connection-schema.yaml infra/packer/template-schema.yaml \
            infra/packer/template-catalog.yaml infra/r2-config.yaml \
            docs/proxmox/config/network-env-schema.yaml

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Check schema drift
        run: bash scripts/check-schema-drift.sh

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5

      - name: Validate generated OpenTofu artifacts
        run: |
          tofu fmt -check -recursive infra
          tofu -chdir=infra/stacks/lab init -backend=false -input=false
          tofu -chdir=infra/stacks/lab validate

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0

      - name: Install seed CD tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso

      - name: Validate generated Packer artifacts
        run: |
          ssh-keygen -q -t ed25519 -N '' -f /tmp/validation-bastion-key
          # Validate every catalog entry with status: implemented. The resolver
          # rejects blocked/experiment entries, and a resolver failure must fail
          # the job instead of silently reusing the previous template's variables.
          templates="$(yq -r '.templates[] | select(.status == "implemented") | .name' infra/packer/template-catalog.yaml)"
          echo "Implemented templates: ${templates//$'\n'/ }"
          for template in $templates; do
            resolved="$(bash scripts/resolve-packer-template.sh "$template")"
            eval "$resolved"
            export PKR_VAR_vm_id PKR_VAR_vm_template_name PKR_VAR_iso_url PKR_VAR_iso_checksum
            export PKR_VAR_ssh_bastion_host=pve.example.ts.net
            export PKR_VAR_ssh_bastion_username=root
            export PKR_VAR_ssh_bastion_private_key_file=/tmp/validation-bastion-key
            export PKR_VAR_ssh_password=validation-only
            export PKR_VAR_packer_password_hash="$(printf '%s\n' validation-only | openssl passwd -6 -stdin)"
            if [[ "$template" == "debian-13" ]]; then
              export PKR_VAR_pve_http_ip=192.168.50.10
            fi
            proxmox_host=pve.example.ts.net
            proxmox_port=8006
            proxmox_endpoint="https://${proxmox_host}:${proxmox_port}"
            (
              cd "$AUTOLAB_PACKER_TEMPLATE_DIR"
              packer init .
              packer validate \
                -var "proxmox_endpoint=${proxmox_endpoint}" \
                -var 'proxmox_api_token=USER@pam!TOKENID=TOKEN_SECRET' \
                -var 'proxmox_node_name=pve' \
                .
            )
          done

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run bats tests
        run: bats docs/proxmox/scripts/tests/

      - name: Run Python unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Run Tailscale device cleanup self-check
        run: bash scripts/test_tailscale-device-delete.sh

      - name: Bootstrap dry-run in a clean Debian container
        run: bash scripts/bootstrap-dry-run.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Scripts validation"
            echo
            echo "- Result: \`${{ job.status }}\`"
            echo "- Checks: Bash syntax, ShellCheck, yamllint, schema drift, OpenTofu, Packer, Bats, Python unit tests, Tailscale cleanup self-check, and bootstrap dry-run"
          } >> "$GITHUB_STEP_SUMMARY"
