name: Feature request
description: Propose a guide, script, module, role, or workflow change.
labels: [enhancement]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Bootstrap
        - Provision
        - Template
        - Configure
        - CI / tooling
        - Documentation
        - VPS track (future)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Mention whether it touches a schema YAML, a generated adapter, or the committed machine map.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This fits the roadmap and non-goals in docs/ROADMAP.md.
