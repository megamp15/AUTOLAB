name: Bug report
description: Something in a guide, script, module, or workflow did not work.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bootstrap (docs/proxmox scripts, network wizard, failover)
        - Provision (OpenTofu, Terramate, R2 state, plan/apply/destroy)
        - Template (Packer catalog, template builds)
        - Configure (Ansible Builder, workflow 05)
        - CI / GitHub Actions
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        For bootstrap issues include `pveversion -v`, `ip -br link`, and whether USB Ethernet was plugged in.
        For CI issues link the workflow run.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Redact Wi-Fi passwords, API tokens, auth keys, and real public IPs before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and site-specific values from everything above.
          required: true
