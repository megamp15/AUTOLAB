name: Setup OpenTofu
description: >
  Install OpenTofu and Terramate, generate Terramate configs, and configure
  the Terraform plugin cache.

inputs:
  tofu_version:
    description: OpenTofu version to install
    required: false
    default: '1.12.5'

runs:
  using: composite
  steps:
    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ inputs.tofu_version }}

    - name: Setup Terramate
      uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201 # v3.3.0
      with:
        version: '0.6.0'

    - name: Generate Terramate configs
      shell: bash
      working-directory: infra
      run: terramate generate

    - name: Prepare plugin cache directory
      shell: bash
      run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: opentofu-${{ runner.os }}-${{ hashFiles('infra/**/.terraform.lock.hcl', 'infra/_base/**') }}
        restore-keys: |
          opentofu-${{ runner.os }}-
