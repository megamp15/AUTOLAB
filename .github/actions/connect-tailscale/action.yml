name: Connect Tailscale
description: Connect the CI runner to a Tailscale network for Proxmox access.

inputs:
  oauth-client-id:
    description: Tailscale OAuth client ID
    required: true
  oauth-secret:
    description: Tailscale OAuth secret
    required: false
    default: ''
  audience:
    description: Tailscale OIDC audience
    required: false
    default: ''
  tags:
    description: Tailscale tags for the CI runner
    required: false
    default: 'tag:ci-runner'
  version:
    description: >-
      Tailscale client version for the runner. The upstream action pins an older
      default (1.94.2 as of v4.1.3) that lags the release it ships with, so the
      runner joins the tailnet several minor versions behind every managed host.
      `latest` tracks current stable, which is the same track the VMs follow via
      the tailscale-update role.
    required: false
    default: 'latest'

  mask-tailnet-of:
    description: >-
      A tailnet hostname such as the Proxmox node's. Its domain part is
      masked in the job log before anything prints it, so a public workflow
      log shows `xps-pve.***` rather than the tailnet name. Not a secret,
      just not worth publishing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Mask the tailnet name in this job's log
      if: inputs.mask-tailnet-of != ''
      shell: bash
      env:
        AUTOLAB_MASK_HOST: ${{ inputs.mask-tailnet-of }}
      run: |
        domain="${AUTOLAB_MASK_HOST#*.}"
        [[ -n "$domain" && "$domain" != "$AUTOLAB_MASK_HOST" ]] && echo "::add-mask::$domain"
        true

    - name: Connect to Tailscale
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        oauth-client-id: ${{ inputs.oauth-client-id }}
        oauth-secret: ${{ inputs.oauth-secret }}
        audience: ${{ inputs.audience }}
        tags: ${{ inputs.tags }}
        version: ${{ inputs.version }}
