autolab_nas_selected_project: immich
autolab_nas_projects:
  - immich
  - photo-sort
  - immich-export
autolab_nas_source_files:
  - immich/docker-compose.yaml
  - photo-sort/docker-compose.yaml
  - photo-sort/sort.py
  - photo-sort/dupes.py
  - immich-export/docker-compose.yaml
  - immich-export/export.sh
