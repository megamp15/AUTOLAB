---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

# In check mode the install above reports what it would do without doing it, so
# on a host that has never been hardened the ufw binary is still absent and
# every community.general.ufw task below fails with "Failed to find required
# executable". That turns a dry run against a brand-new machine — the case where
# a dry run matters most — into an error rather than a preview.
- name: Detect whether the UFW binary is present
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: autolab_ufw_binary
  changed_when: false

- name: Create firewall state directory
  ansible.builtin.file:
    path: "{{ autolab_firewall_manifest_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check for Builder-managed firewall manifest
  ansible.builtin.stat:
    path: "{{ autolab_firewall_manifest_path }}"
  register: autolab_firewall_manifest_stat

- name: Read Builder-managed firewall manifest
  ansible.builtin.slurp:
    src: "{{ autolab_firewall_manifest_path }}"
  register: autolab_firewall_manifest
  changed_when: false
  when: autolab_firewall_manifest_stat.stat.exists

- name: Initialize managed firewall rules
  ansible.builtin.set_fact:
    autolab_firewall_managed_rules: []
    autolab_firewall_desired_rules: []

- name: Load previously managed firewall rules
  ansible.builtin.set_fact:
    autolab_firewall_managed_rules: "{{ autolab_firewall_manifest.content | b64decode | from_yaml }}"
  when:
    - autolab_firewall_manifest.content is defined

- name: Normalize desired firewall rules
  ansible.builtin.set_fact:
    autolab_firewall_desired_rules: >-
      {{ autolab_firewall_desired_rules + [{
        'port': item.port | string,
        'protocol': item.protocol | string,
        'source': item.source | default('any', true) | string
      }] }}
  loop: "{{ autolab_firewall_rules }}"

- name: Remove stale Builder-managed firewall rules
  community.general.ufw:
    rule: allow
    delete: true
    direction: in
    port: "{{ item.port }}"
    proto: "{{ item.protocol }}"
    from_ip: "{{ item.source }}"
  loop: "{{ autolab_firewall_managed_rules | difference(autolab_firewall_desired_rules) }}"
  when:
    - not ansible_check_mode or autolab_ufw_binary.stat.exists

- name: Allow inbound management over Tailscale
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
  when:
    - not ansible_check_mode or autolab_ufw_binary.stat.exists

- name: Allow declared inbound services
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item.port }}"
    proto: "{{ item.protocol }}"
    from_ip: "{{ item.source }}"
  loop: "{{ autolab_firewall_desired_rules }}"
  when:
    - not ansible_check_mode or autolab_ufw_binary.stat.exists

- name: Enforce default-deny inbound firewall policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when:
    - not ansible_check_mode or autolab_ufw_binary.stat.exists

- name: Atomically persist Builder-managed firewall rules
  ansible.builtin.copy:
    content: "{{ autolab_firewall_desired_rules | to_nice_yaml }}"
    dest: "{{ autolab_firewall_manifest_path }}"
    owner: root
    group: root
    mode: '0600'
