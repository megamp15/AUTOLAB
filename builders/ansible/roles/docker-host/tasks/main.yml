---
- name: Install Docker when enabled for this machine
  ansible.builtin.apt:
    name: "{{ autolab_docker_packages }}"
    state: present
  when: autolab_docker_enabled | bool

- name: Enable Docker when enabled for this machine
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: autolab_docker_enabled | bool

- name: Bound the container logs
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  when: autolab_docker_enabled | bool
  notify: Reload the Docker daemon
