---
- name: Install Docker when enabled for this machine
  ansible.builtin.apt:
    name: "{{ autolab_docker_packages }}"
    state: present
  register: autolab_docker_install
  when: autolab_docker_enabled | bool

# Ubuntu guests built before the line above got Compose v1 instead; nothing
# of ours runs it, and a second `docker-compose` on the PATH only misleads.
- name: Remove Compose v1 where v2 is its own package
  ansible.builtin.apt:
    name: docker-compose
    state: absent
  when:
    - autolab_docker_enabled | bool
    - autolab_docker_compose_package != 'docker-compose'

# In check mode on a host that never had Docker, the install above only says
# it would happen, and there is no unit yet for systemd to find. The six new
# qnta guests failed their first check here while the apply went through.
- name: Enable Docker when enabled for this machine
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when:
    - autolab_docker_enabled | bool
    - not (ansible_check_mode and autolab_docker_install is changed)

- name: Bound the container logs
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    # dockerd refuses to start on any key it does not know, and a reload
    # with a bad file only logs and keeps the old config, so the mistake
    # surfaces at the next reboot with every container down. Check the
    # file before it lands instead. JSON has no comments, so the "managed
    # by" note lives here and not in the file.
    validate: dockerd --validate --config-file %s
  when: autolab_docker_enabled | bool
  notify: Reload the Docker daemon

# A published container port is reached through FORWARD, not INPUT, so UFW's
# default-deny never sees it: Docker's own rules accept it first. Compose
# stacks here dodge that by binding to the tailnet address, but a Swarm
# service cannot bind to an address at all, and its published port answers
# on every interface. DOCKER-USER is the chain Docker leaves for this and
# never rewrites; UFW loads it at boot, before Docker starts. New connections
# that arrive on the host's own uplink are dropped; replies to what the
# containers started, the tailnet, and traffic between containers pass. A
# port the machines map opens (firewall_rules) passes from its declared
# source: aurora publishes Jellyfin to the home network this way. A rule with
# `countries` passes only from those countries' address sets (made above). The match is
# on the port the client dialled, which Docker's DNAT has already rewritten by
# the time FORWARD sees the packet, so conntrack's original port is used.
# Country sets before the rules that name them: UFW refuses a file that
# matches a set which does not exist, and would then load nothing at all.
- name: Install ipset for the country limits
  ansible.builtin.apt:
    name: [ipset, curl]
    state: present
  when:
    - autolab_docker_enabled | bool
    - autolab_docker_countries | length > 0

- name: Install the country set script
  ansible.builtin.copy:
    src: autolab-geoip
    dest: /usr/local/sbin/autolab-geoip
    owner: root
    group: root
    mode: "0755"
  when:
    - autolab_docker_enabled | bool
    - autolab_docker_countries | length > 0

- name: Install the country set units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [autolab-geoip-boot.service, autolab-geoip-refresh.service, autolab-geoip-refresh.timer]
  register: autolab_docker_geoip_units
  when:
    - autolab_docker_enabled | bool
    - autolab_docker_countries | length > 0

- name: Make the country sets at boot, and fetch them weekly
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: "{{ autolab_docker_geoip_units is changed }}"
  loop: [autolab-geoip-boot.service, autolab-geoip-refresh.timer]
  when:
    - autolab_docker_enabled | bool
    - autolab_docker_countries | length > 0
    - not ansible_check_mode

# Fetched now, so the port is open to those countries from this run on rather
# than from the first weekly fetch. A failed fetch fails the run: the sets
# would be empty, and the port closed to everyone.
- name: Fetch the country sets
  ansible.builtin.command:
    argv: "{{ ['/usr/local/sbin/autolab-geoip', 'refresh'] + autolab_docker_countries }}"
  register: autolab_docker_geoip_fetch
  changed_when: false
  when:
    - autolab_docker_enabled | bool
    - autolab_docker_countries | length > 0
    - not ansible_check_mode

- name: Look for UFW's rules file
  ansible.builtin.stat:
    path: /etc/ufw/after.rules
  register: autolab_docker_ufw_rules
  when: autolab_docker_enabled | bool

- name: Make published container ports follow the host firewall
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} AUTOLAB docker-host: published ports follow UFW"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      {% for rule in autolab_docker_open_ports %}
      {% set src = rule.source | default('any', true) %}
      {% set from = (' -s ' ~ src) if src != 'any' else '' %}
      {% set new = ' -m conntrack --ctstate NEW --ctorigdstport ' ~ rule.port ~ ' -j RETURN' %}
      {% for cc in (rule.countries | default([], true) | map('lower')) %}
      -A DOCKER-USER -i {{ autolab_docker_uplink }} -p {{ rule.protocol }}{{ from }} -m set --match-set autolab-geo-{{ cc }} src{{ new }}
      {% else %}
      -A DOCKER-USER -i {{ autolab_docker_uplink }} -p {{ rule.protocol }}{{ from }}{{ new }}
      {% endfor %}
      {% endfor %}
      -A DOCKER-USER -i {{ autolab_docker_uplink }} -m conntrack --ctstate NEW -j DROP
      -A DOCKER-USER -j RETURN
      COMMIT
  when:
    - autolab_docker_enabled | bool
    - autolab_docker_uplink | length > 0
    # The firewall role installs UFW; a host without it has no file to add to.
    - autolab_docker_ufw_rules.stat.exists | default(false)
  notify: Reload UFW
