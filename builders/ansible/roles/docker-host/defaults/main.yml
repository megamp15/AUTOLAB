---
autolab_docker_enabled: "{{ (autolab_builder | default({})).docker_enabled | default(false) }}"

# docker.io alone gives the daemon and CLI but no Compose. Debian 13 packages
# Compose v2 (2.26.x) as `docker-compose` and installs it at the CLI plugin
# path, so `docker compose` works and no third-party repository is needed.
#
# Compose is how nearly anything non-trivial gets run, so a host with Docker but
# without it is half-installed — and community.docker.docker_compose_v2 refuses
# to run at all without the plugin.
autolab_docker_packages:
  - docker.io
  - docker-compose
