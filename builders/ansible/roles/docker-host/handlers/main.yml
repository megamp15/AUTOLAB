---
# Reload, not restart. A restart stops every container on the host; the log
# options below are read when a container is created, so a reload is enough
# for the next one and a restart would buy nothing but downtime.
- name: Reload the Docker daemon
  ansible.builtin.systemd_service:
    name: docker
    state: reloaded
  # Same as the enable task: no unit exists yet in check mode on a fresh host.
  when: not (ansible_check_mode and autolab_docker_install is changed)
