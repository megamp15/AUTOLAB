---
# Reload, not restart. A restart stops every container on the host; the log
# options below are read when a container is created, so a reload is enough
# for the next one and a restart would buy nothing but downtime.
- name: Reload the Docker daemon
  ansible.builtin.systemd_service:
    name: docker
    state: reloaded
  # Same as the enable task: no unit exists yet in check mode on a fresh host.
  when: not (ansible_check_mode and autolab_docker_install is changed)

# Reloading UFW re-reads after.rules, DOCKER-USER included, and leaves
# Docker's own chains and every running container alone.
- name: Reload UFW
  ansible.builtin.command: ufw reload
  changed_when: true
  notify: Restart fail2ban after UFW

# The reload empties DOCKER-USER, and with it the jump to any fail2ban chain a
# jail had put there (aurora's public Jellyfin jail bans in DOCKER-USER). A
# restart puts the bans back. try-restart: nothing where fail2ban is absent.
# The systemd module has no try-restart, and restarted fails on a host without
# fail2ban.
- name: Restart fail2ban after UFW
  ansible.builtin.command: systemctl try-restart fail2ban  # noqa: command-instead-of-module
  changed_when: true
