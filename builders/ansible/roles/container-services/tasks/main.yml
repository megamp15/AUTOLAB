---
- name: Skip when this machine runs no services
  ansible.builtin.meta: end_role
  when: autolab_services_enabled | length == 0

- name: Require Docker on the services host
  ansible.builtin.assert:
    that: (autolab_builder | default({})).docker_enabled | default(false) | bool
    fail_msg: >-
      builder.services needs builder.docker_enabled = true for this machine
      in machines.auto.tfvars, and the docker playbook run first.

# A name with no template is a typo in the machines map. Caught here, by
# name, rather than as a Jinja error halfway through rendering a compose file.
- name: Refuse a service this role does not know
  ansible.builtin.assert:
    that: autolab_services_enabled | difference(autolab_services_catalog) | length == 0
    fail_msg: >-
      Unknown service(s) {{ autolab_services_enabled | difference(autolab_services_catalog) | join(', ') }}.
      This role knows: {{ autolab_services_catalog | join(', ') }}.

# Published ports bind here and nowhere else.
- name: Discover this host's tailnet address
  ansible.builtin.command: tailscale ip -4
  register: autolab_services_ip_raw
  changed_when: false
  check_mode: false

- name: Discover this host's MagicDNS name
  ansible.builtin.command: tailscale status --json
  register: autolab_services_status
  changed_when: false
  check_mode: false

# The address for binding, the name for anything a human or a browser is
# given: an address belongs to a device and changes when the VM is rebuilt.
- name: Set the tailnet facts
  ansible.builtin.set_fact:
    autolab_services_tailscale_ip: "{{ autolab_services_ip_raw.stdout_lines[0] }}"
    autolab_services_fqdn: >-
      {{ (autolab_services_status.stdout | from_json).Self.DNSName | regex_replace('\.$', '') }}

# fail_key: false so a missing account reaches the assert below, which says
# what is wrong. Left at its default the lookup aborts the play first and the
# fail_msg never prints.
- name: Look up the interactive operator account
  ansible.builtin.getent:
    database: "{{ item }}"
    key: megamp15
    fail_key: false
  loop: [passwd, group]
  when: "'code-server' in autolab_services_enabled"

# A missing key comes back as null rather than absent, so `is defined` would
# pass and the compose template would index null. Test the value.
- name: Require the interactive operator account
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd.megamp15 is not none
      - ansible_facts.getent_group.megamp15 is not none
    fail_msg: >-
      code-server requires the interactive operator account megamp15 on this
      host. Run the harden playbook first, which creates it.
  when: "'code-server' in autolab_services_enabled"

- name: Create the services directory
  ansible.builtin.file:
    path: "{{ autolab_services_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create code-server persistent state and workspace
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: megamp15
    group: megamp15
    mode: "0750"
  loop:
    - "{{ autolab_services_root }}/code-server"
    - "{{ autolab_services_root }}/code-server/config"
    - "{{ autolab_services_root }}/code-server/data"
    - "{{ autolab_services_root }}/code-server/cache"
    - "{{ autolab_services_root }}/code-server/workspace"
    - "{{ autolab_services_root }}/code-server/home"
  when: "'code-server' in autolab_services_enabled"

# The build context, root-owned: the operator's account can write the mounts
# above but not the recipe for the image they run in.
- name: Create the editor's build context
  ansible.builtin.file:
    path: "{{ autolab_services_root }}/code-server/build"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'code-server' in autolab_services_enabled"

- name: Write the editor's Dockerfile
  ansible.builtin.template:
    src: code-server/Dockerfile.j2
    dest: "{{ autolab_services_root }}/code-server/build/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  when: "'code-server' in autolab_services_enabled"

- name: Install the editor's display wrapper
  ansible.builtin.copy:
    src: code-server/with-display.sh
    dest: "{{ autolab_services_root }}/code-server/build/with-display.sh"
    owner: root
    group: root
    mode: "0755"
  when: "'code-server' in autolab_services_enabled"

# The tag is the build's content, not a counter: any change to what goes in
# is a tag this host has never seen, so Compose builds it rather than reusing
# the old image under a name that no longer describes it.
- name: Name the editor's image after what is in it
  ansible.builtin.set_fact:
    autolab_services_code_server_image: >-
      autolab/code-server:{{ autolab_services_images.code_server.split(':') | last }}-{{
      (lookup('ansible.builtin.template', 'code-server/Dockerfile.j2')
       ~ lookup('ansible.builtin.file', 'code-server/with-display.sh'))
      | hash('sha256') | truncate(12, true, '') }}
  when: "'code-server' in autolab_services_enabled"

# Plaintext, 0600, mounted read-only: what Portainer's --admin-password-file
# expects. Written before the compose file so the container finds it on its
# first start, which is the only time it is read.
- name: Give Portainer its admin password
  ansible.builtin.copy:
    content: "{{ autolab_services_portainer_admin_password }}"
    dest: "{{ autolab_services_root }}/portainer-admin"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - "'portainer' in autolab_services_enabled"
    - autolab_services_portainer_admin_password | length > 0
  notify: Restart the services stack

- name: Assemble the services compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ autolab_services_root }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the services stack

- name: Install the boot unit
  ansible.builtin.template:
    src: autolab-services.service.j2
    dest: /etc/systemd/system/autolab-services.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the services stack

# On a fresh host in check mode nothing above was written, so systemd has no
# unit to enable and Compose no project to inspect. Once the host has run for
# real both exist and check mode reports against them.
- name: See whether the stack was ever installed
  ansible.builtin.stat:
    path: /etc/systemd/system/autolab-services.service
  register: autolab_services_unit

- name: Enable the boot unit
  ansible.builtin.systemd_service:
    name: autolab-services.service
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or autolab_services_unit.stat.exists

# present, not restarted: restart acts on containers that already exist and
# would create nothing on a first run. remove_orphans is what makes taking a
# service out of the list actually remove its container.
- name: Bring the services up
  community.docker.docker_compose_v2:
    project_src: "{{ autolab_services_root }}"
    state: present
    pull: missing
    remove_orphans: true
  when: not ansible_check_mode

# After the stack is up, because it runs inside the container. The CLI is
# idempotent and says so — "already installed" is how a converged host is
# told apart from one that just gained an extension, which is what keeps a
# re-run reporting ok rather than changed. Pinned with @version, so it never
# quietly pulls a newer build than the list asks for.
- name: Install the editor's declared extensions
  community.docker.docker_container_exec:
    container: "{{ autolab_services_project }}-code-server-1"
    argv:
      - code-server
      - --install-extension
      - "{{ item }}"
  register: autolab_services_extension_install
  changed_when: "'already installed' not in autolab_services_extension_install.stdout"
  loop: "{{ autolab_services_code_server_extensions }}"
  when:
    - "'code-server' in autolab_services_enabled"
    - autolab_services_code_server_extensions | length > 0
    - not ansible_check_mode

- name: Say what is running and where
  ansible.builtin.debug:
    msg: >-
      {{ autolab_services_enabled | join(', ') }} on {{ autolab_services_fqdn }}
      {{- ' — portainer :' ~ autolab_services_ports.portainer if 'portainer' in autolab_services_enabled else '' }}
      {{- ', registry :' ~ autolab_services_ports.registry if 'registry' in autolab_services_enabled else '' }}
      {{- ', registry-ui :' ~ autolab_services_ports.registry_ui if 'registry-ui' in autolab_services_enabled else '' }}
      {{- ', code-server :' ~ autolab_services_ports.code_server if 'code-server' in autolab_services_enabled else '' }}
