# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Recyclarr: TRaSH Guides' quality profiles and custom formats, synced into
# Sonarr and Radarr once a day. Default groups follow each profile by
# themselves; the two added here are ours. docs/gitops/media.md
# The API keys come from secrets.yml, which the services run writes from each
# app's own config.xml.

sonarr:
  # Instance names are unique across Sonarr and Radarr, or Recyclarr drops both.
  sonarr:
    base_url: http://sonarr:8989
    api_key: !secret sonarr_api_key
    quality_definition:
      type: series
    # Folders carry the show's TVDB id, so Jellyfin matches the right show
    # instead of guessing from the name; files are renamed to TRaSH's pattern.
    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p: shows and dramas
        reset_unmatched_scores:
          enabled: true
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true
      # Ours: Desi and Korean, Chinese and Japanese dramas and films. Few
      # groups release them in TRaSH's preferred formats, so WEB-1080p turns
      # most down; this takes 1080p, then 720p, from WEB, TV or disc.
      - name: Regional
        upgrade:
          allowed: true
          until_quality: WEB 1080p
        qualities:
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: Bluray-720p
          - name: HDTV-720p
    custom_format_groups:
      add:
        # Language: Not Original (the group's default): a Korean drama in
        # Korean, an American show in English, never a dub.
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
          assign_scores_to:
            - trash_id: 72dae194fc92bf828f32cde7744e51a1
        # Viki, iQIYI and the like, where most dramas are released.
        - trash_id: 35fb4585dcd9e2a5ac732e4309f5a45a  # [Streaming Services] Asian
          assign_scores_to:
            - trash_id: 72dae194fc92bf828f32cde7744e51a1
            - name: Regional
    custom_formats:
      # Regional keeps only the hard refusals: low quality, discs, upscales,
      # extras and dubs. x265, 720p and HDTV are fine for it.
      - trash_ids:
          - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
          - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
          - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
          - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
          - ae575f95ab639ba5d15f663bf019e3e8  # Language: Not Original
        score: -10000
        assign_scores_to:
          - name: Regional

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !secret radarr_api_key
    quality_definition:
      type: movie
    # The same for films, with the TMDB id.
    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: 722b624f9af1e492284c4bc842153a38  # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true
      # Ours: the same, for films. Few
      # groups release them in TRaSH's preferred formats, so WEB-1080p turns
      # most down; this takes 1080p, then 720p, from WEB, TV or disc.
      - name: Regional
        upgrade:
          allowed: true
          until_quality: WEB 1080p
        qualities:
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: Bluray-720p
          - name: HDTV-720p
    custom_format_groups:
      add:
        - trash_id: 13856622cf7a6c9925d3a83f8812d679  # [Optional] Language Profiles
          select:
            - d6e9318c875905d6cfb5bee961afcea9  # Language: Not Original
          assign_scores_to:
            - trash_id: d1d67249d3890e49bc12e275d989a7e9
        - trash_id: b22449f789b16a4163b59f1b70cbc580  # [Streaming Services] Asian
          assign_scores_to:
            - trash_id: d1d67249d3890e49bc12e275d989a7e9
            - name: Regional
    custom_formats:
      # Regional keeps only the hard refusals: low quality, discs, upscales,
      # extras and dubs. x265, 720p and HDTV are fine for it.
      - trash_ids:
          - 90a6f9a284dff5103f6346090e6280c8  # LQ
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - d6e9318c875905d6cfb5bee961afcea9  # Language: Not Original
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
        score: -10000
        assign_scores_to:
          - name: Regional
