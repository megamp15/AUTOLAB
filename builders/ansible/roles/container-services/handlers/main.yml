---
- name: Restart the services stack
  community.docker.docker_compose_v2:
    project_src: "{{ autolab_services_root }}"
    state: present
  # Check mode on a fresh host notifies this from a file it did not write.
  when: not ansible_check_mode

- name: Restart the Dockhand proxy
  community.docker.docker_compose_v2:
    project_src: "{{ autolab_services_root }}"
    services: [dockhand-proxy]
    state: restarted
  when: not ansible_check_mode

- name: Restart the public Jellyfin door
  community.docker.docker_compose_v2:
    project_src: "{{ autolab_services_root }}"
    services: [jellyfin-public]
    state: restarted
  when: not ansible_check_mode

- name: Restart fail2ban for the public Jellyfin jail
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: not ansible_check_mode

- name: Restart Jellyfin
  community.docker.docker_compose_v2:
    project_src: "{{ autolab_services_root }}"
    services: [jellyfin]
    state: restarted
  when: not ansible_check_mode
