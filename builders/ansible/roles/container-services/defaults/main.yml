---
# The lab's own container services, on whichever machine the machines map
# names. One Compose project; one template per service, so a service is
# added, removed or upgraded on its own.
#
# Enabled per machine: builder.services = ["portainer", "registry", …].
# A name not in the catalog fails the run rather than being ignored.

# Every service this role knows how to run. A machine's list is checked
# against it, so a typo fails by name instead of rendering a broken file.
autolab_services_catalog: "{{ autolab_service_catalog.keys() | list }}"

autolab_services_root: /opt/autolab/services
autolab_services_enabled: "{{ (autolab_builder | default({})).services | default([]) }}"

# Pinned, like every other image in this lab: a management UI that upgrades
# itself overnight is a management UI that broke itself overnight.
autolab_services_images:
  portainer: "portainer/portainer-ce:2.45.1"
  registry: "registry:3.1.1"
  registry_ui: "joxit/docker-registry-ui:2.6.0"
  diun: "crazymax/diun:4.33.0"
  code_server: "codercom/code-server:4.138.0"

# Host ports come from the shared catalog in playbooks/group_vars/all.yml,
# because the ingress role on another machine routes to the same numbers.
# Bound to the tailnet address only: Docker writes its iptables rules ahead
# of ufw's, so 0.0.0.0 would reach the LAN whatever the host firewall says.
autolab_services_ports:
  portainer: "{{ autolab_service_catalog.portainer.port }}"
  registry: "{{ autolab_service_catalog.registry.port }}"
  registry_ui: "{{ autolab_service_catalog['registry-ui'].port }}"
  code_server: "{{ autolab_service_catalog['code-server'].port }}"

# Portainer creates its admin account from this at first start, so there is
# no five-minute window to lose: leave it empty and Portainer opens its setup
# page instead, which expires. Ignored once an admin exists.
autolab_services_portainer_admin_password: ""

# What the registry answers to. The tailnet is the boundary, as it is for
# Prometheus and Loki: reaching this address at all means passing the tailnet
# ACL. Tenants are on another tailnet and cannot see it.
autolab_services_registry_delete_enabled: true

# Diun watches the images this lab runs and says when a newer tag exists. It
# never updates anything: versions are pinned in git, and an image that
# changed under you is the thing this lab is built to avoid.
autolab_services_diun_schedule: "0 8 * * *"
autolab_services_diun_ntfy_topic: "{{ autolab_obs_ntfy_topic | default('') }}"
autolab_services_diun_ntfy_url: "{{ autolab_obs_ntfy_url | default('https://ntfy.sh') }}"

# Diun stamps its notifications with a local time.
autolab_services_timezone: "{{ autolab_timezone | default('UTC') }}"
