# The tools baked into the editor's image. A bump is a change here, which
# changes the image's tag, which is what makes the next run build it. The
# sums are the publishers' own, for linux amd64: jwst's architecture.
autolab_services_code_server_gh:
  version: "2.104.0"
  sha256: 98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e
autolab_services_code_server_node:
  version: "24.22.3"
  sha256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
# Grafana's MCP server, so an agent in the editor can search dashboards, run
# PromQL and LogQL, and read alert state. It reads GRAFANA_URL and
# GRAFANA_SERVICE_ACCOUNT_TOKEN from the environment; the observability role
# writes both to /etc/autolab/grafana-agent.env on the host that runs Grafana.
autolab_services_code_server_mcp_grafana:
  version: "2.3.0"
  sha256: f808ea13d236e549a9fffa14b28398d30b5393623141307c916e26f5e7746671
autolab_services_code_server_npm:
  - "@anthropic-ai/claude-code@2.1.323"
  - "@openai/codex@0.167.2"
  - "opencode-ai@1.19.5"
  - "@mariozechner/pi-coding-agent@0.73.1"

# jwst is also the observability host: 4 vCPU and 7.5 GB, of which the
# observability stack and the other services use about 2 GB. A browser, four
# agents and a language server each are enough to starve Prometheus; capped,
# the editor is what gets killed or slowed instead of the thing that says why.
# 2 GB ran at ~1.6 GB with an agent and an extension install going, so 3 GB.
# Three of the four cores, so one is always left for Grafana and Prometheus.
autolab_services_code_server_memory: 3g
autolab_services_code_server_cpus: 3

# What the registry answers to. The tailnet is the boundary, as it is for
# Prometheus and Loki: reaching this address at all means passing the tailnet
# ACL. Tenants are on another tailnet and cannot see it.
autolab_services_registry_delete_enabled: true

# Diun watches the images this lab runs and says when a newer tag exists. It
# never updates anything: versions are pinned in git, and an image that
# changed under you is the thing this lab is built to avoid.
# Hermes. See docs/gitops/hermes.md.
#
# The gateway process and its SQLite state, sessions, memories and the paired
# WhatsApp session live under hermes/data on local disk (SQLite on NFS is the
# same corruption story as Postgres). The vault is a git checkout under
# hermes/vault; GitHub holds the durable copy, so neither needs the NAS.
# Both are owned by the operator account, and the container runs as it.
autolab_services_hermes_memory: 2g
autolab_services_hermes_cpus: 1
# The notes vault Hermes works in: a private GitHub repository, cloned once
# and pushed to by the agent. The token is a fine-grained PAT with Contents
# read and write on that one repository (COSMOS_VAULT_TOKEN).
autolab_services_hermes_vault_repo: "https://github.com/megamp15/cosmos-vault.git"
autolab_services_hermes_vault_token: ""
# OpenCode Go: the $10/month key for open-weight models, the model Hermes
# starts on (HERMES_OPENCODE_GO_API_KEY). The owner switches the main model
# to the ChatGPT/Codex subscription interactively; see the doc. Never an
# Anthropic credential: the owner's Claude plan is for Claude Code only.
autolab_services_hermes_opencode_go_api_key: ""
autolab_services_hermes_model: "kimi-k3"
# The one WhatsApp number allowed to talk to it: the owner's, country code,
# no plus (HERMES_WHATSAPP_NUMBER). A phone number is personal data, so a
# secret rather than a variable.
autolab_services_hermes_whatsapp_number: ""
# Hermes's context. Sure's API with a read-only key (HERMES_SURE_API_KEY), so
# it can answer money questions from the source of truth. Unset: the finance
# skill is installed but the key is absent and the agent says so. The public
# AUTOLAB repository, cloned read-only so it knows the lab.
autolab_services_hermes_sure_url: "{{ autolab_services_sure_public_url }}"
autolab_services_hermes_sure_api_key: ""
autolab_services_hermes_autolab_repo: "https://github.com/megamp15/AUTOLAB.git"
# The dashboard: the same container as the gateway (HERMES_DASHBOARD), bound
# to 0.0.0.0 inside, published on the tailnet address only, routed by Traefik
# as hermes.<label>.<zone> behind Pocket ID. It was a second container once;
# its Chat page attaches to the gateway over loopback, so it could not
# connect. A non-loopback bind makes Hermes insist on a login of its own:
# username and password, generated once on the host into
# /etc/autolab/hermes-dashboard.env. public_url and trusted_proxies tell it
# the name it is reached at and that Traefik's forwarded headers are honest;
# the tailnet CGNAT range is the bounded CIDR, since horizon's address is not
# known to this role.
autolab_services_hermes_public_url: "https://hermes.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
autolab_services_hermes_dashboard_user: megamp15
autolab_services_hermes_trusted_proxies: ["100.64.0.0/10"]
autolab_services_hermes_git_name: "Hermes"
autolab_services_hermes_git_email: "hermes@jwst.lab"

autolab_services_diun_schedule: "0 8 * * *"
autolab_services_diun_ntfy_topic: "{{ autolab_obs_ntfy_topic | default('') }}"
autolab_services_diun_ntfy_url: "{{ autolab_obs_ntfy_url | default('https://ntfy.sh') }}"

# Diun stamps its notifications with a local time.
autolab_services_timezone: "{{ autolab_timezone | default('UTC') }}"
