---
# The lab's own container services, on whichever machine the machines map
# names. One Compose project; one template per service, so a service is
# added, removed or upgraded on its own.
#
# Enabled per machine: builder.services = ["dockhand", "registry", …].
# A name not in the catalog fails the run rather than being ignored.

# Every service this role knows how to run. A machine's list is checked
# against it, so a typo fails by name instead of rendering a broken file.
autolab_services_catalog: "{{ autolab_service_catalog.keys() | list }}"

autolab_services_root: /opt/autolab/services

# State that must outlive the VM lives on the NAS, mounted here by the storage
# playbook (builder.storage in the machines map). Uploads, repositories and
# source checkouts bind-mount from under it; the databases do not (a live
# Postgres on NFS v3 is a corruption story), and are dumped to it instead.
autolab_services_data_root: /mnt/apps
# Services with a directory under the data root. A machine that runs one of
# these refuses to start the stack while the share is not mounted, so nothing
# can write into an empty local directory standing where the NAS should be.
autolab_services_nas_backed: [adventurelog, forgejo, tandoor, airtrail, karakeep, sure]
# Directories to create under the data root, per enabled service.
autolab_services_nas_dirs: >-
  {{ autolab_services_nas_dir_catalog | selectattr('service', 'in', autolab_services_enabled) | list }}
autolab_services_nas_dir_catalog:
  - {service: adventurelog, path: adventurelog/media, owner: root, group: root}
  - {service: forgejo, path: forgejo, owner: root, group: root}
  # The rootless image runs as uid 1000.
  - {service: forgejo, path: forgejo/data, owner: "1000", group: "1000"}
  - {service: tandoor, path: tandoor/media, owner: root, group: root}
  - {service: airtrail, path: airtrail/uploads, owner: root, group: root}
  - {service: karakeep, path: karakeep/assets, owner: root, group: root}
  # Sure's image runs as 1000:1000.
  - {service: sure, path: sure/storage, owner: "1000", group: "1000"}
# The films and shows, on a share of their own (the machine's builder.storage
# mounts it). Downloads and the library sit in one tree so an import is a
# rename, not a copy. Guarded the same way as the data root above.
autolab_services_media_mount: /mnt/aurora
autolab_services_media_root: "{{ autolab_services_media_mount }}/media-stack"
autolab_services_media_backed: [jellyfin, sonarr, radarr, prowlarr, bazarr, sabnzbd, qbittorrent, lidarr]
# Jellyfin's libraries, one folder each under media/. Split by language so
# each gets its own row on the home screen. The services run creates any
# library whose folder no library holds yet; it never changes or deletes one
# made in the UI. type is Jellyfin's collection type.
autolab_services_jellyfin_libraries:
  - {name: Movies, type: movies, folder: movies}
  - {name: Shows, type: tvshows, folder: tv}
  - {name: Anime, type: tvshows, folder: anime}
  - {name: Anime Movies, type: movies, folder: anime-movies}
  - {name: K-Dramas, type: tvshows, folder: kdrama}
  - {name: K-Movies, type: movies, folder: kmovies}
  - {name: C-Dramas, type: tvshows, folder: cdrama}
  - {name: C-Movies, type: movies, folder: cmovies}
  - {name: J-Dramas, type: tvshows, folder: jdrama}
  - {name: J-Movies, type: movies, folder: jmovies}
  - {name: Desi Shows, type: tvshows, folder: desi}
  - {name: Desi Movies, type: movies, folder: desi-movies}
  - {name: Music, type: music, folder: music}
# An API key made in Jellyfin (Dashboard, API Keys). Empty: libraries are left alone.
autolab_services_jellyfin_api_key: ""
# Owned by 1000: Jellyfin and the download apps run as that uid.
# usenet/ and torrents/ sit beside media/ on the same share, so a finished
# download becomes a library file by rename (Usenet) or hardlink (torrents).
# A folder per downloader category too: Sonarr and Radarr report the downloader's
# folder missing, and stop trusting it, when SABnzbd has removed an empty one.
autolab_services_media_dirs: >-
  {{ ['media', 'usenet', 'usenet/complete', 'torrents']
     + ['usenet/complete/tv', 'usenet/complete/movies', 'usenet/complete/music', 'torrents/tv', 'torrents/movies', 'torrents/music']
     + autolab_services_jellyfin_libraries | map(attribute='folder') | map('regex_replace', '^', 'media/') | list }}
# The download apps that keep their settings in their own folder on this disk.
autolab_services_download_apps: [sonarr, radarr, prowlarr, bazarr, sabnzbd, qbittorrent, lidarr, recyclarr]
# Gluetun: which Mullvad servers to use, spelled as Gluetun lists them ("Houston
# TX", not "Houston"). The key works on every one of them.
autolab_services_mullvad_cities: ["Houston TX"]
# From a WireGuard config made on Mullvad's site (PrivateKey, and the IPv4 part
# of Address). The MULLVAD_WIREGUARD_* secrets.
autolab_services_mullvad_private_key: ""
autolab_services_mullvad_addresses: ""
# This machine's address on the home network, for the few ports a device that
# is not on the tailnet has to reach.
autolab_services_lan_ip: "{{ ansible_facts.default_ipv4.address }}"
autolab_services_lan_cidr: "{{ ansible_facts.default_ipv4.network }}/{{ ansible_facts.default_ipv4.prefix }}"

# Jellyfin for friends, from the internet (service jellyfin-public). The name
# the router's forward and the dynamic DNS make public, and the token that
# writes its record and its certificate's challenge (INGRESS_ACME_DNS_TOKEN,
# DNS edit on the zone and nothing else).
autolab_services_jellyfin_public_host: "jellyfin.{{ autolab_services_dash_zone }}"
# Seerr through the same door, when it runs on the same machine: friends
# browse and request with their Jellyfin accounts.
autolab_services_seerr_public_host: "seerr.{{ autolab_services_dash_zone }}"
autolab_services_acme_dns_token: ""
autolab_services_acme_email: ""
# A network holding only the door and Jellyfin, with a fixed address for the
# door, which Jellyfin trusts to pass on the client's address.
autolab_services_jellyfin_public_subnet: 172.30.250.0/24
autolab_services_jellyfin_public_proxy_ip: 172.30.250.2
# Streams from outside the home network and the tailnet are held to this, in
# bits a second: the home upload is shared, and aurora has no GPU to convert
# more than a stream or two at once.
autolab_services_jellyfin_remote_bitrate: 10000000
# The Postgres behind each service that has one: dumped nightly, restored
# weekly into a scratch container. `container` is the compose service name.
autolab_services_databases:
  adventurelog:
    container: adventurelog-db
    user: adventure
    db: database
    image: "{{ autolab_services_images.adventurelog_db }}"
  forgejo:
    container: forgejo-db
    user: forgejo
    db: forgejo
    image: "{{ autolab_services_images.forgejo_db }}"
  tandoor:
    container: tandoor-db
    user: djangouser
    db: djangodb
    image: "{{ autolab_services_images.postgres }}"
  novaflix:
    container: novaflix-db
    user: novaflix
    db: novaflix
    image: "{{ autolab_services_images.novaflix_db }}"
  airtrail:
    container: airtrail-db
    user: airtrail
    db: airtrail
    image: "{{ autolab_services_images.postgres }}"
  sure:
    container: sure-db
    user: sure
    db: sure
    image: "{{ autolab_services_images.postgres }}"
autolab_services_db_backup:
  keep_daily: 14
  keep_weekly_days: 60
  dump_calendar: "*-*-* 01:15:00"
  restore_calendar: "Sun *-*-* 04:00:00"

# Compose names containers <project>-<service>-<n>, and takes the project from
# the directory it runs in. Derived rather than written out, so moving the root
# does not leave a task addressing a container that no longer exists.
autolab_services_project: "{{ autolab_services_root | basename }}"
autolab_services_enabled: "{{ (autolab_builder | default({})).services | default([]) }}"

# Pinned, like every other image in this lab: a management UI that upgrades
# itself overnight is a management UI that broke itself overnight.
autolab_services_images:
  dockhand: "fnsys/dockhand:v1.0.58"
  dockhand_proxy: "nginx:1.31.9-alpine"
  registry: "registry:3.1.2"
  registry_ui: "ghcr.io/eznix86/docker-registry-ui:1.8.0"
  diun: "crazymax/diun:4.34.0"
  # The base only: the editor runs an image built on the host from this, with
  # the tools below baked in. See templates/code-server/Dockerfile.j2.
  code_server: "codercom/code-server:4.145.2"
  immich_share: "alangrainger/immich-public-proxy:4.2.0"
  # One image holds the web app, the API, nginx and a cache; PostGIS is the
  # only other container.
  adventurelog: "ghcr.io/seanmorley15/adventurelog:v0.13.1"
  # 16-3.7 moves the image from Debian bullseye (glibc 2.31) to trixie (2.41):
  # text indexes need REINDEX + REFRESH COLLATION VERSION, and PostGIS wants
  # postgis_extensions_upgrade(). Its own change, not a plain bump.
  adventurelog_db: "postgis/postgis:16-3.5"
  # The long-term-support line: 17.0.0 shipped with a warning against
  # upgrading to it. The rootless image runs as uid 1000 and is the one the
  # docs recommend for repositories on NFS.
  forgejo: "codeberg.org/forgejo/forgejo:17.0.2-rootless"
  postgres: "postgres:16.16-alpine"
  forgejo_db: "{{ autolab_services_images.postgres }}"
  mariadb: "mariadb:12.3"
  redis: "redis:8.10"
  tandoor: "vabene1111/recipes:2.7.6"
  airtrail: "johly/airtrail:v3.14.0"
  # Karakeep publishes its browser image only as `release`, so that one is
  # pinned by digest. Meilisearch is the version Karakeep's own compose file
  # names; moving it needs their one-time index upgrade.
  karakeep: "ghcr.io/karakeep-app/karakeep:0.35.0"
  karakeep_chrome: "ghcr.io/karakeep-app/karakeep-chrome@sha256:00fb4fa9c37aa74c58e74d0bdd16c4e3b81dddb5f264917c879f9579c3b3ad95"
  karakeep_meili: "getmeili/meilisearch:v1.55.0"
  # A prerelease, on purpose: 0.7.6-hotfix.1 has no statement vault and no
  # /api/v1/version, which the finance backfill uses to file each Nelnet
  # statement PDF under its loan. Sure publishes no stable release newer than
  # 0.7.6-hotfix.1. Alpha tags are immutable. Migrations only go forward,
  # so the way back is the nightly dump, not this line. docs/gitops/apps.md, "Sure upgrade".
  sure: "ghcr.io/we-promise/sure:2026.11.17-alpha"
  dash: "ghcr.io/gethomepage/homepage:v2.8.0"
  # Both containers, one image: `hbbs` and `hbbr` are its two commands.
  rustdesk: "rustdesk/rustdesk-server:1.1.16"
  jellyfin: "jellyfin/jellyfin:10.11.11"
  # The download apps on aurora (docs/gitops/media.md).
  sonarr: "linuxserver/sonarr:4.0.20.3014-ls6"
  radarr: "linuxserver/radarr:7.0.3.10918-ls328"
  prowlarr: "linuxserver/prowlarr:3.1.0.5799-ls170"
  bazarr: "linuxserver/bazarr:v1.6.2-ls373"
  sabnzbd: "linuxserver/sabnzbd:5.1.3-ls282"
  qbittorrent: "linuxserver/qbittorrent:5.3.1_v2.1.3-ls490"
  gluetun: "qmcgaw/gluetun:v3.41.3"
  lidarr: "linuxserver/lidarr:3.1.6.5079-ls49"
  recyclarr: "ghcr.io/recyclarr/recyclarr:8.8.1"
  seerr: "ghcr.io/seerr-team/seerr:v3.5.1"
  # The public Jellyfin door: the same Traefik as the lab's ingress, and the
  # dynamic DNS updater beside it.
  jellyfin_public: "traefik:v3.7.19"
  jellyfin_ddns: "favonia/cloudflare-ddns:1.18.0"
  cosmos_db: "postgres:17.12-alpine"
  novaflix_db: "postgres:17.12-alpine"
  # The connector for the Paradigm Prints tunnel, pinned with the same
  # version horizon's runs.
  paradigm_tunnel: "cloudflare/cloudflared:2026.11.1"
  # Hermes Agent, the official image: Python runtime, Node for the WhatsApp
  # bridge, git, and s6 to keep the gateway up. A release tag, never `latest`.
  hermes: "nousresearch/hermes-agent:v0.23.3"

# Host ports come from the shared catalog in playbooks/group_vars/all.yml,
# because the ingress role on another machine routes to the same numbers.
# Bound to the tailnet address only: Docker writes its iptables rules ahead
# of ufw's, so 0.0.0.0 would reach the LAN whatever the host firewall says.
autolab_services_ports:
  dockhand: "{{ autolab_service_catalog.dockhand.port }}"
  registry: "{{ autolab_service_catalog.registry.port }}"
  registry_ui: "{{ autolab_service_catalog['registry-ui'].port }}"
  code_server: "{{ autolab_service_catalog['code-server'].port }}"
  immich_share: "{{ autolab_service_catalog['immich-share'].port }}"
  dash: "{{ autolab_service_catalog.dash.port }}"
  adventurelog: "{{ autolab_service_catalog.adventurelog.port }}"
  forgejo: "{{ autolab_service_catalog.forgejo.port }}"
  tandoor: "{{ autolab_service_catalog.tandoor.port }}"
  airtrail: "{{ autolab_service_catalog.airtrail.port }}"
  karakeep: "{{ autolab_service_catalog.karakeep.port }}"
  sure: "{{ autolab_service_catalog.sure.port }}"
  qr: "{{ autolab_service_catalog.qr.port }}"
  cosmos: "{{ autolab_service_catalog.cosmos.port }}"
  novaflix: "{{ autolab_service_catalog.novaflix.port }}"
  novaflix_admin: "{{ autolab_service_catalog['novaflix-admin'].port }}"
  hermes: "{{ autolab_service_catalog.hermes.port }}"
  jellyfin: "{{ autolab_service_catalog.jellyfin.port }}"
  sonarr: "{{ autolab_service_catalog.sonarr.port }}"
  radarr: "{{ autolab_service_catalog.radarr.port }}"
  prowlarr: "{{ autolab_service_catalog.prowlarr.port }}"
  bazarr: "{{ autolab_service_catalog.bazarr.port }}"
  sabnzbd: "{{ autolab_service_catalog.sabnzbd.port }}"
  qbittorrent: "{{ autolab_service_catalog.qbittorrent.port }}"
  lidarr: "{{ autolab_service_catalog.lidarr.port }}"
  seerr: "{{ autolab_service_catalog.seerr.port }}"

# RustDesk is not HTTP, so it has no entry in the shared port catalog (the
# ingress would try to route one). Its ports are the protocol's own, and the
# clients are given only the ID server's name: they derive the rest.
autolab_services_rustdesk_ports:
  nat_test: 21115
  id: 21116      # TCP and UDP
  relay: 21117

# gethomepage. The names it answers to (it refuses any other Host header), and
# the zone and internal label its links are built from.
autolab_services_dash_zone: "pmahir.space"
autolab_services_dash_label: "lab"

# The email of your Pocket ID user (GitHub variable APPS_ADMIN_EMAIL). Every
# app creates its first administrator from it, so the first sign-in through
# Pocket ID attaches to that account instead of making an ordinary one beside
# it. Read once, when an app first boots; changed afterwards in the app.
autolab_services_admin_email: ""

# Forgejo. See docs/gitops/forgejo.md.
autolab_services_forgejo_public_url: "https://forgejo.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
# Pocket ID's client for Forgejo (GitHub secrets FORGEJO_OIDC_CLIENT_ID and
# _SECRET). Empty = password login only. The source is registered under the
# fixed name PocketID, because that name is part of the callback URL:
# <public url>/user/oauth2/PocketID/callback
autolab_services_forgejo_oidc_client_id: ""
autolab_services_forgejo_oidc_client_secret: ""
autolab_services_forgejo_oidc_issuer: "https://auth.{{ autolab_services_dash_zone }}"
# Pocket ID's `admins` group becomes Forgejo's site administrators.
autolab_services_forgejo_admin_group: admins
# false = no password form: Pocket ID is the only way in. Flipped in a pull
# request after a Pocket ID sign-in has been seen to work.
autolab_services_forgejo_password_login: true
autolab_services_forgejo_memory: 1g
autolab_services_forgejo_db_memory: 384m
# What Forgejo holds. `mirrors` are pull mirrors of upstream, refreshed on the
# interval; `apps` are our forks of them, made once and then ours. Declared
# here, created by forgejo_bootstrap.py, never reset.
autolab_services_forgejo_mirror_interval: "8h0m0s"
autolab_services_forgejo_mirrors:
  - {name: adventurelog, url: "https://github.com/seanmorley15/AdventureLog.git"}
  - {name: pocket-id, url: "https://github.com/pocket-id/pocket-id.git"}
autolab_services_forgejo_forks: [adventurelog]

# Where this host reaches Forgejo (the tailnet address its port is bound to),
# for clones at build time and for the bootstrap script.
autolab_services_forgejo_internal_url: "http://{{ autolab_services_fqdn }}:{{ autolab_services_ports.forgejo }}"

# Apps built from source. `mode: upstream` runs the project's own release image
# (how a new app starts, and the only way before Forgejo holds its fork);
# `mode: fork` builds on this host from our fork at the pinned `ref`, which is
# the line to change to ship a modification. The checkout is a disposable
# cache under the services root; the repository itself is on Forgejo, on the
# NAS. Fork URLs are anonymous reads on the tailnet.
autolab_services_sources:
  adventurelog:
    mode: upstream
    upstream_image: "{{ autolab_services_images.adventurelog }}"
    repo: "{{ autolab_services_forgejo_internal_url }}/apps/adventurelog.git"
    ref: v0.13.1
    dockerfile: docker/Dockerfile
    target: aio

# The self-hosted apps. Each is `<name>.<label>.<zone>` on the tailnet and signs
# people in with Pocket ID (its own client; GitHub secrets <APP>_OIDC_CLIENT_ID
# and _SECRET). With both empty an app keeps only its password login, which is
# how a first deploy proves it before the client exists. `password_login: false`
# turns the password form off, in a pull request, once a Pocket ID sign-in has
# been seen to work. Their database passwords and signing keys are generated on
# the host (autolab-gen-credentials) and never leave it.
autolab_services_tandoor_public_url: "https://tandoor.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
autolab_services_airtrail_public_url: "https://airtrail.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
autolab_services_karakeep_public_url: "https://karakeep.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
autolab_services_sure_public_url: "https://sure.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
autolab_services_oidc_issuer: "https://auth.{{ autolab_services_dash_zone }}"
autolab_services_pocketid_api_key: ""
autolab_services_pocketid_group: admins
autolab_services_tandoor_oidc_client_id: ""
autolab_services_tandoor_oidc_client_secret: ""
autolab_services_airtrail_oidc_client_id: ""
autolab_services_airtrail_oidc_client_secret: ""
autolab_services_karakeep_oidc_client_id: ""
autolab_services_karakeep_oidc_client_secret: ""
autolab_services_sure_oidc_client_id: ""
autolab_services_sure_oidc_client_secret: ""
autolab_services_tandoor_password_login: true
autolab_services_airtrail_password_login: true
autolab_services_karakeep_password_login: true
autolab_services_sure_password_login: true
# Limits, not reservations. Measured idle: Tandoor ~850 MB (its workers), Sure's
# web and worker ~375 MB each, the rest well under 400 MB.
autolab_services_memory:
  jellyfin: 2g
  sonarr: 512m
  radarr: 512m
  prowlarr: 384m
  bazarr: 384m
  sabnzbd: 1g
  qbittorrent: 1g
  gluetun: 128m
  lidarr: 512m
  recyclarr: 256m
  seerr: 512m
  jellyfin_public: 128m
  jellyfin_ddns: 64m
  tandoor: 1280m
  tandoor_db: 256m
  airtrail: 512m
  airtrail_db: 256m
  karakeep: 1024m
  karakeep_chrome: 768m
  karakeep_meili: 384m
  sure: 768m
  sure_worker: 768m
  sure_db: 384m
  sure_redis: 128m
# What each needs generated, once, on the host. {PW} is the database's password,
# shared by the files that need it; see files/autolab-gen-credentials.py.
autolab_services_credential_specs:
  - service: tandoor
    files:
      - path: /etc/autolab/tandoor-db.env
        lines: [POSTGRES_DB=djangodb, POSTGRES_USER=djangouser, "POSTGRES_PASSWORD={PW}"]
      - path: /etc/autolab/tandoor.env
        lines: ["POSTGRES_PASSWORD={PW}", "SECRET_KEY={HEX64}", "DJANGO_SUPERUSER_PASSWORD={HEX16}"]
  - service: airtrail
    files:
      - path: /etc/autolab/airtrail-db.env
        lines: [POSTGRES_DB=airtrail, POSTGRES_USER=airtrail, "POSTGRES_PASSWORD={PW}"]
      - path: /etc/autolab/airtrail.env
        lines: ["DB_URL=postgres://airtrail:{PW}@airtrail-db:5432/airtrail"]
  - service: karakeep
    files:
      - path: /etc/autolab/karakeep-meili.env
        lines: ["MEILI_MASTER_KEY={PW}"]
      - path: /etc/autolab/karakeep.env
        lines: ["NEXTAUTH_SECRET={HEX32}", "MEILI_MASTER_KEY={PW}"]
  - service: sure
    files:
      - path: /etc/autolab/sure-db.env
        lines: [POSTGRES_DB=sure, POSTGRES_USER=sure, "POSTGRES_PASSWORD={PW}"]
      - path: /etc/autolab/sure.env
        lines:
          - "POSTGRES_PASSWORD={PW}"
          - "SECRET_KEY_BASE={HEX64}"
          # Encrypt what Sure stores about accounts. Losing them loses that data.
          - "ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY={HEX32}"
          - "ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY={HEX32}"
          - "ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT={HEX32}"

# Karakeep's tagging and summaries: any OpenAI-compatible endpoint. A key of
# its own on OpenCode Go (KARAKEEP_OPENCODE_GO_API_KEY), not Hermes's, so one
# can be revoked without the other. Unset: links are saved and fetched,
# nothing is tagged. Never an Anthropic credential. docs/gitops/karakeep.md.
autolab_services_karakeep_ai_api_key: ""
autolab_services_karakeep_ai_base_url: "https://opencode.ai/zen/go/v1"
autolab_services_karakeep_ai_text_model: "kimi-k3"
autolab_services_karakeep_ai_image_model: "gemini-4-argon"
# The largest video kept with a bookmark, in MB. Reels and shorts are a few
# MB; this stops a two-hour stream from filling the share.
autolab_services_karakeep_video_max_mb: 200

# AdventureLog. See docs/gitops/adventurelog.md.
#
# The address people open, and the one Pocket ID sends them back to: SITE_URL
# below, and the callback registered in Pocket ID is
# <this>/accounts/oidc/<provider id>/login/callback/.
autolab_services_adventurelog_public_url: "https://adventurelog.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
# The optional Immich secret configures the administrator account. Pocket ID
# credentials are managed on the host when its API key is supplied; external
# client credentials remain supported when managed provisioning is disabled.
autolab_services_adventurelog_immich_api_key: ""
autolab_services_adventurelog_immich_url: "http://singularity:2283/api"
autolab_services_adventurelog_oidc_client_id: ""
autolab_services_adventurelog_oidc_client_secret: ""
autolab_services_adventurelog_oidc_issuer: "https://auth.{{ autolab_services_dash_zone }}"
# The last-but-two part of the callback URL; changing it means changing the
# client's callback in Pocket ID with it.
autolab_services_adventurelog_oidc_provider_id: pocketid
# true = Pocket ID is the only way in, and the sign-in page sends people
# straight there. Flipped only after a Pocket ID sign-in has been seen to work,
# because the password it replaces is the way back in.
autolab_services_adventurelog_sso_only: false
# jwst has ~4.5 GB free. The app idles near 260 MB (measured) and wants about
# 2 GB once, on first boot, while it downloads the country and region data, so
# the cap leaves room above that; Postgres stays well under half a gigabyte for
# a personal log. Limits, not reservations: they keep a runaway from taking
# Prometheus down with it.
autolab_services_adventurelog_memory: 3g
autolab_services_adventurelog_db_memory: 512m
autolab_services_adventurelog_workers: 2
# Immich answers here, over the tailnet; each person gives AdventureLog this
# address and their own API key in its settings.
autolab_services_adventurelog_immich_port: "{{ autolab_services_immich_port }}"

# QR redirect. The files that make its image: copied to the host, and what its
# tag is a hash of. A new source file belongs here or it never reaches the host.
autolab_services_qr_build_files: [Dockerfile, go.mod, go.sum, main.go, index.html]
# The address every printed code points at: baked into the codes,
# so it is chosen once and kept. It lives in a GitHub variable (QR_PUBLIC_URL),
# not here, because it is a customer-facing name rather than lab config.
autolab_services_qr_public_url: ""

# The paradigm-tunnel service: the token of a tunnel made in the Paradigm
# Prints Cloudflare account. A secret (PARADIGM_TUNNEL_TOKEN). Its hostnames
# and the container each one points at are routes in that account's dashboard,
# so a new public service is a route there plus a container on the
# paradigm-public network here. Required when the service is enabled.
autolab_services_paradigm_tunnel_token: ""

# COSMOS. Built in GitHub Actions by cosmos-publish.yml and pulled from the
# lab's registry, never built on this host. The tag is the one that workflow
# printed (<40-hex commit>-<run id>-<attempt>); a new release is a pull request
# that changes it, like every other pin here. Empty is refused rather than
# guessed, so the service cannot be enabled before the first publish.
autolab_services_cosmos_registry: "registry.lab.pmahir.space"
autolab_services_cosmos_image_tag: "d1c7bbeb9d07ba0a816fe959745d98881390ac46-45323041237-1"
# Novaflix. Our own app, built by app-publish.yml from its repository and
# pulled from the lab's registry (docs/gitops/own-apps.md). The tag is pinned
# by app-release.yml in a pull request, like every other pin here. Empty is
# refused, so the service cannot be enabled before the first publish.
autolab_services_novaflix_registry: "registry.lab.pmahir.space"
autolab_services_novaflix_image_tag: "3152a873a63797a1a6a3861c57886e5a8bccac1e-45416454436-1"
# Optional. A TMDB read token, for titles, artwork and suggestions; without it
# the app runs and those are absent. The NOVAFLIX_TMDB_TOKEN secret.
autolab_services_novaflix_tmdb_token: ""
# The address people open it at, which is also where a sign-in provider sends
# them back: <this>/api/auth/oidc/<provider>/callback.
autolab_services_novaflix_public_url: "https://novaflix.{{ autolab_services_dash_zone }}"
# The admin face's address, on the tailnet behind the passkey. Pocket ID may
# send a sign-in back to either address.
autolab_services_novaflix_admin_url: "https://novaflix-admin.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
# Every address the app is opened at; the first is where a sign-in started
# anywhere else is sent back to.
autolab_services_novaflix_origins: >-
  {{ [autolab_services_novaflix_public_url]
     + ([autolab_services_novaflix_admin_url] if 'novaflix-admin' in autolab_services_enabled else []) }}
# "Sign in with Pocket ID", for the `admins` group. The client is made by this
# role (managed-pocketid-policy.json.j2) and these are filled from its state on
# the host; they stay empty, and the button absent, without POCKETID_API_KEY.
autolab_services_novaflix_oidc_client_id: ""
autolab_services_novaflix_oidc_client_secret: ""
# Optional. "Sign in with Google", for emails that already have an account: a
# Google OAuth client's id and secret. Both empty, and the button is absent.
# The NOVAFLIX_GOOGLE_CLIENT_ID and NOVAFLIX_GOOGLE_CLIENT_SECRET secrets.
autolab_services_novaflix_google_client_id: ""
autolab_services_novaflix_google_client_secret: ""
# The owner's media server on aurora, for the admin title page (Watch, progress,
# Request). Read over the tailnet; the API keys are the SONARR_API_KEY,
# RADARR_API_KEY and JELLYFIN_API_KEY secrets. All three or the feature stays off.
autolab_services_novaflix_media_host: "aurora.{{ autolab_services_fqdn.split('.', 1)[1] }}"
autolab_services_novaflix_sonarr_api_key: ""
autolab_services_novaflix_radarr_api_key: ""
# Kept this many daily logical dumps of the database, on the host's disk. The
# nightly Proxmox backup of the VM carries them to the NAS.
autolab_services_cosmos_dump_keep: 14
# The owner's time zone. Apple Health's shortcut sends times without a zone,
# and a day of steps or a night of sleep is a day on this clock.
autolab_services_cosmos_timezone: "America/Chicago"

# Immich Public Proxy. The address shared links are opened at (Immich's own
# External Domain must say the same), and where Immich answers on the tailnet:
# the NAS runs it in its own Docker.
autolab_services_immich_share_public_url: "https://share.pmahir.space"
autolab_services_immich_host: "singularity"
autolab_services_immich_port: 2283

# Extensions the editor is expected to have, pinned like every image above.
