---
# The lab's own container services, on whichever machine the machines map
# names. One Compose project; one template per service, so a service is
# added, removed or upgraded on its own.
#
# Enabled per machine: builder.services = ["dockhand", "registry", …].
# A name not in the catalog fails the run rather than being ignored.

# Every service this role knows how to run. A machine's list is checked
# against it, so a typo fails by name instead of rendering a broken file.
autolab_services_catalog: "{{ autolab_service_catalog.keys() | list }}"

autolab_services_root: /opt/autolab/services

# State that must outlive the VM lives on the NAS, mounted here by the storage
# playbook (builder.storage in the machines map). Uploads, repositories and
# source checkouts bind-mount from under it; the databases do not (a live
# Postgres on NFS v3 is a corruption story), and are dumped to it instead.
autolab_services_data_root: /mnt/apps
# Services with a directory under the data root. A machine that runs one of
# these refuses to start the stack while the share is not mounted, so nothing
# can write into an empty local directory standing where the NAS should be.
autolab_services_nas_backed: [adventurelog]
# Directories to create under the data root, per enabled service.
autolab_services_nas_dirs: >-
  {{ (['adventurelog/media'] if 'adventurelog' in autolab_services_enabled else []) }}
# The Postgres behind each service that has one: dumped nightly, restored
# weekly into a scratch container. `container` is the compose service name.
autolab_services_databases:
  adventurelog:
    container: adventurelog-db
    user: adventure
    db: database
    image: "{{ autolab_services_images.adventurelog_db }}"
autolab_services_db_backup:
  keep_daily: 14
  keep_weekly_days: 60
  dump_calendar: "*-*-* 01:15:00"
  restore_calendar: "Sun *-*-* 04:00:00"

# Compose names containers <project>-<service>-<n>, and takes the project from
# the directory it runs in. Derived rather than written out, so moving the root
# does not leave a task addressing a container that no longer exists.
autolab_services_project: "{{ autolab_services_root | basename }}"
autolab_services_enabled: "{{ (autolab_builder | default({})).services | default([]) }}"

# Pinned, like every other image in this lab: a management UI that upgrades
# itself overnight is a management UI that broke itself overnight.
autolab_services_images:
  dockhand: "fnsys/dockhand:v1.0.57"
  dockhand_proxy: "nginx:1.31.6-alpine"
  registry: "registry:3.1.1"
  registry_ui: "ghcr.io/eznix86/docker-registry-ui:1.6.0"
  diun: "crazymax/diun:4.33.0"
  # The base only: the editor runs an image built on the host from this, with
  # the tools below baked in. See templates/code-server/Dockerfile.j2.
  code_server: "codercom/code-server:4.145.2"
  immich_share: "alangrainger/immich-public-proxy:4.1.2"
  # One image holds the web app, the API, nginx and a cache; PostGIS is the
  # only other container.
  adventurelog: "ghcr.io/seanmorley15/adventurelog:v0.13.1"
  adventurelog_db: "postgis/postgis:16-3.5"
  dash: "ghcr.io/gethomepage/homepage:v2.4.0"
  # The connector for the Paradigm Prints tunnel, pinned with the same
  # version horizon's runs.
  paradigm_tunnel: "cloudflare/cloudflared:2026.9.1"

# Host ports come from the shared catalog in playbooks/group_vars/all.yml,
# because the ingress role on another machine routes to the same numbers.
# Bound to the tailnet address only: Docker writes its iptables rules ahead
# of ufw's, so 0.0.0.0 would reach the LAN whatever the host firewall says.
autolab_services_ports:
  dockhand: "{{ autolab_service_catalog.dockhand.port }}"
  registry: "{{ autolab_service_catalog.registry.port }}"
  registry_ui: "{{ autolab_service_catalog['registry-ui'].port }}"
  code_server: "{{ autolab_service_catalog['code-server'].port }}"
  immich_share: "{{ autolab_service_catalog['immich-share'].port }}"
  dash: "{{ autolab_service_catalog.dash.port }}"
  adventurelog: "{{ autolab_service_catalog.adventurelog.port }}"
  qr: "{{ autolab_service_catalog.qr.port }}"

# gethomepage. The names it answers to (it refuses any other Host header), and
# the zone and internal label its links are built from.
autolab_services_dash_zone: "pmahir.space"
autolab_services_dash_label: "lab"

# AdventureLog. See docs/gitops/adventurelog.md.
#
# The address people open, and the one Pocket ID sends them back to: SITE_URL
# below, and the callback registered in Pocket ID is
# <this>/accounts/oidc/<provider id>/login/callback/.
autolab_services_adventurelog_public_url: "https://adventurelog.{{ autolab_services_dash_label }}.{{ autolab_services_dash_zone }}"
# The break-glass account's email (GitHub variable ADVENTURELOG_ADMIN_EMAIL).
# Set it to the email of your Pocket ID user: the first sign-in through Pocket
# ID then attaches to this account, which is the superuser, instead of making
# an ordinary one beside it. Read once, on the app's first boot; changing it
# later is done in the Django admin.
autolab_services_adventurelog_admin_email: ""
# Pocket ID's client for AdventureLog (GitHub secrets
# ADVENTURELOG_OIDC_CLIENT_ID and _SECRET). Both empty = password login only,
# which is how a first deploy proves the app before the client exists.
autolab_services_adventurelog_oidc_client_id: ""
autolab_services_adventurelog_oidc_client_secret: ""
autolab_services_adventurelog_oidc_issuer: "https://auth.{{ autolab_services_dash_zone }}"
# The last-but-two part of the callback URL; changing it means changing the
# client's callback in Pocket ID with it.
autolab_services_adventurelog_oidc_provider_id: pocketid
# true = Pocket ID is the only way in, and the sign-in page sends people
# straight there. Flipped only after a Pocket ID sign-in has been seen to work,
# because the password it replaces is the way back in.
autolab_services_adventurelog_sso_only: false
# jwst has ~4.5 GB free. The app idles near 260 MB (measured) and wants about
# 2 GB once, on first boot, while it downloads the country and region data, so
# the cap leaves room above that; Postgres stays well under half a gigabyte for
# a personal log. Limits, not reservations: they keep a runaway from taking
# Prometheus down with it.
autolab_services_adventurelog_memory: 3g
autolab_services_adventurelog_db_memory: 512m
autolab_services_adventurelog_workers: 2
# Immich answers here, over the tailnet; each person gives AdventureLog this
# address and their own API key in its settings.
autolab_services_adventurelog_immich_port: "{{ autolab_services_immich_port }}"

# QR redirect. The files that make its image: copied to the host, and what its
# tag is a hash of. A new source file belongs here or it never reaches the host.
autolab_services_qr_build_files: [Dockerfile, go.mod, go.sum, main.go, index.html]
# The address every printed code points at: baked into the codes,
# so it is chosen once and kept. It lives in a GitHub variable (QR_PUBLIC_URL),
# not here, because it is a customer-facing name rather than lab config.
autolab_services_qr_public_url: ""

# The paradigm-tunnel service: the token of a tunnel made in the Paradigm
# Prints Cloudflare account. A secret (PARADIGM_TUNNEL_TOKEN). Its hostnames
# and the container each one points at are routes in that account's dashboard,
# so a new public service is a route there plus a container on the
# paradigm-public network here. Required when the service is enabled.
autolab_services_paradigm_tunnel_token: ""

# Immich Public Proxy. The address shared links are opened at (Immich's own
# External Domain must say the same), and where Immich answers on the tailnet:
# the NAS runs it in its own Docker.
autolab_services_immich_share_public_url: "https://share.pmahir.space"
autolab_services_immich_host: "singularity"
autolab_services_immich_port: 2283

# Extensions the editor is expected to have, pinned like every image above.
# The mounted data directory keeps them across a container recreation; this
# list is what brings them back when the machine itself is rebuilt from the
# template, so an editor set up by hand is not a thing only one host knows.
# Installing in the browser is still the normal way to try one — promote the
# ones worth keeping to this list, where a bump is a pull request.
#
# code-server installs from Open VSX, not Microsoft's marketplace, so an ID
# here is one that exists there. Each is its latest stable release, except
# openai.chatgpt and Graphite.gti-vscode, which publish only pre-releases to
# Open VSX. JavaScript and TypeScript support is built in and needs no entry.
autolab_services_code_server_extensions:
  # Languages
  - ms-python.python@2026.4.0
  - ms-python.debugpy@2026.6.0
  - meta.pyrefly@1.3.1
  - redhat.vscode-yaml@1.24.0
  - hashicorp.terraform@2.40.0
  - bradlc.vscode-tailwindcss@0.16.0
  - esbenp.prettier-vscode@12.4.0
  # Agents
  - Anthropic.claude-code@2.1.283
  - openai.chatgpt@26.5908.31748
  - sst-dev.opencode@0.0.13
  - breaking-brake.cc-wf-studio@3.36.0
  - agentlens.agentlens-dashboard@0.16.3
  # Git, containers, CI
  - mhutchie.git-graph@1.30.0
  - git-brain.git-brain@0.0.48
  - Graphite.gti-vscode@0.7.82
  - github.vscode-github-actions@0.32.3
  - ms-azuretools.vscode-containers@2.4.5
  # Data, documents, previews
  - dbcode.dbcode@1.38.7
  - rangav.vscode-thunder-client@2.41.3
  - mechatroner.rainbow-csv@3.24.1
  - AykutSarac.jsoncrack-vscode@5.1.0
  - cweijan.vscode-office@4.2.0
  - shd101wyy.markdown-preview-enhanced@0.8.38
  - LachyFS.kanban-markdown@1.14.1
  - hediet.vscode-drawio@1.6.6
  - midudev.better-svg@0.5.1
  - zenclabs.previewjs@1.28.1
  - lirobi.phone-preview@3.1.10
  - codewithgod.chromex-browser@1.0.7
  # Editing
  - Gruntfuggly.todo-tree@0.0.215
  - magic5644.graph-it-live@1.15.1
  - devsense-team.devsense@1.0.72
  - cedricverlinden.cursor-dark@2.2.0
  - marcosbuilds.minigames@0.0.5

# The tools baked into the editor's image. A bump is a change here, which
# changes the image's tag, which is what makes the next run build it. The
# sums are the publishers' own, for linux amd64: jwst's architecture.
autolab_services_code_server_gh:
  version: "2.104.0"
  sha256: 98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e
autolab_services_code_server_node:
  version: "24.22.3"
  sha256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
# Grafana's MCP server, so an agent in the editor can search dashboards, run
# PromQL and LogQL, and read alert state. It reads GRAFANA_URL and
# GRAFANA_SERVICE_ACCOUNT_TOKEN from the environment; the observability role
# writes both to /etc/autolab/grafana-agent.env on the host that runs Grafana.
autolab_services_code_server_mcp_grafana:
  version: "2.3.0"
  sha256: f808ea13d236e549a9fffa14b28398d30b5393623141307c916e26f5e7746671
autolab_services_code_server_npm:
  - "@anthropic-ai/claude-code@2.1.323"
  - "@openai/codex@0.167.2"
  - "opencode-ai@1.19.5"
  - "@mariozechner/pi-coding-agent@0.73.1"

# jwst is also the observability host: 4 vCPU and 7.5 GB, of which the
# observability stack and the other services use about 2 GB. A browser, four
# agents and a language server each are enough to starve Prometheus; capped,
# the editor is what gets killed or slowed instead of the thing that says why.
# 2 GB ran at ~1.6 GB with an agent and an extension install going, so 3 GB.
# Three of the four cores, so one is always left for Grafana and Prometheus.
autolab_services_code_server_memory: 3g
autolab_services_code_server_cpus: 3

# What the registry answers to. The tailnet is the boundary, as it is for
# Prometheus and Loki: reaching this address at all means passing the tailnet
# ACL. Tenants are on another tailnet and cannot see it.
autolab_services_registry_delete_enabled: true

# Diun watches the images this lab runs and says when a newer tag exists. It
# never updates anything: versions are pinned in git, and an image that
# changed under you is the thing this lab is built to avoid.
autolab_services_diun_schedule: "0 8 * * *"
autolab_services_diun_ntfy_topic: "{{ autolab_obs_ntfy_topic | default('') }}"
autolab_services_diun_ntfy_url: "{{ autolab_obs_ntfy_url | default('https://ntfy.sh') }}"

# Diun stamps its notifications with a local time.
autolab_services_timezone: "{{ autolab_timezone | default('UTC') }}"
