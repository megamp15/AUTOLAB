---
- name: Register the existing NAS agent through shared Docker management
  ansible.builtin.include_role:
    name: dockhand-environment
  vars:
    autolab_dockhand_agent_token_file: "{{ autolab_nas_management_root }}/secrets/hawser-token"
    autolab_dockhand_agent_port: "{{ autolab_nas_hawser_port }}"
    autolab_dockhand_api: "{{ autolab_nas_dockhand_api }}"
    autolab_dockhand_manager: "{{ autolab_nas_dockhand_manager }}"

- name: Retain the verified NAS connection result for retirement checks
  ansible.builtin.set_fact:
    autolab_nas_dockhand_test: "{{ autolab_dockhand_connection_test }}"
  no_log: true
