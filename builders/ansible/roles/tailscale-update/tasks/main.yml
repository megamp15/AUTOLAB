---
- name: Require a Debian-family Builder target
  ansible.builtin.assert:
    that: ansible_os_family == "Debian"
    fail_msg: "Autolab Builder currently supports Debian-family hosts only."

# Pin to the `stable` track: `unstable`/`beta` tracks ship faster but are not
# appropriate for unattended security maintenance on lab servers.
- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Install the Tailscale repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/{{ tailscale_track }}/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Install the Tailscale apt repository definition
  ansible.builtin.get_url:
    url: >-
      https://pkgs.tailscale.com/{{ tailscale_track }}/{{
      ansible_facts['distribution'] | lower }}/{{
      ansible_facts['distribution_release'] }}.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: '0644'

# CI-driven upgrades instead of `tailscale set --auto-update`: the built-in
# updater races unattended-upgrades on the same dpkg lock (tailscale/tailscale
# #10400) and can leave the package half-upgraded. One Ansible run per update
# keeps upgrades serialized and observable.
# A hold left by an interrupted updates run would make the upgrade below a
# silent no-op.
- name: Release any hold on Tailscale
  ansible.builtin.dpkg_selections:
    name: tailscale
    selection: install

- name: Install or upgrade Tailscale (check mode)
  ansible.builtin.apt:
    name: tailscale
    state: "{{ tailscale_package_state }}"
    update_cache: true
    cache_valid_time: 3600
  when: ansible_check_mode

# The upgrade restarts tailscaled, and the run arrives through it. Detached,
# apt finishes whether or not this session survives; the tasks after it wait
# for a connection and then collect the result.
- name: Install or upgrade Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: "{{ tailscale_package_state }}"
    update_cache: true
    cache_valid_time: 3600
  async: 600
  poll: 0
  register: autolab_tailscale_upgrade_job
  when: not ansible_check_mode

- name: Wait for the connection tailscaled carries to come back
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 300
  when: not ansible_check_mode

- name: Collect the upgrade's result
  ansible.builtin.async_status:
    jid: "{{ autolab_tailscale_upgrade_job.ansible_job_id }}"
  register: autolab_tailscale_upgrade
  until: autolab_tailscale_upgrade.finished
  retries: 60
  delay: 5
  changed_when: autolab_tailscale_upgrade.changed | default(false)
  when: not ansible_check_mode
