---
# Backends for the telemetry every Builder host sends. Runs only on the machine
# marked `observability.stack = true`.

autolab_obs_root: /opt/autolab/observability

# Pinned by digest-bearing tags rather than `latest`: an agent that silently
# upgrades its backend mid-incident is the last thing you want, and a pinned
# version is what makes a dashboard reproducible.
autolab_obs_images:
  prometheus: "prom/prometheus:v3.14.0"
  loki: "grafana/loki:3.7.7"
  # grafana/grafana, not grafana/grafana-oss. Both are the OSS build — the
  # enterprise image is grafana/grafana-enterprise — but grafana-oss stopped
  # publishing after 13.0.2 while grafana/grafana is current. A GitHub release
  # tag is not proof that a registry tag exists; check the registry.
  grafana: "grafana/grafana:13.2.2"
  pve_exporter: "prompve/prometheus-pve-exporter:3.10.0"
  homepage: "nginx:1.31.6-alpine"

# Metrics live on local disk. A TSDB does heavy random I/O with mmap and file
# locking, which NFS handles poorly — Prometheus documents non-POSIX
# filesystems as unsupported and a possible cause of unrecoverable corruption.
# The NAS holds the durable copy instead; see autolab_obs_backup_dir.
autolab_obs_retention_time: "90d"

# Sized against the disk, not against ambition. The Debian template's root
# partition cannot grow past ~7.5 GB (see docs/gitops/observability.md), so a
# 20 GB cap would let the TSDB fill the filesystem and take the host with it.
# Whichever limit is reached first wins, so time is the intent and size is the
# guard rail.
autolab_obs_retention_size: "2GB"

# The public side, once the ingress phase is live. The workflow fills these
# from the Cloudflare stack's outputs and from Grafana's OIDC client in
# Pocket ID. Empty means Grafana stays as it was: tailnet-only, anonymous
# viewer. Set, Grafana gets its public root URL, logs in via Pocket ID and
# anonymous viewing goes off — a public route plus anonymous viewing would
# be public dashboards. The homepage's links follow.
autolab_obs_public_zone: ""
autolab_obs_public_hosts:
  grafana: grafana
  auth: auth
  home: home
# The tailnet side of ingress: *.<label>.<zone> names with real certificates,
# reachable only on the tailnet. Empty means the rows keep their raw
# addresses and ports.
autolab_obs_internal_label: ""
autolab_obs_grafana_oidc_client_id: ""
autolab_obs_grafana_oidc_client_secret: ""
# Pocket ID groups → Grafana roles. admins are server admins; anyone else
# Pocket ID lets in is a viewer unless an editors group says otherwise.
autolab_obs_grafana_role_attribute_path: >-
  contains(groups[*], 'admins') && 'GrafanaAdmin' || contains(groups[*], 'editors') && 'Editor' || 'Viewer'

# Alerting. Rules are provisioned from files like dashboards; an alert that
# exists only in a UI is as unreviewable as a dashboard that does.
autolab_obs_alerts_enabled: true

# Guests that declared observability.agent = false. Resolved from the inventory
# rather than listed by hand, so the machines map stays the single place a
# machine's monitoring is decided.
autolab_obs_unmonitored_guests: >-
  {{ hostvars | dict2items
     | selectattr('value.autolab_builder', 'defined')
     | selectattr('value.autolab_builder.observability', 'defined')
     | selectattr('value.autolab_builder.observability.agent', 'defined')
     | rejectattr('value.autolab_builder.observability.agent')
     | map(attribute='key') | list }}

# Guest names that are never a managed machine, dropped from every join on
# pve_guest_info. `qmrestore` names a guest "VM <id>" until the restore
# workflow renames it "<guest>-restore-test"; both series then sit in the
# staleness window for one id, group_left sees two right-hand matches, and
# the query fails — for the whole test run, on every rule that joins. The
# test guest is link-down and unbacked by design, so nothing should watch it.
autolab_obs_transient_guest_names:
  - 'VM [0-9]+'
  - '.*-restore-test'

# Thresholds. Defaults chosen to fire with enough warning to act, not so early
# that they become background noise people learn to ignore.
autolab_obs_alert_disk_pct: 85
autolab_obs_alert_memory_pct: 90
autolab_obs_alert_pve_storage_pct: 85

# Where alerts are delivered. Empty means they stay visible in Grafana's
# alerting UI but nothing is pushed anywhere — better than no rules, but it
# still relies on someone looking at a page they have no reason to open.
#
# ntfy has no account and no API key: the topic string is the entire
# credential. Anyone who knows it can both read these alerts and publish to
# them, which is why it is a secret rather than a variable, and why it carries
# random entropy instead of a guessable name.
#
# Delivery deliberately does not use the tailnet. This is an outbound HTTPS
# POST to a third party, so it still arrives when the tailnet — or this host —
# is the thing that broke. An alert path sharing a failure domain with the
# thing it watches is not an alert path.
autolab_obs_ntfy_url: "https://ntfy.sh"
autolab_obs_ntfy_topic: ""

# ntfy priorities: 5 max (long vibration, pop-over), 3 default, 1 min.
# Critical interrupts; warning must not. A channel that buzzes for everything
# gets muted, and then it delivers nothing at all.
autolab_obs_ntfy_priority_critical: 5
autolab_obs_ntfy_priority_warning: 3

# How often an unacknowledged alert repeats. ntfy has no acknowledgement, so
# repetition is the only thing that keeps a missed page from being missed
# permanently.
autolab_obs_ntfy_repeat_critical: "1h"
autolab_obs_ntfy_repeat_warning: "6h"

# Where snapshots are copied. Empty disables the backup timer, which is the
# right default until the NAS export for this host exists.
autolab_obs_backup_dir: ""
autolab_obs_backup_on_calendar: "daily"

# Grafana is reached over the tailnet only. The baseline firewall already
# allows everything on tailscale0, so no port is opened to the LAN.
autolab_obs_grafana_port: 3000
autolab_obs_prometheus_port: 9090
autolab_obs_loki_port: 3100
autolab_obs_pve_exporter_port: 9221

# Proxmox API credentials for the hypervisor exporter. Left empty until a
# dedicated read-only token exists: the OpenTofu token can create and destroy
# VMs, and an exporter has no business holding that. Empty disables the
# exporter rather than shipping it broken.
autolab_obs_pve_host: ""
autolab_obs_pve_token_id: ""
autolab_obs_pve_token_secret: ""
autolab_obs_pve_verify_ssl: false

# The exporter image runs as uid 101 (prometheus), not root, so a root-owned
# 0600 credentials file is unreadable to it and the container crash-loops. Owned
# by that uid instead, still 0600 — readable by the one process that needs it
# and nothing else on the host.
autolab_obs_pve_container_uid: 101

# Grafana's container runs as uid 472. Any provisioning file it must read has
# to be readable by *that* uid, not by root — Grafana treats a provisioning
# failure as fatal, so a root-owned 0600 file does not degrade the feature, it
# crash-loops the whole service.
autolab_obs_grafana_container_uid: 472

# Grafana's admin login. Anonymous viewing is deliberate, but the admin account
# can rewrite dashboards, add datasources and change where alerts are delivered,
# so leaving it on the default admin/admin hands all of that to anyone on the
# tailnet. Empty leaves the password alone rather than setting a blank one.
# Grafana feature toggles. Dynamic dashboards — tabs, conditional panels and
# auto grid — went generally available in 13.2 and use the v2 dashboard schema,
# which needs the newer dashboards API. Listing them explicitly is harmless
# where they are already on by default, and it records why they are wanted.
#
# Git Sync's `provisioning` toggle is on by default in Grafana 13 OSS, so it is
# deliberately not listed here.
autolab_obs_grafana_feature_toggles:
  - kubernetesDashboards
  - dashboardNewLayouts

autolab_obs_grafana_admin_user: admin
autolab_obs_grafana_admin_password: ""

# The morning digest: one ntfy message a day with what the alert rules do
# not say — did last night's backup run, how old each guest's newest backup
# is, storage headroom, what is firing. Sent from the stack host, which
# already holds the read-only Proxmox token and the ntfy topic; nothing new
# to keep secret. Off when either is missing. Local time of the stack host.
autolab_obs_digest_enabled: true
autolab_obs_digest_on_calendar: "*-*-* 06:00:00"
autolab_obs_digest_backup_storage: ark
# A guest whose newest backup is older than this is called stale. 26 hours
# gives a nightly job two hours of slack.
autolab_obs_digest_stale_hours: 26

# How often the stack host asks PBS for each guest's newest backup and
# writes it for Alloy. The alert works in hours, so minutes are plenty.
autolab_obs_backup_metrics_interval: 15min
# A running guest whose newest backup is older than this pages. A nightly
# plus two hours of slack, like the digest's stale threshold.
autolab_obs_alert_backup_max_age_hours: 26

# The homepage: the Singularity design (docs/design) served by nginx on the
# tailnet address, fed by status.json which the digest script writes every
# minute. Links are declared here; guests are discovered from Proxmox. A
# link with a `check` gets a live up/down dot; without one it is a plain
# link. Hosts are named by MagicDNS so the addresses follow the devices.
autolab_obs_homepage_enabled: true
autolab_obs_homepage_port: 8080
# Grafana's address as people should open it: the public name once Grafana
# logs people in itself (the same switch that gives it a public route), the
# tailnet address until then. Also its root_url.
autolab_obs_grafana_public_url: >-
  {{ 'https://' ~ autolab_obs_public_hosts.grafana ~ '.' ~ autolab_obs_public_zone
     if autolab_obs_grafana_oidc_client_id | length > 0
     else 'http://' ~ autolab_tailscale_fqdn ~ ':' ~ autolab_obs_grafana_port }}

# An internal name when the tailnet side exists, the raw address otherwise.
autolab_obs_lab_url: >-
  {%- if autolab_obs_internal_label | length > 0 -%}https://{name}.{{ autolab_obs_internal_label }}.{{ autolab_obs_public_zone }}{%- else -%}{raw}{%- endif -%}

autolab_obs_homepage_links:
  - name: Proxmox VE
    group: infrastructure
    meta: "{{ autolab_obs_pve_host.split('.')[0] }}"
    url: "{{ autolab_obs_lab_url.format(name=autolab_obs_pve_host.split('.')[0], raw='https://' ~ autolab_obs_pve_host ~ ':8006') }}"
    icon: hypervisor
    check:
      type: http
      target: "https://{{ autolab_obs_pve_host }}:8006"
  - name: Backup Server
    group: infrastructure
    meta: ark
    url: "{{ autolab_obs_lab_url.format(name='pbs', raw='https://ark.' ~ autolab_tailscale_fqdn.split('.', 1)[1] ~ ':8007') }}"
    icon: backup
    check:
      type: tcp
      target: "ark.{{ autolab_tailscale_fqdn.split('.', 1)[1] }}:8007"
  - name: NAS
    group: infrastructure
    meta: singularity
    url: "{{ autolab_obs_lab_url.format(name='nas', raw='https://singularity.' ~ autolab_tailscale_fqdn.split('.', 1)[1] ~ ':9443') }}"
    icon: nas
    check:
      type: tcp
      target: "singularity.{{ autolab_tailscale_fqdn.split('.', 1)[1] }}:2049"
  # The login itself, reached the way a phone on LTE reaches it: through
  # Cloudflare and the tunnel. A red dot here is the tunnel, not Pocket ID.
  # `enabled` false drops the row before the file is written.
  - name: Tailscale
    group: infrastructure
    meta: admin console
    url: https://login.tailscale.com/admin/machines
    icon: tailnet
  - name: Grafana
    group: observability
    meta: dashboards
    url: "{{ autolab_obs_grafana_public_url }}"
    icon: metrics
    check:
      type: http
      target: "http://{{ autolab_tailscale_fqdn }}:{{ autolab_obs_grafana_port }}/api/health"
  - name: Prometheus
    group: observability
    meta: metrics
    url: "{{ autolab_obs_lab_url.format(name='prometheus', raw='http://' ~ autolab_tailscale_fqdn ~ ':' ~ autolab_obs_prometheus_port) }}"
    icon: metrics
    check:
      type: http
      target: "http://{{ autolab_tailscale_fqdn }}:{{ autolab_obs_prometheus_port }}/-/ready"
  - name: Loki
    group: observability
    meta: logs
    url: "{{ autolab_obs_grafana_public_url }}/explore"
    icon: logs
    check:
      type: http
      target: "http://{{ autolab_tailscale_fqdn }}:{{ autolab_obs_loki_port }}/ready"
  # UGOS's UI, over the tailnet — not the ug.link relay, which routes the
  # NAS through Ugreen's cloud. Everything on this page stays on the tailnet.
  - name: Pocket ID
    group: services
    meta: sign in
    url: "https://{{ autolab_obs_public_hosts.auth }}.{{ autolab_obs_public_zone }}"
    icon: tailnet
    enabled: "{{ autolab_obs_public_zone | length > 0 }}"
    check:
      type: http
      target: "https://{{ autolab_obs_public_hosts.auth }}.{{ autolab_obs_public_zone }}/"
  # The container tooling, when this machine runs it. `enabled` drops a row
  # whose service is not in the machines map, so the page shows what exists.
  - name: Portainer
    group: services
    meta: containers
    url: "{{ autolab_obs_lab_url.format(name='portainer', raw='http://' ~ autolab_tailscale_fqdn ~ ':' ~ autolab_service_catalog.portainer.port) }}"
    icon: hypervisor
    enabled: "{{ 'portainer' in ((autolab_builder | default({})).services | default([])) }}"
    check:
      type: http
      target: "http://{{ autolab_tailscale_fqdn }}:{{ autolab_service_catalog.portainer.port }}/"
  - name: Registry
    group: services
    meta: images
    url: "{{ autolab_obs_lab_url.format(name='registry-ui', raw='http://' ~ autolab_tailscale_fqdn ~ ':' ~ autolab_service_catalog['registry-ui'].port) }}"
    icon: repo
    enabled: "{{ 'registry-ui' in ((autolab_builder | default({})).services | default([])) }}"
    check:
      type: http
      target: "http://{{ autolab_tailscale_fqdn }}:{{ autolab_service_catalog.registry.port }}/v2/"
  - name: GitHub
    group: services
    meta: megamp15/AUTOLAB
    url: https://github.com/megamp15/AUTOLAB
    icon: repo
