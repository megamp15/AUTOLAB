<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AUTOLAB: the homepage's singularity — an event horizon with its disc
       passing in front. Rounded tile for tabs and pinned sites. -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <g transform="rotate(-20 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="7.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="0.55"/>
  </g>
  <circle cx="32" cy="32" r="11.5" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="3"/>
  <g transform="rotate(-20 32 32)">
    <path d="M7 32 A25 7.5 0 0 0 57 32" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
