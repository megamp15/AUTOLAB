# Managed by Ansible — roles/observability-stack. Local edits are overwritten.
apiVersion: 1

providers:
  - name: autolab
    orgId: 1
    folder: Autolab
    type: file
    # Editing a provisioned dashboard in the UI would drift from git and be
    # silently reverted on the next run. Locking it makes the source of truth
    # obvious to whoever opens it.
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
