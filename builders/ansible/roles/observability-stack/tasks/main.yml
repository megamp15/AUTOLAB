---
- name: Require a Debian-family Builder target
  ansible.builtin.assert:
    that: ansible_os_family == "Debian"
    fail_msg: "Autolab Builder currently supports Debian-family hosts only."

# The stack is containers; without Docker the rest of this role would fail
# later and less clearly.
# Reads the machine policy directly rather than autolab_docker_enabled, which
# belongs to the docker-host role's defaults and is not in scope here. A role
# that depends on another role's variables breaks depending on play order.
- name: Require Docker on the stack host
  ansible.builtin.assert:
    that: (autolab_builder | default({})).docker_enabled | default(false) | bool
    fail_msg: >-
      The observability stack needs Docker. Set builder.docker_enabled = true
      for this machine in machines.auto.tfvars and run the docker playbook
      first.

# Container ports bind to this address only. Docker writes its own iptables
# rules ahead of ufw's, so publishing on 0.0.0.0 would reach the LAN despite the
# host firewall's default-deny.
- name: Discover this host's tailnet address
  ansible.builtin.command: tailscale ip -4
  register: autolab_tailscale_ip_raw
  changed_when: false

- name: Set the tailnet address fact
  ansible.builtin.set_fact:
    autolab_tailscale_ip: "{{ autolab_tailscale_ip_raw.stdout_lines[0] }}"

# Container ports must bind to the address, but anything a human clicks later
# should use the name. A tailnet IP belongs to a device, and destroying and
# recreating this VM produces a new one — which would leave every past
# notification pointing at nothing, with no error anywhere.
- name: Discover this host's MagicDNS name
  ansible.builtin.command: tailscale status --json
  register: autolab_tailscale_status
  changed_when: false

- name: Set the MagicDNS name fact
  ansible.builtin.set_fact:
    autolab_tailscale_fqdn: >-
      {{ (autolab_tailscale_status.stdout | from_json).Self.DNSName
         | regex_replace('\.$', '') }}

- name: Create the observability directory tree
  ansible.builtin.file:
    path: "{{ autolab_obs_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - ""
    - prometheus
    - loki
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - grafana/provisioning/alerting

# Grafana's container runs as uid 472 and will not start if it cannot write its
# database.
- name: Give Grafana ownership of its data directory
  ansible.builtin.file:
    path: "{{ autolab_obs_root }}/grafana/data"
    state: directory
    owner: "{{ autolab_obs_grafana_container_uid }}"
    group: "{{ autolab_obs_grafana_container_uid }}"
    mode: "0755"

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ autolab_obs_root }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart observability stack

- name: Install Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ autolab_obs_root }}/loki/loki.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart observability stack

# Datasources are provisioned from files and are not editable in the UI. They
# are wiring, not content: a dashboard benefits from being dragged into shape,
# a datasource UID does not, and the alert rules below reference these UIDs by
# name. Dashboards moved to Git Sync.
- name: Provision Grafana datasources
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: "{{ autolab_obs_root }}/grafana/provisioning/datasources/autolab.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart observability stack

# Dashboards moved to Git Sync; Grafana owns them now and commits edits back.
# These two removals matter: leaving the old provider in place would load a
# second copy of every dashboard, and two dashboards with the same title are
# genuinely hard to tell apart in the UI.
- name: Remove the retired file-based dashboard provider
  ansible.builtin.file:
    path: "{{ autolab_obs_root }}/grafana/provisioning/dashboards/autolab.yml"
    state: absent
  notify: Restart observability stack

- name: Remove the retired file-provisioned dashboards
  ansible.builtin.file:
    path: "{{ autolab_obs_root }}/grafana/dashboards"
    state: absent
  notify: Restart observability stack

# Alert rules alongside dashboards, for the same reason: a rule that exists only
# in a UI cannot be reviewed and is lost with the volume it lives in.
- name: Provision alert rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: "{{ autolab_obs_root }}/grafana/provisioning/alerting/autolab.yml"
    owner: root
    group: root
    mode: "0644"
  when: autolab_obs_alerts_enabled | bool
  notify: Restart observability stack

# Delivery. Without this the rules above are real but inert: they resolve
# correctly and tell nobody. Skipped when no topic is configured rather than
# provisioned empty, because an empty policy tree would silently replace the
# default one and leave alerts with nowhere at all to go.
- name: Provision alert delivery
  ansible.builtin.template:
    src: notifications.yml.j2
    dest: "{{ autolab_obs_root }}/grafana/provisioning/alerting/notifications.yml"
    # Owned by Grafana's uid, not root. 0600 root-owned looks like the careful
    # choice for a file holding a credential, but Grafana cannot read it and a
    # failed provision is fatal, not degraded — it crash-loops on startup.
    # Readable by the one process that needs it, and nothing else on the host.
    owner: "{{ autolab_obs_grafana_container_uid }}"
    group: "{{ autolab_obs_grafana_container_uid }}"
    mode: "0600"
  when:
    - autolab_obs_alerts_enabled | bool
    - autolab_obs_ntfy_topic | length > 0
  notify: Restart observability stack

# The topic is the entire ntfy credential, so a stale copy left behind after it
# is rotated or removed would keep publishing to a channel that is no longer
# yours.
- name: Remove alert delivery when no topic is configured
  ansible.builtin.file:
    path: "{{ autolab_obs_root }}/grafana/provisioning/alerting/notifications.yml"
    state: absent
  when: autolab_obs_ntfy_topic | length == 0
  notify: Restart observability stack

# The Proxmox API token is a file rather than an environment variable so it is
# not visible in `docker inspect` or the process list.
- name: Install the Proxmox exporter credentials
  ansible.builtin.template:
    src: pve.yml.j2
    dest: "{{ autolab_obs_root }}/pve.yml"
    owner: "{{ autolab_obs_pve_container_uid }}"
    group: "{{ autolab_obs_pve_container_uid }}"
    mode: "0600"
  when: autolab_obs_pve_token_id | length > 0
  notify: Restart observability stack

- name: Install the compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ autolab_obs_root }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart observability stack

- name: Bring the observability stack up
  community.docker.docker_compose_v2:
    project_src: "{{ autolab_obs_root }}"
    state: present
    pull: missing

# The agent play that follows starts shipping immediately, and loki.write does
# not recover from a refused connection. Waiting here rather than racing it.
- name: Wait for Loki to accept writes
  ansible.builtin.uri:
    url: "http://{{ autolab_tailscale_ip }}:{{ autolab_obs_loki_port }}/ready"
    status_code: [200]
  register: autolab_obs_loki_ready
  until: autolab_obs_loki_ready.status == 200
  retries: 30
  delay: 5
  changed_when: false

# Grafana is gated too, and not merely for symmetry. `docker_compose_v2` with
# state: present reports success once containers are *created*, so a Grafana
# that crash-loops on a bad provisioning file leaves a green deploy behind and
# a dead dashboard nobody looks at until they need it. Provisioning errors are
# fatal in Grafana, which makes this the most likely way this role breaks.
- name: Wait for Grafana to come up
  ansible.builtin.uri:
    url: "http://{{ autolab_tailscale_ip }}:{{ autolab_obs_grafana_port }}/api/health"
    status_code: [200]
  register: autolab_obs_grafana_ready
  until: autolab_obs_grafana_ready.status == 200
  retries: 20
  delay: 5
  changed_when: false

# GF_SECURITY_ADMIN_PASSWORD is only consulted when Grafana creates the admin
# user, so on any host that has already run it the variable is set, ignored, and
# admin/admin still works — configured-looking and wrong. The CLI reset is the
# only thing that changes an existing account, and it is safe to repeat.
# Passed through the environment so the password does not appear in the host's
# process list, and addressed by compose *service* name rather than container
# name — the generated name depends on the project directory, and a wrong one
# fails as "No such container" on stderr, which is easy to miss.
- name: Enforce the Grafana admin password
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ autolab_obs_root }}"
      - exec
      - -T
      - -e
      - "GF_ADMIN_PW={{ autolab_obs_grafana_admin_password }}"
      - grafana
      - sh
      - -c
      - 'grafana cli --homepath /usr/share/grafana admin reset-admin-password "$GF_ADMIN_PW"'
  when: autolab_obs_grafana_admin_password | length > 0
  changed_when: false
  no_log: true

- name: Wait for Prometheus to accept writes
  ansible.builtin.uri:
    url: "http://{{ autolab_tailscale_ip }}:{{ autolab_obs_prometheus_port }}/-/ready"
    status_code: [200]
  register: autolab_obs_prom_ready
  until: autolab_obs_prom_ready.status == 200
  retries: 30
  delay: 5
  changed_when: false

# Prometheus keeps its own data on local disk; the NAS holds the copy that
# survives losing this VM. Snapshots go through the admin API so the TSDB is
# consistent, rather than copying files out from under a running database.
# The NAS mount is a separate playbook, and the export rule is a manual step on
# the NAS. Rather than fail nightly against a path that is not there, detect the
# mount and install the timer only once it exists — so declaring the backup path
# is safe before the share is ready.
- name: Check whether the snapshot target is mounted
  ansible.builtin.stat:
    path: "{{ autolab_obs_backup_dir | dirname }}"
  register: autolab_obs_backup_parent
  changed_when: false
  when: autolab_obs_backup_dir | length > 0

- name: Report that snapshots are waiting on the NAS mount
  ansible.builtin.debug:
    msg: >-
      {{ autolab_obs_backup_dir | dirname }} is not mounted, so Prometheus
      snapshots to the NAS are not installed. Metrics currently survive only on
      this host's local disk. Mount the share (playbook nfs) and re-run.
  when:
    - autolab_obs_backup_dir | length > 0
    - not (autolab_obs_backup_parent.stat.exists | default(false))

- name: Create the snapshot destination on the share
  ansible.builtin.file:
    path: "{{ autolab_obs_backup_dir }}"
    state: directory
    mode: "0755"
  when:
    - autolab_obs_backup_dir | length > 0
    - autolab_obs_backup_parent.stat.exists | default(false)

# The snapshot script shells out to rsync, which the Debian template does not
# carry. Installed only where snapshots are configured rather than added to the
# universal baseline: a package belongs with the thing that needs it, so
# removing that thing removes its dependency too.
- name: Install the snapshot script's dependencies
  ansible.builtin.apt:
    name: rsync
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - autolab_obs_backup_dir | length > 0
    - autolab_obs_backup_parent.stat.exists | default(false)

- name: Install the snapshot script
  ansible.builtin.template:
    src: snapshot-to-nas.sh.j2
    dest: /usr/local/bin/autolab-obs-snapshot
    owner: root
    group: root
    mode: "0755"
  when:
    - autolab_obs_backup_dir | length > 0
    - autolab_obs_backup_parent.stat.exists | default(false)

- name: Install the snapshot timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - autolab-obs-snapshot.service
    - autolab-obs-snapshot.timer
  when:
    - autolab_obs_backup_dir | length > 0
    - autolab_obs_backup_parent.stat.exists | default(false)

- name: Enable the snapshot timer
  ansible.builtin.systemd_service:
    name: autolab-obs-snapshot.timer
    state: started
    enabled: true
    daemon_reload: true
  when:
    - autolab_obs_backup_dir | length > 0
    - autolab_obs_backup_parent.stat.exists | default(false)
