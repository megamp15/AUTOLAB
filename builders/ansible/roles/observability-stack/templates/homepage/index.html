<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTOLAB</title>
<!-- The singularity from the scene below, as a tile: tabs and pinned sites
     read the SVG, iOS and home screens the PNGs. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0A0A0A">
<!--
  Managed by Ansible — roles/observability-stack. The "Singularity" design
  (docs/design/singularity.dc.html) ported to a page with no framework: the
  canvas, scramble and drag code is the original's; rows and feed come from
  status.json, written next to this file every minute by the digest script.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: inherit; }
  [data-sg-root] { --sg-p:0; --sg-enter:0; --sg-glitch:0; --sg-flood:0; --sg-bg:#FFFFFF; --sg-fg:#0A0A0A; position:relative; background:var(--sg-bg); color:var(--sg-fg); font-family:'Space Grotesk',system-ui,sans-serif; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .row { position:relative; display:flex; align-items:center; gap:16px; padding:10px 2px; transition:padding-left .25s ease; }
  .row:hover { padding-left:10px; }
  .row svg { flex:none; }
  .row .name { font-size:13.5px; letter-spacing:.02em; flex:1 1 auto; min-width:0; }
  .row .meta { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; opacity:.75; white-space:nowrap; }
  .row .dot { width:5px; height:5px; border-radius:50%; flex:none; border:1px solid currentColor; }
  .row .line { position:absolute; left:0; right:0; bottom:0; height:1px; background:currentColor; opacity:.35; }
  .feed { display:flex; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:11px; line-height:1.6; }
  /* Seventeen rows is past the point where a flat list can be scanned. The
     heading borrows the wordmark's voice rather than introducing a new one. */
  .head { margin:20px 0 4px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.3em; text-transform:uppercase; }
  .head:first-child { margin-top:0; }
  .head span { opacity:.75; }
  .feed .t { opacity:.75; font-variant-numeric:tabular-nums; }
  .hint { position:fixed; left:0; right:0; bottom:18px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.3em; opacity:.75; pointer-events:none; }

  /* Static mode: the page stops being a scroll-driven scene and becomes a
     document. Used on phones and when someone asks for less motion. A list
     taller than the screen does not need it: the list scrolls inside itself
     (fitRows()). The starfield stays, fixed behind the content. */
  [data-sg-root].static .scene { height:auto !important; }
  [data-sg-root].static .stick { position:static !important; height:auto !important; overflow:visible !important; }
  /* Fixed keeps the sky behind a page that now scrolls. z-index and
     pointer-events are not decoration: a positioned canvas paints above
     static content and swallows every click on the list underneath it. */
  [data-sg-root].static canvas[data-sg-sky] { position:fixed !important; z-index:0; pointer-events:none; }
  [data-sg-root].static #stage { position:relative !important; z-index:1; pointer-events:auto !important;
    min-height:100dvh; padding-block:clamp(24px,6vh,64px) !important; }
  [data-sg-root].static .hint { display:none; }
  /* The list's own scroll, for when it is taller than the screen: no bar,
     and overscroll-behavior stops a scroll past its top from carrying on
     into the page and rewinding the intro. */
  #rows { overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:none; }
  #rows::-webkit-scrollbar { display:none; }
  [data-sg-root].static #rows { overflow:visible; }
  /* Everything in the dashboard fades in with the flood, like the header and
     the rows. The tabs and the panels' own copy once had no opacity of their
     own, so they sat blurred over the black hole for the whole intro. */
  .tabs, #rows > .ops, #rows > .arch { opacity:calc((var(--sg-flood) - 0.02) * 9); }
  #bar { display:flex; align-items:center; gap:12px 40px; flex-wrap:wrap; }
  #brand { flex:none; }
  #clockbox { margin-left:auto; }
  .tabs { display:flex; gap:28px; }
  .tabs button { padding:6px 0 !important; }
  .tabs button { color:inherit; background:none; border:0; border-bottom:2px solid transparent; padding:12px 0; font:inherit; font-size:13px; cursor:pointer; }
  .tabs button[aria-selected="true"] { border-bottom-color:currentColor; }
  :focus-visible { outline:1px dashed color-mix(in srgb,currentColor 60%,transparent); outline-offset:3px; }
  /* Tabs show focus the way they show selection, by their underline; the
     diagram's viewport and the panel never draw a ring around themselves. */
  .tabs button:focus-visible { outline:none; border-bottom-style:dashed; border-bottom-color:currentColor; }
  .a-zoom:focus, .a-zoom:focus-visible, #rows:focus, #rows:focus-visible { outline:none; }
  .access { font-size:11px; white-space:nowrap; opacity:.8; }
  .ops { font-size:13px; line-height:1.6; }
  .ops h2 { margin:0 0 8px; font-size:20px; font-weight:500; }
  .ops h3 { margin:28px 0 8px; font-size:15px; font-weight:500; }
  .ops p { margin:0 0 16px; max-width:70ch; }
  .ops .muted { opacity:.75; }
  .ops table { width:100%; border-collapse:collapse; font-size:12px; text-align:left; }
  .ops th, .ops td { padding:10px 8px 10px 0; border-bottom:1px solid color-mix(in srgb,currentColor 25%,transparent); vertical-align:top; }
  .ops th { font-weight:500; }
  .ops td small { display:block; opacity:.75; }
  .ops details { padding:12px 0; border-bottom:1px solid color-mix(in srgb,currentColor 25%,transparent); }
  .ops summary { cursor:pointer; }
  .ops details p { margin:10px 0 0; }
  .ops code { font:11px 'IBM Plex Mono',monospace; overflow-wrap:anywhere; }
  .ops .table-scroll { overflow-x:auto; }

  /* Architecture. The panel widens past the list's 760px; everything is ink
     on paper at different strengths, so it follows the flip and the flood
     like the rest of the page. */
  /* Services: each group's rows flow into as many columns as the screen
     holds; one column on a phone. */
  .group-rows { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); column-gap:44px; }
  #rows { position:relative; }
  /* The panel takes focus so the keyboard can scroll it; the browser's
     outline around the whole thing said nothing a reader needed. */
  #rows:focus-visible { outline:none; }
  .a-pill { color:inherit; background:none; font-size:11px; padding:5px 11px; cursor:pointer; border-radius:999px;
    border:1px solid color-mix(in srgb,currentColor 35%,transparent); }
  .a-pill:hover, .a-pill[aria-pressed="true"] { background:color-mix(in srgb,currentColor 12%,transparent); border-color:currentColor; }
  .arch { display:flex; flex-direction:column; gap:12px; }
  .a-toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px 28px; }
  .a-toolbar .a-legend { flex:1 1 auto; justify-content:center; }
  .a-intro h2 { margin:0 0 2px; }
  .a-intro p { margin:0; }
  .a-live { font-size:10.5px; letter-spacing:.2em; }
  .a-live::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:8px; vertical-align:1px; animation:a-blink 2s ease-in-out infinite; }
  @keyframes a-blink { 50% { opacity:.25; } }
  .a-tools { display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; }
  .a-toggle { font-size:12px; display:inline-flex; gap:6px; align-items:center; cursor:pointer; }
  .a-zoomctl { display:inline-flex; align-items:center; border:1px solid color-mix(in srgb,currentColor 35%,transparent); border-radius:4px; font-size:11px; }
  .a-zoomctl button { color:inherit; background:none; border:0; border-left:1px solid color-mix(in srgb,currentColor 20%,transparent); padding:5px 9px; font:inherit; cursor:pointer; }
  .a-zoomctl button:first-child { border-left:0; }
  .a-zoomctl button:hover, .a-zoomctl button[aria-pressed="true"] { background:color-mix(in srgb,currentColor 12%,transparent); }
  .a-zoomval { min-width:46px; text-align:center; font-variant-numeric:tabular-nums; border-left:1px solid color-mix(in srgb,currentColor 20%,transparent); padding:5px 4px; }
  .a-zoom { position:relative; }
  .a-zoom.on { overflow:auto; overscroll-behavior:contain; cursor:grab; scrollbar-width:thin;
    border:1px solid color-mix(in srgb,currentColor 18%,transparent); border-radius:6px; }
  .a-zoom.on.dragging { cursor:grabbing; user-select:none; }
  .a-zoom.on .a-sizer { margin:0 auto; }
  /* Landscape: the way in on the left, the machines in the middle, where the
     data goes on the right. The rows dissolve so each card takes a cell. */
  .a-canvas.a-land { display:grid; column-gap:90px; row-gap:40px; align-items:center;
    grid-template-columns:minmax(300px,1fr) minmax(0,4.2fr) minmax(280px,1fr);
    grid-template-areas:"cf nodes backups" "door nodes nas" "ts nodes obs" "gh nodes ." "access access access";
    grid-template-rows:repeat(4, minmax(0,1fr)) auto; }
  .a-land .a-row-edge, .a-land .a-row-door, .a-land .a-row-data { display:contents; }
  .a-land .a-row-nodes { grid-area:nodes; margin:0; }
  .a-land .a-card { z-index:1; }
  .a-land [data-wire="cf"] { grid-area:cf; } .a-land [data-wire="ts"] { grid-area:ts; } .a-land [data-wire="gh"] { grid-area:gh; }
  .a-land .a-door { grid-area:door; width:auto; }
  .a-land [data-wire="backups"] { grid-area:backups; } .a-land [data-wire="nas"] { grid-area:nas; } .a-land [data-wire="obs"] { grid-area:obs; }
  .a-land .a-access { grid-area:access; margin:0; }
  .a-zoom.on .a-canvas { transform-origin:0 0; padding:24px; box-sizing:border-box; }
  .a-access { font-size:11.5px; line-height:1.6; opacity:.7; margin:22px 0 0; max-width:110ch; }
  /* Hovering a legend entry: its wires stay, the rest step back. */
  .a-canvas[data-focus] .a-wire, .a-canvas[data-focus] .a-packet { opacity:.12; transition:opacity .25s; }
  .a-canvas[data-focus="public"] .a-public, .a-canvas[data-focus="public"] .a-p-public,
  .a-canvas[data-focus="tailnet"] .a-tailnet, .a-canvas[data-focus="tailnet"] .a-p-tailnet,
  .a-canvas[data-focus="backup"] .a-backup, .a-canvas[data-focus="backup"] .a-p-backup,
  .a-canvas[data-focus="signal"] .a-signal, .a-canvas[data-focus="signal"] .a-signal-streak { opacity:1; }
  .a-canvas { position:relative; padding:6px 2px 2px;
    background-image:radial-gradient(color-mix(in srgb,currentColor 13%,transparent) 1px, transparent 1.2px); background-size:22px 22px; }
  .a-canvas::after { content:""; position:absolute; left:0; right:0; top:0; height:90px; pointer-events:none; z-index:2;
    background:linear-gradient(transparent, color-mix(in srgb,currentColor 5%,transparent), transparent); animation:a-scan 11s linear infinite; }
  .a-wires { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:0; }
  .a-row { position:relative; z-index:1; display:grid; gap:14px; margin-bottom:52px; }
  .a-row-edge, .a-row-data { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .a-row-data { margin-bottom:0; }
  .a-row-door { justify-items:center; }
  .a-door { width:min(600px,100%); text-align:center; }
  .a-door .a-title { justify-content:center; }
  .a-row-nodes { grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); align-items:start; }
  .a-card { position:relative; border:1px solid color-mix(in srgb,currentColor 26%,transparent); border-radius:6px; padding:12px 14px;
    background:color-mix(in srgb,var(--sg-bg) 90%,transparent); }
  /* Corner brackets: the one ornament, and it is only a frame. */
  .a-card::before { content:""; position:absolute; inset:-1px; border-radius:6px; pointer-events:none; opacity:.9;
    background:
      linear-gradient(currentColor,currentColor) top left/12px 1px no-repeat,
      linear-gradient(currentColor,currentColor) top left/1px 12px no-repeat,
      linear-gradient(currentColor,currentColor) bottom right/12px 1px no-repeat,
      linear-gradient(currentColor,currentColor) bottom right/1px 12px no-repeat; }
  .a-node { background:color-mix(in srgb,var(--sg-bg) 62%,transparent); }
  .a-vm { padding:9px 10px; background:color-mix(in srgb,var(--sg-bg) 94%,transparent); }
  .a-vm::before { display:none; }
  .a-off { opacity:.5; }
  .a-title { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; letter-spacing:.02em; }
  .a-node > .a-head .a-title, .a-door .a-title { font-size:17px; }
  .a-sub { font-size:11px; opacity:.72; margin-top:2px; }
  .a-spec { display:flex; flex-wrap:wrap; gap:3px 10px; font-size:10.5px; letter-spacing:.05em; opacity:.8; margin:8px 0 6px; }
  .a-bar { display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:8px; font:10px 'IBM Plex Mono',monospace; margin:3px 0; }
  .a-bar-label { opacity:.6; text-transform:uppercase; letter-spacing:.12em; }
  .a-bar-track { height:3px; position:relative; overflow:hidden; background:color-mix(in srgb,currentColor 14%,transparent); }
  .a-bar-track i { position:absolute; left:0; top:0; bottom:0; width:0; background:currentColor; transition:width 1.4s cubic-bezier(.2,.7,.2,1); }
  .a-bar-track i::after { content:""; position:absolute; inset:0; width:40%;
    background:linear-gradient(90deg, transparent, var(--sg-bg), transparent); opacity:.55; animation:a-sheen 3.2s ease-in-out infinite; }
  .a-bar-val { opacity:.85; min-width:70px; text-align:right; font-variant-numeric:tabular-nums; }
  .a-vms { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:8px; margin-top:12px; align-items:start; }
  .a-tenant { grid-column:1 / -1; border:1px dashed color-mix(in srgb,currentColor 32%,transparent); border-radius:5px; padding:8px; }
  .a-tenant-label { font-size:10px; letter-spacing:.2em; text-transform:uppercase; opacity:.65; margin-bottom:6px; }
  .a-tenant-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px; }
  .a-ctrs { margin-top:8px; display:flex; flex-direction:column; gap:5px; border-top:1px solid color-mix(in srgb,currentColor 14%,transparent); padding-top:7px; }
  .a-ctr-group { display:grid; grid-template-columns:58px 1fr; gap:6px; align-items:start; }
  .a-ctr-label { font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; padding-top:3px; }
  .a-ctr-chips, .a-chips { display:flex; flex-wrap:wrap; gap:4px; }
  .a-chips { margin-top:8px; }
  .a-chip { font:10.5px 'IBM Plex Mono',monospace; padding:2px 6px; border:1px solid color-mix(in srgb,currentColor 24%,transparent); border-radius:3px; white-space:nowrap; }
  .a-chip small { opacity:.55; font-size:9.5px; }
  /* Links: the hand cursor and a firmer frame on hover; titles keep a faint
     arrow so you can tell what opens before you point at it. */
  .a-chip-link { cursor:pointer; transition:border-color .2s, background-color .2s; }
  .a-chip-link:hover, .a-chip-link:focus-visible { border-color:currentColor; background:color-mix(in srgb,currentColor 12%,transparent); }
  .a-title-link { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .a-title-link .a-go { opacity:.3; transition:opacity .2s, transform .2s; }
  .a-title-link:hover .a-go, .a-title-link:focus-visible .a-go { opacity:1; transform:translate(1px,-1px); }
  .a-title-link:hover span { text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  a.a-line-link { display:flex; align-items:center; gap:4px; width:fit-content; cursor:pointer; }
  a.a-line-link .a-go { opacity:.3; }
  a.a-line-link:hover { opacity:1; text-decoration:underline; text-underline-offset:3px; }
  a.a-line-link:hover .a-go { opacity:1; }
  .a-chip-strong { border-color:currentColor; padding:4px 10px; font-size:11.5px; }
  .a-line { font-size:10.5px; opacity:.75; margin-top:4px; letter-spacing:.03em; }
  .a-flow { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; margin:12px 0 8px; }
  .a-arrow { opacity:.6; display:inline-block; animation:a-nudge 1.8s ease-in-out infinite; }
  .a-dot { width:6px; height:6px; border-radius:50%; border:1px solid currentColor; flex:none; position:relative; }
  .a-dot.on { background:currentColor; }
  .a-dot.on::after { content:""; position:absolute; inset:-4px; border-radius:50%; border:1px solid currentColor; opacity:0; animation:a-ping 2.6s ease-out infinite; }
  .a-foot { font-size:10px; opacity:.55; margin-top:8px; }
  .a-wire { fill:none; stroke:currentColor; stroke-width:1; }
  /* Four kinds of wire, told apart by shape, not by shade alone:
     internet = thick solid with glowing packets; private = dashes;
     backups = round dots; metrics = a faint line with a running streak. */
  .a-public { stroke-opacity:.95; stroke-width:2; }
  .a-tailnet { stroke-opacity:.7; stroke-width:1.1; stroke-dasharray:7 5; animation:a-flow 1.2s linear infinite; }
  .a-backup { stroke-opacity:.6; stroke-width:2.6; stroke-dasharray:0.1 7; stroke-linecap:round; animation:a-flow-dots 2.4s linear infinite; }
  .a-signal { stroke-opacity:.2; stroke-width:1; }
  .a-signal-streak { stroke-opacity:.95; stroke-width:1.5; stroke-linecap:round; stroke-dasharray:8 70; animation:a-streak 2.2s linear infinite; }
  .a-packet { fill:currentColor; }
  .a-p-public { filter:drop-shadow(0 0 3px currentColor); }
  .a-legend { display:flex; flex-wrap:wrap; gap:6px 22px; font-size:11px; }
  .a-key { display:inline-flex; align-items:center; gap:8px; cursor:help; opacity:.85; padding:2px 0; }
  .a-key:hover, .a-key:focus-visible { opacity:1; }
  .a-key svg { overflow:visible; }
  @keyframes a-flow { to { stroke-dashoffset:-24; } }
  @keyframes a-flow-dots { to { stroke-dashoffset:-14.2; } }
  @keyframes a-streak { from { stroke-dashoffset:78; } to { stroke-dashoffset:0; } }
  @keyframes a-ping { 0% { transform:scale(.6); opacity:.7; } 100% { transform:scale(2.3); opacity:0; } }
  @keyframes a-nudge { 50% { transform:translateX(3px); } }
  @keyframes a-sheen { 0% { transform:translateX(-120%); } 60%, 100% { transform:translateX(320%); } }
  @keyframes a-scan { 0% { transform:translateY(-90px); } 100% { transform:translateY(1600px); } }
  @media (prefers-reduced-motion: reduce) {
    .a-signal-streak { display:none; }
    .a-wire, .a-dot.on::after, .a-arrow, .a-canvas::after, .a-bar-track i::after { animation:none !important; }
    .a-bar-track i { transition:none; }
  }
  /* Narrow: one column, and the wires go, because they would only run
     through the cards stacked above their ends. */
  [data-sg-root].static .a-zoomctl { display:none; }
  @media (max-width:900px) {
    .a-zoomctl { display:none; }
    .a-row-edge, .a-row-data, .a-row-nodes { grid-template-columns:1fr !important; }
    .a-vms { grid-template-columns:1fr; }
    .a-wires { display:none; }
    .a-row { margin-bottom:14px; }
  }
  [hidden] { display:none !important; }
  @media (max-width:600px) {
    .row { flex-wrap:wrap; gap:8px 12px; }
    .row .name { flex-basis:45%; }
    .row .meta { font-size:11px; letter-spacing:0; }
    .row .access { margin-left:27px; order:5; width:100%; }
    .tabs { gap:20px; order:3; flex-basis:100%; }
  }
</style>
</head>
<body>
<div data-sg-root="1">
  <div class="scene" style="height:230vh;">
    <div class="stick" style="position:sticky; top:0; height:100vh; overflow:hidden;">
      <canvas data-sg-sky="1" style="position:absolute; inset:0; width:100%; height:100%; display:block;"></canvas>
      <div id="stage" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:clamp(14px,1.6vw,28px); pointer-events:none;">
        <div id="content" style="width:100%; display:flex; flex-direction:column; gap:clamp(10px,1.6vh,18px); filter:blur(calc((1 - var(--sg-flood)) * 3px)); transform:scaleY(calc(0.82 + var(--sg-flood) * 0.18));">
          <!-- One row on a desktop: wordmark, tabs, clock. On a phone the tabs
               wrap onto their own line under the wordmark. -->
          <div id="bar" style="opacity:calc((var(--sg-flood) - 0.02) * 9);">
            <span class="mono" id="brand" style="font-size:11px; letter-spacing:.34em;">AUTOLAB</span>
            <nav class="tabs" role="tablist" aria-label="Lab views">
              <button type="button" id="tab-services" role="tab" aria-controls="rows" aria-selected="true" data-tab="services">Services</button>
              <button type="button" id="tab-schedules" role="tab" aria-controls="rows" aria-selected="false" tabindex="-1" data-tab="schedules">Schedules</button>
              <button type="button" id="tab-architecture" role="tab" aria-controls="rows" aria-selected="false" tabindex="-1" data-tab="architecture">Architecture</button>
            </nav>
            <div id="clockbox" style="display:flex; align-items:center; gap:14px;">
              <span id="clock" class="mono" style="font-size:11px; letter-spacing:.2em; font-variant-numeric:tabular-nums;">--:--</span>
              <button id="flip" type="button" style="width:30px; height:30px; padding:0; display:grid; place-items:center; cursor:pointer; background:transparent; color:var(--sg-fg); border:1px solid var(--sg-fg); border-radius:999px;"></button>
            </div>
          </div>
          <div style="height:1px; background:var(--sg-fg); transform:scaleX(min(1, calc(var(--sg-flood) * 1.6))); opacity:calc(var(--sg-flood) * 4);"></div>
          <div id="rows" role="tabpanel" aria-labelledby="tab-services" tabindex="0" style="display:flex; flex-direction:column;"></div>
          <div id="feed" style="display:flex; flex-direction:column; gap:8px; opacity:calc((var(--sg-flood) - 0.66) * 8);"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="hint" id="hint">SCROLL</div>

<script>
(() => {
  const clamp = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  const ICONS = {
    hypervisor: 'M3 4.5h18v5H3zM3 14.5h18v5H3zM6.5 7h.01M6.5 17h.01',
    backup: 'M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z',
    metrics: 'M4 18V7M9 18v-6M14 18V4M19 18v-9',
    logs: 'M4 7h16M4 12h16M4 17h10',
    nas: 'M3 4.5h18v12H3zM8.5 20.5h7M12 16.5v4',
    tailnet: 'M3 12h4l2.5-6 3.5 12 2.5-6H21',
    repo: 'M7 8l-4 4 4 4M17 8l4 4-4 4M14 5l-4 14',
    guest: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
    tenant: 'M4 6h16v12H4zM9.5 10l5 2-5 2z',
    photos: 'M3 7h4l2-2.5h6L17 7h4v12H3zM12 10a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7'
  };

  const state = { dark: false, rows: [], feed: [], stale: false, tab: location.hash.slice(1) || "services", operations: {} };
  const root = document.querySelector('[data-sg-root]');
  const sky = document.querySelector('[data-sg-sky]');
  const stage = document.getElementById('stage');
  // Every load starts at the intro. Left to the browser, a reload lands
  // wherever the last visit stopped — the end of the dashboard.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  // Declared up here because load() may reach decideMode() before the
  // frame-state block below has run.
  let staticMode = false, introStart = 0;
  const INTRO_MS = 2400;
  const rowsEl = document.getElementById('rows');
  const feedEl = document.getElementById('feed');
  const hint = document.getElementById('hint');

  // ---- data --------------------------------------------------------------
  function render() {
    rowsEl.setAttribute('aria-labelledby', 'tab-' + state.tab);
    if (state.tab !== 'architecture') arch.sig = '';
    // The feed is the lab's news; it belongs with the services, not under
    // the schedule table or the diagram, where it only took their room.
    feedEl.hidden = state.tab !== 'services';
    document.querySelectorAll('[data-tab]').forEach(b => {
      const selected = b.dataset.tab === state.tab;
      b.setAttribute('aria-selected', String(selected));
      b.tabIndex = selected ? 0 : -1;
    });
    if (state.tab === 'schedules') { renderSchedules(); renderFeed(); return; }
    if (state.tab === 'architecture') { renderArchitecture(); renderFeed(); return; }
    const out = [];
    const legend = el('p', 'Public links work outside Tailscale. Internal links require Tailscale; their login protection is shown on each row.', 'ops muted');
    out.push(legend);
    let group = null, box = null;
    state.rows.forEach((r, i) => {
      if (!box || (r.group && r.group !== group)) {
        group = r.group;
        const h = document.createElement('div');
        h.className = 'head';
        h.innerHTML = '<span></span>';
        h.firstChild.textContent = group || '';
        h.style.opacity = `calc((var(--sg-flood) - ${(0.04 + i * (0.5 / Math.max(1, state.rows.length - 1))).toFixed(3)}) * 9)`;
        box = document.createElement('div');
        box.className = 'group-rows';
        out.push(h, box);
      }
      box.append(row(r, i));
    });
    rowsEl.replaceChildren(...out);
    renderFeed();
  }

  function row(r, i) {
      const a = document.createElement('a');
      a.className = 'row';
      a.href = r.url || '#';
      if (r.url && /^https?:/.test(r.url)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      // The reveal is staggered per row, so the stagger has to fit the list.
      // At a flat 0.05 the last row of a seventeen-row list starts at 0.84,
      // which leaves its underline at (1 - 0.84) * 3 = 48% of the width for
      // good, and a list past twenty rows would have never fully appeared at
      // all. Spread the same half of the range across however many rows
      // there are, so the last one still completes.
      const step = 0.5 / Math.max(1, state.rows.length - 1);
      const d = (0.04 + i * step).toFixed(3);
      // The entry offset alternates left and right and grows with the row, to
      // a point: unbounded, a long list would start its last rows off-screen.
      const x = (i % 2 ? -1 : 1) * (26 + Math.min(i, 10) * 5);
      const op = r.up ? 1 : .75;
      a.style.opacity = `calc((var(--sg-flood) - ${d}) * 9)`;
      a.style.transform = `translateX(calc((1 - var(--sg-flood)) * ${x}px))`;
      a.innerHTML =
        `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" style="opacity:${op}; stroke-dashoffset:calc((1 - var(--sg-flood)) * 90);"><path d="${ICONS[r.icon] || ICONS.guest}"></path></svg>` +
        `<span class="name" data-final="" style="opacity:${op};"></span>` +
        `<span class="meta"></span><span class="access"></span>` +
        `<span class="dot" style="background:${r.up ? 'currentColor' : 'transparent'};"></span>` +
        `<span class="line" style="transform:scaleX(min(1, calc((var(--sg-flood) - ${d}) * 3)));"></span>`;
      a.querySelector('.name').setAttribute('data-final', r.name);
      a.querySelector('.name').textContent = r.name;
      a.querySelector('.meta').textContent = r.meta || '';
      a.querySelector('.access').textContent = r.access || 'Access not reported';
      a.querySelector('.dot').title = r.up ? 'Reachable' : 'Not reachable';
      return a;
  }

  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function section(title, copy) {
    const box = el('section', undefined, 'ops');
    box.append(el('h2', title), el('p', copy, 'muted'));
    return box;
  }
  function scheduleLabel(value) {
    const schedule = String(value || 'Unknown');
    if (/^\d{2}:\d{2}$/.test(schedule)) return 'Daily at ' + schedule;
    if (schedule === 'daily') return 'Daily at 00:00';
    if (schedule === '*-*-* 06:00:00') return 'Daily at 06:00';
    if (schedule === '*-*-* 00/6:17:00') return '00:17, 06:17, 12:17, 18:17';
    if (schedule === '0 8 * * *') return 'Daily at 08:00';
    if (schedule === 'sat 04:00') return 'Saturday at 04:00';
    return schedule;
  }
  function renderSchedules() {
    const op = state.operations;
    const box = section('Schedules & notifications', 'Backup schedules come from each node. PBS jobs come from the server. Times below name the host timezone; the next backup is also shown in your browser timezone.');
    if (!(op.schedules || []).length) {
      box.append(el('p', 'Schedule data is unavailable. The collector refreshes every minute.'));
    } else {
      const scroll = el('div', undefined, 'table-scroll');
      const table = el('table');
      const head = el('tr');
      ['Job / host', 'Schedule / timezone', 'Next / status'].forEach(v => head.append(el('th', v)));
      const thead = el('thead'); thead.append(head); table.append(thead);
      const tbody = el('tbody');
      op.schedules.forEach(job => {
        const tr = el('tr');
        const name = el('td', job.name); name.append(el('small', job.host));
        const schedule = el('td', scheduleLabel(job.schedule)); schedule.append(el('small', job.timezone));
        const status = el('td', !job.enabled ? 'Disabled' : job.next ? new Date(job.next * 1000).toLocaleString([], {dateStyle:'short', timeStyle:'short'}) : 'Enabled');
        status.append(el('small', job.details));
        tr.append(name, schedule, status); tbody.append(tr);
      });
      table.append(tbody); scroll.append(table); box.append(scroll);
    }
    box.append(el('h3', 'When a notification arrives'));
    box.append(el('p', `Backup age is measured from the snapshot timestamp, not when the job finishes. The limit is ${op.backup_max_age_hours || 26} hours, followed by a 30-minute pending period. A failed nightly can therefore leave the alert firing until a new backup succeeds.`, 'muted'));
    box.append(el('p', 'Grafana evaluates rules every minute. New groups wait 30 seconds; changed groups wait 5 minutes. Critical alerts repeat hourly, warnings every 6 hours, and update reminders every 4 days. Recovery messages use the same grouping policy.', 'muted'));
    (op.alerts || []).forEach(rule => {
      const details = el('details');
      details.append(el('summary', `${rule.name} · ${rule.severity} · pending ${rule.pending} · repeats ${rule.repeat}`));
      const friendly = text => String(text || '').replace(/\{\{[^}]*\}\}/g, token => token.includes('$labels.name') ? 'guest' : token.includes('$labels.instance') ? 'host' : token.includes('$value') ? 'measured value' : '');
      const description = rule.description.includes('$labels.platform')
        ? 'For VMs, use workflow 05 with the updates or reboot playbook. For nodes, use workflow 07. Package updates and reboots are separate actions.'
        : friendly(rule.description);
      details.append(el('p', friendly(rule.summary)), el('p', description));
      if (rule.evaluator) {
        const operators = {gt:'>', lt:'<', within_range:'within range', outside_range:'outside range'};
        details.append(el('p', 'Trigger: query result ' + (operators[rule.evaluator.type] || rule.evaluator.type) + ' ' + rule.evaluator.params.join(', ') + ' for ' + rule.pending + '.'));
      }
      const query = el('p'); query.append(el('code', rule.query)); details.append(query);
      box.append(details);
    });
    if ((op.errors || []).length) box.append(el('p', 'Some live sources could not be read: ' + op.errors.join('; ')));
    rowsEl.replaceChildren(box);
  }
  // ---- architecture -------------------------------------------------------
  // The lab as it is right now: hardware and placement from Proxmox, load
  // from node_exporter and cAdvisor, reachability from the probes. Cards are
  // HTML; the wires between them are one SVG measured off the cards, so the
  // layout stays responsive. The structure is rebuilt only when the shape of
  // the lab changes (a guest, a container, the toggle); every 30-second
  // refresh otherwise just rewrites the numbers, so the wires keep flowing.
  const ROLES = {
    sputnik: 'disposable probe · pipeline canary',
    jwst: 'observability + services',
    ark: 'Proxmox Backup Server',
    horizon: 'ingress · tunnel · Traefik · Pocket ID',
    magnetosphere: 'edge DNS · Pi-hole',
  };
  const arch = { sig: '', showAll: false, wired: null };
  const gib = b => (b || 0) / 1073741824;
  const pct = v => Math.max(0, Math.min(100, (v || 0) * 100));
  const fmtG = b => gib(b) >= 10 ? gib(b).toFixed(0) : gib(b).toFixed(1);
  const fmtM = b => (b || 0) >= 1073741824 ? gib(b).toFixed(1) + 'G' : Math.round((b || 0) / 1048576) + 'M';
  const fmtUp = s => !s ? '—' : s >= 86400 ? Math.floor(s / 86400) + 'd' : s >= 3600 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 60) + 'm';
  const tagsOf = g => String(g.tags || '').split(';').map(t => t.trim()).filter(Boolean);
  const ctrName = n => n.replace(/^(observability|services|ingress|cadvisor)-/, '').replace(/-\d+$/, '');
  const ctrGroup = n => (n.match(/^(observability|services|ingress)-/) || [, 'host'])[1];

  function archModel() {
    const op = state.operations;
    const tel = op.telemetry || { hosts: [], containers: [] };
    const hosts = Object.fromEntries((tel.hosts || []).map(h => [h.name, h]));
    const ctrs = {};
    (tel.containers || []).forEach(c => (ctrs[c.host] = ctrs[c.host] || []).push(c));
    const rowBy = name => state.rows.find(r => r.name === name);
    const temps = {};
    state.rows.forEach(r => { const m = /^(\S+) · (\d+)°C/.exec(r.meta || ''); if (r.name === 'Proxmox VE' && m) temps[m[1]] = +m[2]; });
    const labNames = [], publicNames = [];
    state.rows.forEach(r => {
      let host = ''; try { host = new URL(r.url).hostname; } catch (e) { return; }
      if (/\.lab\./.test(host)) labNames.push(host.split('.')[0]);
      else if (/^Public/.test(r.access || '')) publicNames.push(host.split('.')[0]);
    });
    const nodes = (op.nodes || []).map(n => {
      const all = n.guests || [];
      const mine = all.filter(g => !g.template && tagsOf(g).includes('autolab'));
      const shown = arch.showAll ? all : mine;
      return { ...n, own: shown.filter(g => !tagsOf(g).some(t => t.startsWith('tenant-'))),
               tenants: shown.filter(g => tagsOf(g).some(t => t.startsWith('tenant-'))),
               hidden: all.length - shown.length, extra: all.length - mine.length, temp: temps[n.name], host: hosts[n.name] };
    });
    // The page itself and the shared-link proxy are public names with no row.
    publicNames.unshift('home');
    if ((op.services || []).includes('immich-share')) publicNames.push('share');
    // Where everything opens, from the rows' own links so nothing here names
    // a domain: by row name (machines, Loki), by node name (Proxmox rows), and
    // by a hostname's first label (grafana, pbs, dockhand, ...).
    const byName = {}, byLabel = {};
    let zone = '';
    state.rows.forEach(r => {
      let host = ''; try { host = new URL(r.url).hostname; } catch (e) { return; }
      if (!byName[r.name]) byName[r.name] = r.url;
      if (r.name === 'Proxmox VE') byName[(r.meta || '').split(' ')[0]] = r.url;
      const label = host.split('.')[0];
      if (!byLabel[label]) byLabel[label] = r.url;
      const at = host.indexOf('.lab.');
      if (at > 0 && !zone) zone = host.slice(at + 5);
    });
    const labUrl = label => byLabel[label] || (zone ? `https://${label}.lab.${zone}` : '');
    const pubUrl = label => byLabel[label] || (zone ? `https://${label}.${zone}` : '');
    // A container opens the app it serves; one with nothing to open stays text.
    const CTR_APPS = { grafana: () => byName.Grafana, loki: () => byName.Loki, prometheus: () => labUrl('prometheus'),
      homepage: () => pubUrl('home'), 'code-server': () => labUrl('code-server'), dockhand: () => labUrl('dockhand'),
      registry: () => labUrl('registry-ui'), 'registry-ui': () => labUrl('registry-ui'), dash: () => labUrl('dash'),
      qr: () => labUrl('qr'), cosmos: () => labUrl('cosmos'), pihole: () => byName['Pi-hole'], 'pocket-id': () => pubUrl('auth') };
    const link = { byName, labUrl, pubUrl, ctr: name => (CTR_APPS[name] || (() => ''))() || '' };
    return { op, nodes, hosts, ctrs, rowBy, link, labNames: [...new Set(labNames)], publicNames: [...new Set(publicNames)] };
  }

  function archSignature(m) {
    return JSON.stringify([arch.showAll, m.nodes.map(n => [n.name, n.available, !!n.hardware, n.own.map(g => g.name + g.status), n.tenants.map(g => g.name + g.status)]),
      Object.entries(m.ctrs).map(([h, cs]) => [h, cs.map(c => c.name)]), m.labNames, m.publicNames]);
  }

  // One small helper per kind of thing on the page. `live` marks a node whose
  // text or width is rewritten on refresh without rebuilding anything.
  function mk(tag, cls, text) { return el(tag, text, cls); }
  function live(e, key) { e.dataset.live = key; return e; }
  function bar(key, label) {
    const wrap = mk('div', 'a-bar'); wrap.append(mk('span', 'a-bar-label', label));
    const track = mk('span', 'a-bar-track'); const fill = live(mk('i'), key + ':w'); track.append(fill);
    wrap.append(track, live(mk('span', 'a-bar-val'), key + ':t')); return wrap;
  }
  function dot(key) { return live(mk('span', 'a-dot'), key + ':dot'); }
  // Anything with somewhere to go is a real link: a new tab, like the rows.
  // The cursor says so, and titles carry a faint arrow that firms up on hover.
  const ARROW = '<svg class="a-go" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 2h5v5M8 2L2 8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
  function anchor(url, cls, text) {
    const a = mk('a', cls, text); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a;
  }
  function chip(text, cls, url) {
    const c = 'a-chip' + (cls ? ' ' + cls : '');
    if (!url) return mk('span', c, text);
    const a = anchor(url, c + ' a-chip-link', text); a.title = 'Open ' + url.replace(/^https?:\/\//, ''); return a;
  }
  function lineOf(item) {
    if (Array.isArray(item) && item[1]) { const a = anchor(item[1], 'a-line mono a-line-link', item[0]); a.insertAdjacentHTML('beforeend', ' ' + ARROW); return a; }
    return mk('div', 'a-line mono', Array.isArray(item) ? item[0] : item);
  }
  function card(cls, wire) { const c = mk('div', 'a-card ' + (cls || '')); if (wire) c.dataset.wire = wire; return c; }
  function cardHead(title, sub, key, url) {
    const head = mk('div', 'a-head');
    const t = mk('div', 'a-title'); if (key) t.append(dot(key));
    const name = mk('span', undefined, title); name.dataset.final = title;
    if (url) {
      const a = anchor(url, 'a-title-link'); a.title = 'Open ' + url.replace(/^https?:\/\//, '').replace(/\/$/, '');
      a.append(name); a.insertAdjacentHTML('beforeend', ARROW); t.append(a);
    } else t.append(name);
    head.append(t); if (sub) head.append(mk('div', 'a-sub', sub)); return head;
  }

  function vmCard(g, m) {
    const c = card('a-vm' + (g.status === 'running' ? '' : ' a-off'), 'vm-' + g.name);
    const key = 'vm-' + g.name;
    c.append(cardHead(g.name, ROLES[g.name] || (tagsOf(g).find(t => t.startsWith('tenant-')) || tagsOf(g).join(' · ') || 'unmanaged').replace('tenant-', 'tenant · '), key, m.link.byName[g.name]));
    const spec = mk('div', 'a-spec mono');
    spec.append(mk('span', undefined, `${g.type || 'qemu'} ${g.vmid}`), mk('span', undefined, `${g.maxcpu || '?'} vCPU`), mk('span', undefined, `${fmtG(g.maxmem)} GiB`), live(mk('span'), key + ':up'));
    c.append(spec);
    if (g.status === 'running') c.append(bar(key + '-cpu', 'cpu'), bar(key + '-mem', 'mem'));
    const ctrs = m.ctrs[g.name] || [];
    if (ctrs.length) {
      const groups = {};
      ctrs.forEach(x => (groups[ctrGroup(x.name)] = groups[ctrGroup(x.name)] || []).push(x));
      const box = mk('div', 'a-ctrs');
      Object.entries(groups).forEach(([group, list]) => {
        const row = mk('div', 'a-ctr-group');
        row.append(mk('span', 'a-ctr-label mono', { host: 'agents', observability: 'stack', services: 'apps', ingress: 'ingress' }[group] || group));
        const chips = mk('div', 'a-ctr-chips');
        list.forEach(x => { const ch = chip(ctrName(x.name), '', m.link.ctr(ctrName(x.name))); ch.append(live(mk('small'), 'ctr-' + g.name + '-' + x.name)); chips.append(ch); });
        row.append(chips); box.append(row);
      });
      c.append(box);
    }
    return c;
  }

  function nodeCard(n, m) {
    const c = card('a-node', 'node-' + n.name);
    const hw = n.hardware || {};
    c.append(cardHead(n.name, n.available ? (hw.model ? hw.model.replace(/\(R\)|\(TM\)|CPU|@.*$/g, '').replace(/\s+/g, ' ').trim() : 'Proxmox VE') : 'node unavailable', 'node-' + n.name, m.link.byName[n.name]));
    const spec = mk('div', 'a-spec mono');
    spec.append(mk('span', undefined, `${hw.cpus || (n.host && n.host.cores) || '?'} threads`), mk('span', undefined, `${fmtG(hw.memory_total || (n.host && n.host.mem_total))} GiB`),
      live(mk('span'), 'node-' + n.name + ':temp'), live(mk('span'), 'node-' + n.name + ':up'));
    c.append(spec, bar('node-' + n.name + '-cpu', 'cpu'), bar('node-' + n.name + '-mem', 'mem'), bar('node-' + n.name + '-alloc', 'alloc'));
    const vms = mk('div', 'a-vms');
    n.own.forEach(g => vms.append(vmCard(g, m)));
    if (n.tenants.length) {
      const t = mk('div', 'a-tenant');
      t.append(mk('div', 'a-tenant-label mono', 'tenant · ' + (tagsOf(n.tenants[0]).find(x => x.startsWith('tenant-')) || 'tenant-').slice(7) + ' · own tailnet'));
      const grid = mk('div', 'a-tenant-grid');
      n.tenants.forEach(g => grid.append(vmCard(g, m)));
      t.append(grid); vms.append(t);
    }
    if (!n.own.length && !n.tenants.length) vms.append(mk('div', 'a-sub', 'No guests shown.'));
    c.append(vms);
    if (n.hidden) c.append(mk('div', 'a-foot mono', `+${n.hidden} templates / unmanaged`));
    return c;
  }

  // lines: text, or [text, url]; chips: text, or [text, url].
  function edgeCard(wire, title, sub, key, lines, chips, url) {
    const c = card('a-edge', wire);
    c.append(cardHead(title, sub, key, url));
    if (lines) lines.forEach(l => c.append(lineOf(l)));
    if (chips && chips.length) { const box = mk('div', 'a-chips'); chips.forEach(x => box.append(Array.isArray(x) ? chip(x[0], '', x[1]) : chip(x))); c.append(box); }
    return c;
  }

  function buildArchitecture(m) {
    const root = mk('div', 'arch');
    const bar = mk('div', 'a-toolbar');
    const intro = mk('div', 'a-intro ops');
    intro.append(mk('p', 'muted a-live mono', 'LIVE · every 30 s'));
    intro.title = 'Placement and hardware from Proxmox, load from node_exporter and cAdvisor, health from the homepage probes';
    const tools = mk('div', 'a-tools');
    // VM templates and guests AUTOLAB does not manage (the stopped q360 VMs on
    // pve, say) are left off by default. The button names how many.
    const extra = m.nodes.reduce((a, n) => a + n.extra, 0);
    const controls = mk('button', 'a-pill mono', `${arch.showAll ? 'Hide' : 'Show'} ${extra} hidden VM${extra === 1 ? '' : 's'}`);
    controls.type = 'button'; controls.setAttribute('aria-pressed', String(arch.showAll)); controls.hidden = !extra;
    controls.title = 'VM templates and guests AUTOLAB does not manage, such as stopped VMs from other projects';
    controls.addEventListener('click', () => { arch.showAll = !arch.showAll; arch.sig = ''; renderArchitecture(); });
    const zoomBox = mk('div', 'a-zoomctl mono');
    const btn = (label, title, fn) => { const b = mk('button', undefined, label); b.type = 'button'; b.title = title; b.setAttribute('aria-label', title); b.addEventListener('click', fn); return b; };
    zoomBox.append(
      btn('−', 'Zoom out', () => zoomBy(1 / 1.2)),
      live(mk('span', 'a-zoomval'), 'zoom'),
      btn('+', 'Zoom in', () => zoomBy(1.2)),
      btn('Fit', 'Fit to the window: the layout reshapes to fill it', () => setZoomMode('fit')),
      btn('1:1', 'Actual size', () => setZoomMode('manual', 1)));
    tools.append(controls, zoomBox);
    root.append(bar);

    // The legend draws each kind of wire with the wire's own classes, so it
    // is the same line, moving the same way. Hovering one picks out those
    // wires on the diagram.
    const legend = mk('div', 'a-legend mono');
    [['public', 'Internet → tunnel', 'Someone outside your network: Cloudflare carries it down the tunnel to horizon'],
     ['tailnet', 'Private network (Tailscale)', 'Your devices and the lab talking over encrypted WireGuard; invisible to the internet'],
     ['backup', 'Nightly backups', 'Each node backs its VMs up to PBS around 02:00; PBS keeps them on the NAS'],
     ['signal', 'Metrics & logs', 'Alloy on every host sends metrics and logs to jwst, which feeds Grafana and the alerts']].forEach(([k, label, hint]) => {
      const item = mk('span', 'a-key'); item.dataset.kind = k; item.title = hint; item.tabIndex = 0;

  // ---- zoom and pan --------------------------------------------------------
  // On a desktop the diagram is laid out once at a fixed design width and

  // ---- the original's motion, verbatim in spirit -------------------------
  const S = { recon: 0, off: { x: 0, y: 0 }, drag: null, parts: null, noise: null, spin: 0 };
  let px = { p: 0, enter: 0, glitch: 0, flood: 0, bg: '#FFF', fg: '#000' };
  let scrambleDone = -1, pointerOn = false, _t = 0, _pt = 0, dpr = 1, w = 1, h = 1;

  const toRGB = (hex) => { const n = String(hex).replace('#', ''); const v = n.length === 3 ? n.split('').map(x => x + x).join('') : n; const num = parseInt(v, 16) || 0; return [(num >> 16) & 255, (num >> 8) & 255, num & 255]; };
  const mix = (a, b, t) => { const A = toRGB(a), B = toRGB(b); return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')'; };
  const rgba = (col, a) => { const al = Math.max(0, Math.min(1, a)).toFixed(3); const m = String(col).match(/rgb\((\d+),(\d+),(\d+)\)/); if (m) return 'rgba(' + m[1] + ',' + m[2] + ',' + m[3] + ',' + al + ')'; const c = toRGB(col); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + al + ')'; };

  // A phone, a request for less motion, or a list that no longer fits: the
  // scene becomes a plain scrolling document. Re-decided on resize and
  // whenever the rows are rebuilt, because the list grows with the lab.
  const lessMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  function decideMode() {
    const want = window.innerWidth <= 820 || lessMotion.matches;
    if (want !== staticMode) {
      staticMode = want;
      root.classList.toggle('static', want);
      // Entering: the scene has a clock to run against. Leaving: scroll takes
      // over again from wherever the page happens to be.
      if (want) introStart = performance.now();
    }
    return staticMode;
  }

  // A list taller than the screen scrolls inside itself rather than making
  // the page longer: the dashboard arrives at its top, and the page's scroll
  // stays the intro's alone. Its height is whatever the screen leaves after
  // the header and feed, kept current every frame so a resize or a longer
  // list just works.
  function fitRows() {
    const content = stage.firstElementChild;
    if (!content) return;
    const cs = getComputedStyle(stage);
    const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const others = content.offsetHeight - rowsEl.offsetHeight;
    const room = Math.max(160, Math.floor(window.innerHeight - pad - others));
    if (rowsEl.style.maxHeight !== room + 'px') rowsEl.style.maxHeight = room + 'px';
    if (state.tab === 'architecture') sizeZoom(room);
  }
  function unfitRows() {
    if (state.tab === 'architecture') sizeZoom(0);
    if (rowsEl.style.maxHeight) rowsEl.style.maxHeight = '';
  }

  function frame() {
    const doc = document.documentElement;
    // Scroll drives the scene when there is room to scroll through it. When
    // the page has become a document — a phone, or a list taller than the
    // screen — the same scene plays on a clock instead, once, and then stays
    // arrived while the reader scrolls the list underneath it.
    let p;
    if (staticMode) {
      p = clamp((performance.now() - introStart) / INTRO_MS);
      unfitRows();
    } else {
      const max = Math.max(1, doc.scrollHeight - window.innerHeight);
      p = clamp((window.scrollY || doc.scrollTop) / max);
      fitRows();
    }
    const enter = clamp(p / 0.82);
    const glitch = clamp((p - 0.82) / 0.16);
    const now = performance.now();
    const dt = Math.min(0.06, Math.max(0, (now - (_t || now)) / 1000));
    _t = now;
    const target = glitch >= 1 ? 1 : 0;
    const rate = target ? dt / 1.9 : -dt / 1.1;
    S.recon = clamp(S.recon + rate);
    const flood = S.recon;
    const paper = state.dark ? '#08080A' : '#FFFFFF';
    const ink = state.dark ? '#F4F4F5' : '#0A0A0A';
    const u = clamp((p - 0.86) / 0.06), sm = u * u * (3 - 2 * u);
    px = { p, enter, glitch, flood, bg: mix(paper, ink, sm), fg: mix(ink, paper, sm) };
    root.style.setProperty('--sg-p', p.toFixed(4));
    root.style.setProperty('--sg-enter', enter.toFixed(4));
    root.style.setProperty('--sg-glitch', glitch.toFixed(4));
    root.style.setProperty('--sg-flood', flood.toFixed(4));
    root.style.setProperty('--sg-bg', px.bg);
    root.style.setProperty('--sg-fg', px.fg);
    document.body.style.background = px.bg;
    const want = flood > 0.5;
    if (want !== pointerOn) { pointerOn = want; stage.style.pointerEvents = want ? 'auto' : 'none'; }
    hint.style.opacity = (!staticMode && p < 0.05) ? '.35' : '0';
  }

  function size() {
    decideMode();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = sky.getBoundingClientRect();
    const W = Math.max(1, Math.round(r.width * dpr)), H = Math.max(1, Math.round(r.height * dpr));
    if (sky.width !== W || sky.height !== H) { sky.width = W; sky.height = H; }
    w = r.width; h = r.height;
  }

  function seedParts() {
    S.parts = [];
    for (let k = 0; k < 520; k++) { const u = Math.pow(Math.random(), .8); S.parts.push({ r: 1.08 + u * 2.5, a: Math.random() * 6.2832, b: .35 + Math.random() * .65, t: Math.random() * .9 + .3 }); }
    S.noise = [];
    for (let k = 0; k < 80; k++) S.noise.push({ y: Math.random(), h: Math.random() * .05 + .004, o: Math.random() - .5, s: Math.random() });
  }

  function arc(ctx, cx, cy, s, tilt, fg) {
    ctx.strokeStyle = rgba(fg, s[3]); ctx.lineWidth = .6 + s[4] * 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, s[0], s[0] * tilt, 0, s[1], s[1] + s[2]); ctx.stroke();
  }

  function paint(T) {
    size();
    if (!S.parts) seedParts();
    const ctx = sky.getContext('2d'); if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const fg = px.fg, bg = px.bg, off = S.off;
    const cx = w * .5 + off.x * .85, cy = h * .5 + off.y * .5;
    const enter = px.enter, glitch = px.glitch, flood = px.flood;
    if (flood > 0.02) {
      const hr = Math.max(w, h) * (.5 + .08 * Math.sin(T * .5));
      const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
      hg.addColorStop(0, rgba(fg, .05 * flood)); hg.addColorStop(.55, rgba(fg, .015 * flood)); hg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hg; ctx.fillRect(0, 0, w, h);
    }
    if (glitch > 0.001 && glitch < 0.999) {
      const g = Math.sin(Math.PI * glitch);
      for (let k = 0; k < S.noise.length; k++) {
        const n = S.noise[k]; const y = ((n.y + T * .4 * n.s) % 1) * h; const bh = n.h * h * (0.4 + g);
        const dx = n.o * w * .7 * g * (Math.sin(T * 40 + k) > .2 ? 1 : .2);
        ctx.fillStyle = rgba(fg, .12 + .5 * g * n.s); ctx.fillRect(dx, y, w * (.25 + n.s * .75), Math.max(1, bh * .3));
      }
      for (let k = 0; k < 160; k++) {
        const x = (Math.sin(k * 12.9898 + T * 9) * .5 + .5) * w, y = (Math.sin(k * 78.233 + T * 7) * .5 + .5) * h;
        ctx.fillStyle = rgba(fg, .5 * g); ctx.fillRect(x, y, 2 + (k % 5), 2);
      }
      ctx.fillStyle = rgba(fg, .1 * g); ctx.fillRect(0, 0, w, h);
    }
    const fade = 1 - glitch;
    if (fade <= 0.002) return;
    const base = Math.min(w, h) * .14;
    const R = base * (1 + enter * enter * 6.5);
    const tilt = Math.max(.04, Math.min(.8, .19 + enter * .1 + (off.y / h) * .9));
    const stretch = 1 + enter * enter * 14;
    const breathe = 1 + .02 * Math.sin(T * .7);
    const dtp = Math.min(0.05, Math.max(0, T - (_pt || T))); _pt = T;
    S.spin += dtp * (.55 + enter * 3.4);
    const hr = R * 3.4 * breathe;
    const halo = ctx.createRadialGradient(cx, cy, R * .85, cx, cy, hr);
    halo.addColorStop(0, rgba(fg, .1 * fade)); halo.addColorStop(.18, rgba(fg, .05 * fade)); halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, hr, 0, 6.2832); ctx.fill();
    const lensFade = fade * (1 - enter * .85);
    if (lensFade > .004) {
      const lensR = Math.min(R, Math.min(w, h) * .55);
      for (let k = 0; k < 22; k++) {
        const u = k / 22; ctx.strokeStyle = rgba(fg, (.085 - u * .075) * lensFade); ctx.lineWidth = 1 + (1 - u) * 1.4;
        ctx.beginPath(); ctx.ellipse(cx, cy, lensR * (1.06 + u * .5), lensR * (1.42 + u * .85) * (1 + .012 * Math.sin(T * 1.2 + k)), 0, 0, 6.2832); ctx.stroke();
      }
    }
    const front = [];
    for (let k = 0; k < S.parts.length; k++) {
      const p = S.parts[k]; const rad = R * p.r * (1 - enter * .18); const spd = .9 / Math.pow(p.r, 1.4); const ang = p.a + S.spin * spd;
      const dA = (.03 + p.t * .09) * (1 + stretch * .5) / p.r; const dop = Math.cos(ang) < 0 ? 1.7 : .5;
      const alpha = .1 * p.b * dop * fade * (1 + enter * .5); const seg = [rad, ang, dA, alpha, p.t];
      if (Math.sin(ang) > 0) front.push(seg); else arc(ctx, cx, cy, seg, tilt, fg);
    }
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, R * .995, 0, 6.2832); ctx.fill();
    const shimmer = .45 + .18 * Math.sin(T * 2.1) + .1 * Math.sin(T * 5.3);
    ctx.strokeStyle = rgba(fg, shimmer * fade); ctx.lineWidth = 1.2 + .5 * Math.sin(T * 1.7);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.008, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = rgba(fg, .12 * fade); ctx.lineWidth = 6 + 3 * Math.sin(T * .9);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.05, 0, 6.2832); ctx.stroke();
    for (let k = 0; k < front.length; k++) arc(ctx, cx, cy, front[k], tilt, fg);
  }

  function scramble(T) {
    const r = S.recon;
    if (r <= 0 || scrambleDone === r) return;
    const nodes = root.querySelectorAll('[data-final]');
    const GL = '01<>[]{}/\\|=+*#%$&';
    // The stagger has to fit the list, not a fixed count. At a flat 0.045 a
    // reveal only ever reached node 13: every row after that stayed
    // scrambled for good, and the lab grew past that without anyone
    // noticing. Spread the same 0.6 of the range across however many nodes
    // exist, so the last one still lands exactly at 1.
    const step = 0.6 / Math.max(1, nodes.length - 1);
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i], fin = n.getAttribute('data-final') || '';
      const local = clamp((r - i * step) / 0.4);
      if (local >= 1) { if (n.textContent !== fin) n.textContent = fin; continue; }
      const keep = Math.floor(fin.length * local);
      let out = fin.slice(0, keep);
      for (let k = keep; k < fin.length; k++) out += fin[k] === ' ' ? ' ' : GL[Math.floor((Math.sin(k * 91.7 + i * 13.3 + T * 22) * .5 + .5) * GL.length) % GL.length];
      n.textContent = out;
    }
    if (r >= 1) scrambleDone = r;
  }

  // drag the hole
  root.style.cursor = 'grab';
  root.addEventListener('contextmenu', (e) => e.preventDefault());
  root.addEventListener('pointerdown', (e) => {
    if (e.target.closest && e.target.closest('a,button,input,label,summary,.ops,.arch')) return;
    e.preventDefault(); S.drag = { x: e.clientX, y: e.clientY }; root.style.cursor = 'grabbing';
    try { root.setPointerCapture(e.pointerId); } catch (err) {}
  });
  window.addEventListener('pointermove', (e) => {
    const d = S.drag; if (!d) return;
    const lx = window.innerWidth * .45, ly = window.innerHeight * .45, o = S.off;
    o.x = Math.max(-lx, Math.min(lx, o.x + (e.clientX - d.x))); o.y = Math.max(-ly, Math.min(ly, o.y + (e.clientY - d.y)));
    S.drag = { x: e.clientX, y: e.clientY };
  });
  const end = () => { S.drag = null; root.style.cursor = 'grab'; };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);

  const loop = (t) => { requestAnimationFrame(loop); try { frame(); paint(t / 1000); scramble(t / 1000); } catch (e) {} };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
