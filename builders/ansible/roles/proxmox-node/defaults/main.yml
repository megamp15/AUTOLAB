---
# Proxmox ships without sudo. The account roles add operators to the `sudo`
# group, so the group has to exist before they run or user creation fails on a
# group that is not there.
autolab_proxmox_base_packages:
  - sudo

# Backup targets this node sends to. Each becomes a `pbs` storage entry with
# a client-side encryption key generated on first add, so what lands on the
# NAS and offsite is ciphertext. The fingerprint is read from the server
# itself over the bridge and pinned — trust on first configure, on a private
# network, like copying it from the PBS UI. `username` and the password
# (`autolab_pve_pbs_password`, GitHub secret PBS_PVE_PASSWORD) are the
# account the pbs role creates.
autolab_pve_pbs_storages: []
autolab_pve_pbs_password: ""

# vzdump jobs. `enabled: false` until the encryption key for the storage is
# somewhere other than this node — a backup nobody can decrypt is a file.
# `exclude` is for templates, which vzdump would otherwise archive nightly.
autolab_pve_backup_jobs: []

# A node whose uplink is Wi-Fi names the interface here; empty means wired
# and nothing below applies. Power saving on the radio lets the card sleep
# between beacons, and a server's card should never sleep: on xps-pve's
# Qualcomm ath10k it was on by default, and the node went through spells of
# staying associated while passing no traffic. `iw` turns it off at boot.
autolab_pve_wifi_interface: ""
