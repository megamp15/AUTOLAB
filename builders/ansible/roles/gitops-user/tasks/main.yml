---
- name: Create the GitOps automation user
  ansible.builtin.user:
    name: "{{ autolab_gitops_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Permit GitOps sudo without a password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ autolab_gitops_user }}"
    content: "{{ autolab_gitops_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

# exclusive=true makes the declared list the whole file. An empty list is not
# "leave it alone" — it means nothing is trusted, so the file goes away and a
# key that was once installed cannot outlive its removal from the list.
#
# path is given explicitly for check mode on a brand-new host: the account
# above is only simulated there, so the module cannot look its home up and
# fails with "Either user must exist or you must provide full path". The first
# tenant bootstrap died on exactly that.
- name: Install the Builder's public keys for the GitOps user
  ansible.posix.authorized_key:
    user: "{{ autolab_gitops_user }}"
    path: "/home/{{ autolab_gitops_user }}/.ssh/authorized_keys"
    manage_dir: true
    key: "{{ autolab_gitops_ssh_public_keys | join('\n') }}"
    exclusive: true
    state: present
  when: autolab_gitops_ssh_public_keys | length > 0

- name: Remove Builder public keys when none are declared
  ansible.builtin.file:
    path: "/home/{{ autolab_gitops_user }}/.ssh/authorized_keys"
    state: absent
  when: autolab_gitops_ssh_public_keys | length == 0
