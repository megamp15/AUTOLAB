---
# Photo Jobs on the NAS: one container, built here from apps/photo-jobs in the
# repository, reading and moving files in the personal media folder that Immich
# scans (read-only there). Only this project is created or recreated; nothing
# else on the appliance is touched, and the Immich containers are checked
# before and after to prove it.
autolab_photos_root: /volume1/docker/photo-jobs
autolab_photos_project: photo-jobs
autolab_photos_media: /home/Mahir/media
autolab_photos_port: 8099
autolab_photos_memory: 768m
# The repository's copy of the app, as the runner has it checked out.
autolab_photos_source: "{{ playbook_dir }}/../../../apps/photo-jobs"
# The second lock: the API refuses anything without this header value, so
# reaching the container's port directly gets nothing. The same secret is given
# to Traefik, which adds it after Pocket ID has let an admin in. Comes from the
# PHOTO_JOBS_TOKEN secret; the play stops without it.
autolab_photos_token: ""
# Immich integration. The key needs asset.read for trash, album.read/album.create/
# albumAsset.create for Albums, and library.read/library.update to queue external-library
# scans after Inbox moves. Photo Jobs only links assets and queues scans; it never creates,
# edits or deletes libraries. Optional: with no key, Immich features are disconnected.
# Immich's port is the one its own compose project publishes (also used by Traefik).
autolab_photos_immich_key: ""
autolab_photos_immich_url: "http://{{ autolab_photos_ip }}:2283"
# Where the media folder appears inside Immich's container, so an asset's path can be found here.
autolab_photos_immich_prefix: /mnt/mahir-personal
# Containers that must come out of this exactly as they went in.
autolab_photos_protected: [immich_server, immich_machine_learning, immich_postgres, immich_redis]
