---
- name: Require the shared token before anything is created
  ansible.builtin.assert:
    that: autolab_photos_token | length >= 32
    fail_msg: >-
      PHOTO_JOBS_TOKEN is not set (or is shorter than 32 characters). Without it
      the photo service would answer anyone who can reach its port.
  no_log: true

- name: Require the media folder
  ansible.builtin.stat:
    path: "{{ autolab_photos_media }}"
  register: autolab_photos_media_stat

- name: Stop if the media folder is missing
  ansible.builtin.assert:
    that: autolab_photos_media_stat.stat.isdir | default(false)
    fail_msg: "{{ autolab_photos_media }} does not exist on the NAS; refusing to create an empty library."

- name: Record the Immich containers
  ansible.builtin.command:
    cmd: "docker inspect --format '{{ '{{.Id}} {{.State.StartedAt}}' }}' {{ autolab_photos_protected | join(' ') }}"
  register: autolab_photos_before
  changed_when: false
  check_mode: false

- name: Discover the NAS tailnet address
  ansible.builtin.command: tailscale ip -4
  register: autolab_photos_ip_raw
  changed_when: false
  check_mode: false

- name: Name the bind address
  ansible.builtin.set_fact:
    autolab_photos_ip: "{{ autolab_photos_ip_raw.stdout_lines[0] }}"

- name: Create the project and its state folder
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ autolab_photos_root }}"
    - "{{ autolab_photos_root }}/state"

- name: Copy the build context from the repository
  ansible.builtin.copy:
    src: "{{ autolab_photos_source }}/{{ item.src }}"
    dest: "{{ autolab_photos_root }}/{{ item.dest }}"
    owner: root
    group: root
    mode: preserve
  loop:
    - {src: Dockerfile, dest: Dockerfile}
    - {src: photo_jobs/, dest: photo_jobs/}
    - {src: web/, dest: web/}
  loop_control:
    label: "{{ item.dest }}"

- name: Render the compose file and the token file
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ autolab_photos_root }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {src: docker-compose.yml.j2, dest: docker-compose.yaml, mode: "0644"}
    - {src: env.j2, dest: .env, mode: "0600"}
  loop_control:
    label: "{{ item.dest }}"

# Replacing the container ends whatever the service is doing: a scan that had run for twenty
# minutes is simply gone. So ask first, and stop here if it is working.
- name: Ask a running service whether it is busy
  ansible.builtin.uri:
    url: "http://{{ autolab_photos_ip }}:{{ autolab_photos_port }}/api/job"
    headers:
      X-Autolab-Photos-Token: "{{ autolab_photos_token }}"
    return_content: true
  register: autolab_photos_busy
  failed_when: false
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Refuse to replace the service while it is working
  ansible.builtin.assert:
    that: >-
      autolab_photos_force | bool or
      ((autolab_photos_busy.json | default({})).get('job') or {}).get('state', '') != 'running'
    fail_msg: >-
      The photo service is running a job ({{ ((autolab_photos_busy.json | default({})).get('job') or {}).get('kind', '') }}).
      Replacing it now would end that job. Wait for it to finish, or stop it from the page if it is a scan,
      then run this again.
  when: not ansible_check_mode

- name: Build and start only this project
  community.docker.docker_compose_v2:
    project_src: "{{ autolab_photos_root }}"
    project_name: "{{ autolab_photos_project }}"
    state: present
    build: always
    pull: missing
    remove_orphans: false
  when: not ansible_check_mode

- name: Wait for the service
  ansible.builtin.uri:
    url: "http://{{ autolab_photos_ip }}:{{ autolab_photos_port }}/api/status"
    headers:
      X-Autolab-Photos-Token: "{{ autolab_photos_token }}"
    status_code: 200
  register: autolab_photos_up
  until: autolab_photos_up.status == 200
  retries: 20
  delay: 3
  no_log: true
  when: not ansible_check_mode

- name: Verify the API refuses a request without the token
  ansible.builtin.uri:
    url: "http://{{ autolab_photos_ip }}:{{ autolab_photos_port }}/api/status"
    status_code: 401
  when: not ansible_check_mode

- name: Verify it can see the media folder
  ansible.builtin.uri:
    url: "http://{{ autolab_photos_ip }}:{{ autolab_photos_port }}/api/status"
    headers:
      X-Autolab-Photos-Token: "{{ autolab_photos_token }}"
    return_content: true
  register: autolab_photos_status
  no_log: true
  when: not ansible_check_mode

# Reported, not required: the photo service works without Immich, and a key that is wrong or
# missing only leaves the Immich trash tab disconnected.
- name: Say whether the service can reach Immich
  ansible.builtin.uri:
    url: "http://{{ autolab_photos_ip }}:{{ autolab_photos_port }}/api/immich"
    headers:
      X-Autolab-Photos-Token: "{{ autolab_photos_token }}"
    return_content: true
  register: autolab_photos_immich
  failed_when: false
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Report that Immich is not configured
  ansible.builtin.debug:
    msg: "Immich: not configured (no IMMICH_API_KEY secret), so the Immich trash tab is disconnected."
  when:
    - not ansible_check_mode
    - not (autolab_photos_immich.json.configured | default(false))

- name: Report that Immich is connected
  ansible.builtin.debug:
    msg: "Immich: connected as {{ autolab_photos_immich.json.user }}, {{ autolab_photos_immich.json.version }}."
  when:
    - not ansible_check_mode
    - autolab_photos_immich.json.connected | default(false)

- name: Report that Immich is configured but not connected
  ansible.builtin.debug:
    msg: "Immich: the key is set but Immich did not accept it: {{ autolab_photos_immich.json.error | default('no answer') }}"
  when:
    - not ansible_check_mode
    - autolab_photos_immich.json.configured | default(false)
    - not (autolab_photos_immich.json.connected | default(false))

- name: Record the Immich containers again
  ansible.builtin.command:
    cmd: "docker inspect --format '{{ '{{.Id}} {{.State.StartedAt}}' }}' {{ autolab_photos_protected | join(' ') }}"
  register: autolab_photos_after
  changed_when: false
  check_mode: false

- name: Verify Immich was not restarted or recreated
  ansible.builtin.assert:
    that: autolab_photos_before.stdout_lines == autolab_photos_after.stdout_lines
    fail_msg: An Immich container changed while the photo service was deployed.
