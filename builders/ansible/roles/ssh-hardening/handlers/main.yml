---
- name: Validate effective SSH configuration
  listen: Validate and reload SSH
  ansible.builtin.command: sshd -t -f /etc/ssh/sshd_config
  changed_when: false

- name: Reload SSH
  listen: Validate and reload SSH
  ansible.builtin.service:
    name: "{{ autolab_ssh_service }}"
    state: reloaded
