---
- name: Require the account password the hypervisor will use
  ansible.builtin.assert:
    that: autolab_pbs_pve_password | length > 0
    fail_msg: "autolab_pbs_pve_password is empty; set the PBS_PVE_PASSWORD secret."
  run_once: true

- name: Install Proxmox's archive keyring
  ansible.builtin.get_url:
    url: "{{ autolab_pbs_keyring_url }}"
    dest: "{{ autolab_pbs_keyring_path }}"
    checksum: "{{ autolab_pbs_keyring_checksum }}"
    owner: root
    group: root
    mode: "0644"

# proxmox-repos treats a host without pveversion as PBS and writes the
# pbs-no-subscription repository — exactly right here, so it is reused rather
# than copied.
- name: Point apt at the PBS repository
  ansible.builtin.include_role:
    name: proxmox-repos

- name: Install Proxmox Backup Server
  ansible.builtin.apt:
    name: proxmox-backup-server
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: autolab_pbs_install
  # Check mode cannot write the repository above, so on a host that has never
  # had it apt cannot see the package at all. That is the install being
  # pending, not an error.
  failed_when:
    - autolab_pbs_install.failed | default(false)
    - not (ansible_check_mode and 'No package matching' in (autolab_pbs_install.msg | default('')))

# Nothing below can run before the package exists, and check mode does not
# install it: a host's first check run stops here and reports the install as
# the pending change; the next run reports the rest.
- name: Declare the server
  when: >-
    not (ansible_check_mode
         and (autolab_pbs_install is changed
              or 'No package matching' in (autolab_pbs_install.msg | default(''))))
  block:
    - name: Wait for the API to answer
      ansible.builtin.wait_for:
        port: 8007
        host: 127.0.0.1
        timeout: 60
      when: not ansible_check_mode

    # PBS runs as `backup`; on an NFS mount whose export rule squashes the wrong
    # way, root can create the directory and the service still cannot write a
    # chunk. The probe writes as that user first, so the failure names the export
    # rule instead of surfacing later as an opaque task error.
    - name: Own the datastore directories as the service user
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: backup
        group: backup
        mode: "0750"
      loop: "{{ autolab_pbs_datastores }}"
      loop_control:
        label: "{{ item.name }} {{ item.path }}"

    - name: Prove the service user can write there
      ansible.builtin.command:
        argv: [sh, -c, "f={{ item.path }}/.autolab-write-probe && touch \"$f\" && rm -f \"$f\""]
      become: true
      become_user: backup
      changed_when: false
      failed_when: false
      loop: "{{ autolab_pbs_datastores }}"
      loop_control:
        label: "{{ item.name }}"
      register: autolab_pbs_probe
      when: not ansible_check_mode

    - name: Stop if it cannot
      ansible.builtin.assert:
        that: item.rc | default(0) == 0
        fail_msg: >-
          The backup user cannot write to {{ item.item.path }}. Check the NAS
          export rule for this host: it must let numeric UID 34 through — map all
          users to admin, or no mapping with traversal granted on the share.
      loop: "{{ autolab_pbs_probe.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not ansible_check_mode

    - name: List what PBS already has
      ansible.builtin.command:
        argv: [proxmox-backup-manager, "{{ item }}", list, --output-format, json]
      loop: [datastore, prune-job, verify-job, user, acl]
      register: autolab_pbs_existing
      changed_when: false
      check_mode: false

    - name: Index the listings
      ansible.builtin.set_fact:
        autolab_pbs_have:
          datastores: "{{ autolab_pbs_existing.results[0].stdout | from_json | map(attribute='name') | list }}"
          prune_jobs: "{{ autolab_pbs_existing.results[1].stdout | from_json | map(attribute='id') | list }}"
          verify_jobs: "{{ autolab_pbs_existing.results[2].stdout | from_json | map(attribute='id') | list }}"
          users: "{{ autolab_pbs_existing.results[3].stdout | from_json | map(attribute='userid') | list }}"
          acls: "{{ autolab_pbs_existing.results[4].stdout | from_json | list }}"

    # Creating a datastore lays out 65 536 chunk directories under .chunks; over
    # NFS on the tailnet that is minutes, not seconds, hence the async.
    - name: Create datastores
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - datastore
          - create
          - "{{ item.name }}"
          - "{{ item.path }}"
          - --gc-schedule
          - "{{ item.gc_schedule }}"
          - --comment
          - "{{ item.comment | default('') }}"
      loop: "{{ autolab_pbs_datastores }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in autolab_pbs_have.datastores
      async: 3600
      poll: 20
      changed_when: true

    - name: Create prune jobs
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - prune-job
          - create
          - "{{ item.name }}-prune"
          - --store
          - "{{ item.name }}"
          - --schedule
          - "{{ item.prune.schedule }}"
          - --keep-daily
          - "{{ item.prune.keep_daily }}"
          - --keep-weekly
          - "{{ item.prune.keep_weekly }}"
          - --keep-monthly
          - "{{ item.prune.keep_monthly }}"
      loop: "{{ autolab_pbs_datastores }}"
      loop_control:
        label: "{{ item.name }}-prune"
      when: (item.name ~ '-prune') not in autolab_pbs_have.prune_jobs
      changed_when: true

    - name: Create verify jobs
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - verify-job
          - create
          - "{{ item.name }}-verify"
          - --store
          - "{{ item.name }}"
          - --schedule
          - "{{ item.verify.schedule }}"
          - --ignore-verified
          - "true"
          - --outdated-after
          - "{{ item.verify.outdated_after }}"
      loop: "{{ autolab_pbs_datastores }}"
      loop_control:
        label: "{{ item.name }}-verify"
      when: (item.name ~ '-verify') not in autolab_pbs_have.verify_jobs
      changed_when: true

    - name: Create the hypervisor's account
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - user
          - create
          - "{{ autolab_pbs_pve_user }}"
          - --password
          - "{{ autolab_pbs_pve_password }}"
          - --comment
          - Proxmox VE backs up with this account
      no_log: true
      when: autolab_pbs_pve_user not in autolab_pbs_have.users
      changed_when: true

    - name: Grant it the datastores
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - acl
          - update
          - "/datastore/{{ item.name }}"
          - "{{ autolab_pbs_pve_role }}"
          - --auth-id
          - "{{ autolab_pbs_pve_user }}"
      loop: "{{ autolab_pbs_datastores }}"
      loop_control:
        label: "{{ autolab_pbs_pve_user }} {{ autolab_pbs_pve_role }} on {{ item.name }}"
      when: >-
        autolab_pbs_have.acls
        | selectattr('path', 'equalto', '/datastore/' ~ item.name)
        | selectattr('ugid', 'equalto', autolab_pbs_pve_user)
        | selectattr('roleid', 'equalto', autolab_pbs_pve_role)
        | list | length == 0
      changed_when: true

    - name: Create the digest's account
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - user
          - create
          - "{{ autolab_pbs_digest_user }}"
          - --comment
          - Read-only token for the morning digest
      when: autolab_pbs_digest_user not in autolab_pbs_have.users
      changed_when: true

    - name: List its tokens
      ansible.builtin.command:
        argv: [proxmox-backup-manager, user, list-tokens, "{{ autolab_pbs_digest_user }}", --output-format, json]
      register: autolab_pbs_digest_tokens
      changed_when: false
      check_mode: false

    # PBS prints the secret once. It goes straight into a root-only file and
    # nowhere else; the play never echoes it.
    - name: Generate the token
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - user
          - generate-token
          - "{{ autolab_pbs_digest_user }}"
          - "{{ autolab_pbs_digest_token_name }}"
      register: autolab_pbs_digest_generated
      when: >-
        (autolab_pbs_digest_user ~ '!' ~ autolab_pbs_digest_token_name)
        not in (autolab_pbs_digest_tokens.stdout | from_json | map(attribute='tokenid') | list)
      no_log: true
      changed_when: true
      failed_when: false

    # The secret is on stdout, never on stderr, so the error can be shown.
    - name: Explain a token that could not be generated
      ansible.builtin.assert:
        that: autolab_pbs_digest_generated is skipped or autolab_pbs_digest_generated.rc == 0
        fail_msg: "generate-token failed: {{ autolab_pbs_digest_generated.stderr | default('') }}"

    - name: Keep the secret on this host
      ansible.builtin.copy:
        # generate-token prints `Result: {…}` and takes no output format.
        content: "{{ (autolab_pbs_digest_generated.stdout | regex_replace('^\\s*Result:\\s*', '') | from_json).value }}\n"
        dest: "{{ autolab_pbs_digest_token_file }}"
        owner: root
        group: root
        mode: "0600"
      when: autolab_pbs_digest_generated is not skipped
      no_log: true

    - name: Grant the token read access to the datastores
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - acl
          - update
          - "/datastore/{{ item.name }}"
          - DatastoreAudit
          - --auth-id
          - "{{ autolab_pbs_digest_user }}!{{ autolab_pbs_digest_token_name }}"
      loop: "{{ autolab_pbs_datastores }}"
      loop_control:
        label: "digest token DatastoreAudit on {{ item.name }}"
      when: >-
        autolab_pbs_have.acls
        | selectattr('path', 'equalto', '/datastore/' ~ item.name)
        | selectattr('ugid', 'equalto', autolab_pbs_digest_user ~ '!' ~ autolab_pbs_digest_token_name)
        | selectattr('roleid', 'equalto', 'DatastoreAudit')
        | list | length == 0
      changed_when: true

    - name: Read the secret back for the hand-off
      ansible.builtin.slurp:
        path: "{{ autolab_pbs_digest_token_file }}"
      register: autolab_pbs_digest_token_raw
      no_log: true

    - name: Remember what the stack host needs
      ansible.builtin.set_fact:
        autolab_pbs_digest_token_id: "{{ autolab_pbs_digest_user }}!{{ autolab_pbs_digest_token_name }}"
        autolab_pbs_digest_token_secret: "{{ autolab_pbs_digest_token_raw.content | b64decode | trim }}"
        autolab_pbs_digest_datastores: "{{ autolab_pbs_datastores | map(attribute='name') | list }}"
      no_log: true

    - name: Report the fingerprint the hypervisor will pin
      ansible.builtin.command:
        argv: [proxmox-backup-manager, cert, info]
      register: autolab_pbs_cert
      changed_when: false
      check_mode: false

    - name: Show it
      ansible.builtin.debug:
        msg: "{{ autolab_pbs_cert.stdout_lines | select('search', 'Fingerprint') | list }}"

    - name: Remember it too
      ansible.builtin.set_fact:
        # "Fingerprint (sha256): aa:bb:…" — everything after the label.
        autolab_pbs_fingerprint: >-
          {{ ((autolab_pbs_cert.stdout_lines | select('search', 'Fingerprint') | first).split('): ') | last) | trim }}
