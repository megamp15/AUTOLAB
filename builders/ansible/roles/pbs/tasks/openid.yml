---
# Pocket ID on PBS's login page. `openid create` refuses an existing realm,
# so it is listed first and created or updated accordingly.
- name: List the OpenID realms
  ansible.builtin.command:
    argv: [proxmox-backup-manager, openid, list, --output-format, json]
  register: autolab_pbs_openid_realms
  changed_when: false
  check_mode: false

- name: Note whether the realm exists
  ansible.builtin.set_fact:
    autolab_pbs_openid_exists: >-
      {{ autolab_pbs_openid_realm in (autolab_pbs_openid_realms.stdout | from_json | map(attribute='realm') | list) }}

# `update` takes what `create` takes minus --username-claim, which is fixed
# at creation. Scopes are one space-separated value: repeating --scopes is
# "duplicate parameter". Re-applied on every run so a changed secret lands.
- name: Create or update the Pocket ID realm
  ansible.builtin.command:
    argv: >-
      {{ ['proxmox-backup-manager', 'openid', 'update' if autolab_pbs_openid_exists | bool else 'create', autolab_pbs_openid_realm]
         + ([] if autolab_pbs_openid_exists | bool
            else ['--username-claim', autolab_pbs_openid_username_claim])
         + ['--issuer-url', autolab_pbs_openid_issuer_url,
            '--client-id', autolab_pbs_openid_client_id,
            '--client-key', autolab_pbs_openid_client_secret,
            '--autocreate', 'true',
            '--scopes', 'email profile',
            '--comment', autolab_pbs_openid_comment] }}
  no_log: true
  changed_when: true

# PBS refuses a role for a user that does not exist, and the realm would
# only create them on first login. Created here, empty; the realm's
# autocreate still covers everyone else.
- name: List the users
  ansible.builtin.command:
    argv: [proxmox-backup-manager, user, list, --output-format, json]
  register: autolab_pbs_users
  changed_when: false
  check_mode: false

- name: Create the named admin ahead of their first login
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - user
      - create
      - "{{ autolab_pbs_openid_admin_user }}@{{ autolab_pbs_openid_realm }}"
      - --comment
      - "Pocket ID admin, created ahead of first login"
  when:
    - autolab_pbs_openid_admin_user | length > 0
    - >-
      (autolab_pbs_openid_admin_user ~ '@' ~ autolab_pbs_openid_realm)
      not in (autolab_pbs_users.stdout | from_json | map(attribute='userid') | list)
  changed_when: true

- name: List the ACLs
  ansible.builtin.command:
    argv: [proxmox-backup-manager, acl, list, --output-format, json]
  register: autolab_pbs_acls
  changed_when: false
  check_mode: false

- name: Give the named admin the Admin role on everything
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - acl
      - update
      - /
      - Admin
      - --auth-id
      - "{{ autolab_pbs_openid_admin_user }}@{{ autolab_pbs_openid_realm }}"
  when:
    - autolab_pbs_openid_admin_user | length > 0
    - >-
      autolab_pbs_acls.stdout | from_json
      | selectattr('path', 'equalto', '/')
      | selectattr('roleid', 'equalto', 'Admin')
      | selectattr('ugid', 'equalto', autolab_pbs_openid_admin_user ~ '@' ~ autolab_pbs_openid_realm)
      | list | length == 0
  changed_when: true
