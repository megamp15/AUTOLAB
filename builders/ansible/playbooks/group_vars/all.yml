---
# Facts two roles have to agree on, in one place rather than two.
#
# container-services publishes these ports on the services host; the ingress
# role, on a different machine, routes the names to them. A port defined in
# both roles' defaults would drift the first time one changed, so it lives
# here, next to the playbooks that load it.

# Services that run on machines in a Stack this inventory does not contain, by
# the machine's tailnet name. The ingress run (lab) and the homepage cannot see
# the edge Stack's machines map, so the names live here, and
# scripts/test_remote_services.py fails if this differs from the machine's own
# builder.services in infra/stacks/*/machines.auto.tfvars. One declaration per
# service stays true: the machines map says where it runs, this says who has to
# be told.
autolab_remote_services:
  nebula: [adventurelog, forgejo, tandoor, airtrail, karakeep, sure]
  aurora: [jellyfin, sonarr, radarr, prowlarr, bazarr, sabnzbd, qbittorrent]

# Every container service the lab knows, what it listens on, and how a person
# gets in:
#   plugin — Traefik's OIDC middleware; one passkey, same session as the rest
#   own    — the service does its own login behind the plugin's absence
#   none   — no UI to reach
autolab_service_catalog:
  dockhand:
    port: 9000
    login: admin
  registry:
    # No plugin, and not for want of trying: `docker login` and `docker push`
    # are not browsers and cannot answer a passkey challenge. The name exists
    # so that pushes get a real certificate — Docker refuses a plain-HTTP
    # registry without an insecure-registries entry on every client — and the
    # tailnet remains the gate, as it is for Prometheus.
    port: 5000
    login: none
  registry-ui:
    port: 8082
    login: plugin
  diun:
    login: none
  code-server:
    port: 8443
    login: plugin
  # Immich Public Proxy: the one public face of Immich. It serves shared links
  # (share.<zone>/share/<key>) and nothing else — no login, library or API —
  # so Immich itself stays on the tailnet. No plugin: a shared link is meant to
  # open for someone without an account. The public route is in the ingress
  # playbook; this port is also reachable on the tailnet.
  immich-share:
    port: 8095
    login: none
  # gethomepage: a compact grid of every lab app and console, at
  # dash.<label>.<zone>, next to the custom homepage rather than instead of it.
  dash:
    port: 8096
    login: plugin
  # QR codes that redirect. The admin page is the catalog port, reached only
  # at the public qr.<zone>, behind the passkey (the ingress playbook's public
  # routes): the people who use it are not on the tailnet, and one name is
  # one thing to manage. `lab: false` keeps it from also getting a *.lab
  # name. The redirect side has no port on the host at all: it joins the
  # paradigm-public network, where paradigm-tunnel carries it out through a
  # tunnel in another Cloudflare account, never touching horizon's Traefik.
  qr:
    port: 8097
    login: plugin
    lab: false
  # AdventureLog: the travel log. `own`, not `plugin`: it keeps a user per
  # person (their adventures, their Immich key), so it signs people in itself
  # with Pocket ID's OpenID Connect and the plugin in front would be a second,
  # redundant login. Tailnet-only, like every lab name.
  adventurelog:
    port: 8098
    login: own
  # Forgejo: the lab's own git host. Mirrors of the projects the apps come from
  # (so a takedown costs nothing) and our forks of them, which are what gets
  # built. `own`: it signs people in itself with Pocket ID.
  forgejo:
    port: 8100
    login: own
  # The self-hosted apps on nebula. All `own`: each keeps a user per person and
  # signs them in itself with Pocket ID, so the plugin in front would be a
  # second login. Tailnet-only.
  tandoor:
    port: 8101
    login: own
  airtrail:
    port: 8102
    login: own
  # Karakeep: bookmarks that fetch and tag themselves; took LinkAce's place
  # (and not its port, so a stale route cannot land on the wrong app). `own`:
  # it keeps a user per person and signs them in with Pocket ID itself.
  karakeep:
    port: 8107
    login: own
  sure:
    port: 8104
    login: own
  # Jellyfin on aurora: films and shows. `own`: it keeps a user per person and
  # signs them in itself, and its apps on a phone or a TV cannot answer a
  # passkey page. This port is the tailnet's; the home network dials the
  # machine's own address on 8096. See docs/gitops/media.md.
  jellyfin:
    port: 8110
    login: own
  # The download apps on aurora. `plugin`: none of them keeps a user per
  # person, so the passkey sits in front. qBittorrent's port is Gluetun's, the
  # container whose network it shares. See docs/gitops/media.md.
  prowlarr:
    port: 8111
    login: plugin
  sonarr:
    port: 8112
    login: plugin
  radarr:
    port: 8113
    login: plugin
  bazarr:
    port: 8114
    login: plugin
  sabnzbd:
    port: 8115
    login: plugin
  qbittorrent:
    port: 8116
    login: plugin
  # RustDesk: remote desktop between the lab's own machines. No port here on
  # purpose: it is raw TCP and UDP (21115-21117), not HTTP, so there is nothing
  # for Traefik to route, and a port in this catalog would make it try. The
  # tailnet is the gate; the server's key is the second.
  rustdesk:
    login: none
  # The connector for the tunnel in the Paradigm Prints Cloudflare account. One
  # tunnel, any number of hostnames: each is a route in that account's
  # dashboard to <container>:<port> on the paradigm-public network. Only
  # containers meant to be public join that network.
  paradigm-tunnel:
    login: none
  # COSMOS, the personal hub. Its gateway is the only container with a host
  # port; the API and Postgres sit on an internal network. Reached at
  # cosmos.<label>.<zone> by Pocket ID admins only, and the gateway refuses any
  # request that did not come through Traefik's token. See docs/gitops/cosmos.md.
  cosmos:
    port: 8105
    login: admin
    # The iPhone shortcut posts Apple Health here with COSMOS's ingest token.
    # A shortcut cannot do the passkey login, so this path skips it.
    token_paths: ["/api/ingest/"]
  # Novaflix: a private tracker of what a few friends watch, our own app. It
  # keeps a user per person and signs them in itself, and the friends are not
  # on the tailnet, so its one name is public (`lab: false`; the route is in
  # playbooks/ingress.yml). See docs/gitops/novaflix.md.
  novaflix:
    port: 8108
    login: own
    lab: false
  # The same app's account management (who has an account, a password reset),
  # which the public gateway does not answer. Tailnet-only, behind the passkey,
  # and then the app's own admin sign-in.
  novaflix-admin:
    port: 8109
    login: plugin
  # Hermes, the owner's agent. The gateway dials out (WhatsApp, the model
  # provider, GitHub) and has no port; this port is its dashboard, run in
  # the same container: sessions, chat, config, logs. Behind the
  # passkey and then its own login, because it edits the file that holds the
  # agent's keys. See docs/gitops/hermes.md.
  hermes:
    port: 8106
    login: plugin
