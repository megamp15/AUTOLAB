---
# Facts two roles have to agree on, in one place rather than two.
#
# container-services publishes these ports on the services host; the ingress
# role, on a different machine, routes the names to them. A port defined in
# both roles' defaults would drift the first time one changed, so it lives
# here, next to the playbooks that load it.

# Services that run on machines in a Stack this inventory does not contain, by
# the machine's tailnet name. The ingress run (lab) and the homepage cannot see
# the edge Stack's machines map, so the names live here, and
# scripts/test_remote_services.py fails if this differs from the machine's own
# builder.services in infra/stacks/*/machines.auto.tfvars. One declaration per
# service stays true: the machines map says where it runs, this says who has to
# be told.
autolab_remote_services:
  nebula: [adventurelog, forgejo, tandoor, airtrail, linkace, sure]

# Every container service the lab knows, what it listens on, and how a person
# gets in:
#   plugin — Traefik's OIDC middleware; one passkey, same session as the rest
#   own    — the service does its own login behind the plugin's absence
#   none   — no UI to reach
autolab_service_catalog:
  dockhand:
    port: 9000
    login: admin
  registry:
    # No plugin, and not for want of trying: `docker login` and `docker push`
    # are not browsers and cannot answer a passkey challenge. The name exists
    # so that pushes get a real certificate — Docker refuses a plain-HTTP
    # registry without an insecure-registries entry on every client — and the
    # tailnet remains the gate, as it is for Prometheus.
    port: 5000
    login: none
  registry-ui:
    port: 8082
    login: plugin
  diun:
    login: none
  code-server:
    port: 8443
    login: plugin
  # Immich Public Proxy: the one public face of Immich. It serves shared links
  # (share.<zone>/share/<key>) and nothing else — no login, library or API —
  # so Immich itself stays on the tailnet. No plugin: a shared link is meant to
  # open for someone without an account. The public route is in the ingress
  # playbook; this port is also reachable on the tailnet.
  immich-share:
    port: 8095
    login: none
  # gethomepage: a compact grid of every lab app and console, at
  # dash.<label>.<zone>, next to the custom homepage rather than instead of it.
  dash:
    port: 8096
    login: plugin
  # QR codes that redirect. The admin page is the catalog port, behind the
  # passkey at qr.<label>.<zone>. The redirect side has no port on the host at
  # all: it joins the paradigm-public network, where paradigm-tunnel carries it
  # out through a tunnel in another Cloudflare account, never touching
  # horizon's Traefik.
  qr:
    port: 8097
    login: plugin
  # AdventureLog: the travel log. `own`, not `plugin`: it keeps a user per
  # person (their adventures, their Immich key), so it signs people in itself
  # with Pocket ID's OpenID Connect and the plugin in front would be a second,
  # redundant login. Tailnet-only, like every lab name.
  adventurelog:
    port: 8098
    login: own
  # Forgejo: the lab's own git host. Mirrors of the projects the apps come from
  # (so a takedown costs nothing) and our forks of them, which are what gets
  # built. `own`: it signs people in itself with Pocket ID.
  forgejo:
    port: 8100
    login: own
  # The self-hosted apps on nebula. All `own`: each keeps a user per person and
  # signs them in itself with Pocket ID, so the plugin in front would be a
  # second login. Tailnet-only.
  tandoor:
    port: 8101
    login: own
  airtrail:
    port: 8102
    login: own
  linkace:
    port: 8103
    login: own
  sure:
    port: 8104
    login: own
  # The connector for the tunnel in the Paradigm Prints Cloudflare account. One
  # tunnel, any number of hostnames: each is a route in that account's
  # dashboard to <container>:<port> on the paradigm-public network. Only
  # containers meant to be public join that network.
  paradigm-tunnel:
    login: none
