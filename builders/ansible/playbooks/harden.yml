---
- name: Apply Autolab Linux server baseline
  hosts: linux_servers
  become: true
  gather_facts: true

  vars:
    # Named human operators for this lab. Kept here rather than in the role
    # defaults so the list is committed, reviewable, and obvious in diffs.
    # Use the local-part of the operator's tailnet login as the username so it
    # lines up with the tailnet SSH policy (megamp15@github -> megamp15).
    autolab_admin_users:
      - name: megamp15

    # Offboarding is explicit: removing a name above does NOT delete the
    # account, it only stops managing it. List departures here, and drop them
    # from the tailnet SSH policy's `users` list in the same change.
    autolab_admin_users_absent: []

  # Tags let an urgent change run as a slice of the baseline rather than the
  # whole thing — `--tags users` revokes an account in seconds without touching
  # packages or firewall rules. The full playbook still runs every role, so a
  # tagged run is a shortcut, never a substitute: state only converges across
  # every host because harden runs untagged on the normal cadence.
  roles:
    - role: base-linux
      tags: [base, packages]
    - role: gitops-user
      tags: [users]
    - role: admin-users
      tags: [users]
    - role: ssh-hardening
      tags: [ssh]
    - role: firewall
      tags: [firewall]
