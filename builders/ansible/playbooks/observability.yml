---
# Backends first, then agents.
#
# The order matters on a first deploy. Alloy's prometheus.remote_write retries
# indefinitely and recovers on its own, but loki.write gives up — "no retries
# left, dropping data" — and does not resume when the backend appears later.
# Starting producers before their consumer costs the logs from that window and
# leaves the agent silently shipping nothing until someone restarts it.
#
# Both plays are driven from the machines map, so adding a host to the lab is
# enough to start seeing it.

- name: Deploy the observability backends on the stack host
  hosts: linux_servers
  # A notified restart must survive a later failure in the play: a rule file
  # that changed with no restart behind it is a change Grafana never saw,
  # and the next run sees no change to notify on.
  force_handlers: true
  become: true
  gather_facts: true

  # A fresh cloud image starts unattended-upgrades minutes after first boot
  # and holds the dpkg lock for as long as its backlog takes — ten minutes on
  # an Ubuntu 24.04 image with 186 updates pending. The baseline installs
  # that daemon on purpose, so a Builder run that lands in the window must
  # wait for it, not lose to it. The first tenant storage run lost.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900

  vars:
    # Prometheus keeps its working data on local disk, where a TSDB needs to be;
    # this is the copy that outlives the VM. Snapshots go through the admin API
    # rather than copying the data directory, because rsyncing a live TSDB
    # captures half-written blocks and restores to corruption.
    #
    # The role skips the timer entirely when the mount is absent, so declaring
    # the path here is safe before the NAS export exists — it starts working on
    # the first run after the share is mounted, rather than needing a second
    # edit nobody remembers to make.
    autolab_obs_backup_dir: /mnt/autolab/obs

  roles:
    # Selected by machine policy rather than by hostname, so moving the stack to
    # a different machine is a machines.auto.tfvars change, not a playbook edit.
    - role: observability-stack
      when: (autolab_builder | default({})).observability.stack | default(false) | bool
      tags: [obs, stack]

- name: Install the observability agent on every Builder machine
  hosts: linux_servers
  become: true
  gather_facts: true

  roles:
    # Opt-out, not opt-in: a machine is monitored unless the machines map says
    # otherwise, so forgetting the flag leaves you with more visibility rather
    # than less.
    - role: observability-agent
      when: ((autolab_builder | default({})).observability | default({})).agent | default(true) | bool
      tags: [obs, agent]
