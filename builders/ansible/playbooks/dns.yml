---
# DNS with ad blocking for the home network: Pi-hole on whichever machine the
# machines map marks builder.pihole = true (magnetosphere, in the edge Stack).
# Needs the docker playbook first.

- name: Run Pi-hole on the DNS machine
  hosts: linux_servers
  force_handlers: true
  become: true
  gather_facts: true

  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900

  roles:
    - role: pihole
      when: (autolab_builder | default({})).pihole | default(false) | bool
      tags: [dns, pihole]
