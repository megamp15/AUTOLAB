---
- name: Mount NAS storage on Builder machines
  hosts: linux_servers
  become: true
  gather_facts: true

  vars:
    # Shares to mount. Declared here so the layout is committed and reviewable.
    # Use a Tailscale MagicDNS name rather than a LAN IP: the address follows
    # the device instead of the subnet, and the traffic stays on the tailnet
    # like every other Autolab path.
    #
    # `singularity` is the Ugreen NAS. Over the tailnet the NAS sees each VM's
    # own address, so its export can be scoped per host — on the LAN path the
    # Proxmox NAT collapses every VM into one source IP and that distinction is
    # lost.
    #
    # /volume1/autolab is deliberately separate from QNTA360's /volume1/qnta:
    # lab machines are disposable and must not be able to write into another
    # project's data.
    #
    # The mount point is named after the share, not the device. Hardware gets
    # replaced and a device-named mount point outlives it.
    autolab_nfs_mounts:
      - server: singularity
        export: /volume1/autolab
        path: /mnt/autolab
        directories:
          - lab-01

  roles:
    - role: nfs-client
      tags: [nfs, storage]
