---
# The baseline for a workstation (inventories/workstations): the parts of
# harden.yml that make sense on a machine a person sits at and that is often
# off. See docs/gitops/workstations.md for what is left out and why.
- name: Apply the Autolab workstation baseline
  hosts: workstations
  become: true
  gather_facts: true

  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900

  vars:
    # The same named operators as harden.yml; keep the two lists equal.
    autolab_admin_users:
      - name: megamp15
    autolab_admin_users_absent: []

  # Left out on purpose, compared with harden.yml:
  # - ssh-hardening, fail2ban: no sshd listens; access is Tailscale SSH only.
  # - firewall: WSL2 in NAT mode is unreachable from the LAN already, and
  #   inbound traffic arrives only on tailscale0; ufw inside WSL2 is untested.
  # - observability, updates-report: a host that is off for a day would raise
  #   "Updates report is stale" and agent alerts every night.
  roles:
    - role: base-linux
      tags: [base, packages]
    - role: gitops-user
      tags: [users]
    - role: admin-users
      tags: [users]
    - role: motd
      tags: [motd]
