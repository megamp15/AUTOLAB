---
- name: Manage existing NAS Docker projects
  hosts: nas_servers
  become: true
  gather_facts: true
  vars:
    autolab_nas_action: inspect
  roles:
    - role: nas-projects
      when: autolab_nas_action not in ['telemetry', 'management']
      tags: [nas, projects]
    - role: nas-observability
      when: autolab_nas_action == 'telemetry'
      tags: [nas, observability]
    - role: nas-management
      when: autolab_nas_action == 'management'
      tags: [nas, management]
