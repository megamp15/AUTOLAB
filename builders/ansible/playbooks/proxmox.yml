---
# The hypervisor layer.
#
# Separate from harden.yml on purpose. That playbook applies the VM baseline —
# unattended upgrades, sshd hardening, ufw — and none of it belongs on a
# Proxmox node: its sshd carries cluster traffic, it has its own firewall, and
# unattended restarts on the machine everything runs on is a decision rather
# than a default.
#
# What is shared is the account model: named operators, a gitops automation
# account, and root used only for the first run.
- name: Bring Proxmox nodes under management
  hosts: proxmox_nodes
  become: true
  gather_facts: true

  # A fresh cloud image starts unattended-upgrades minutes after first boot
  # and holds the dpkg lock for as long as its backlog takes — ten minutes on
  # an Ubuntu 24.04 image with 186 updates pending. The baseline installs
  # that daemon on purpose, so a Builder run that lands in the window must
  # wait for it, not lose to it. The first tenant storage run lost.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900

  vars:
    autolab_admin_users:
      - name: megamp15
    autolab_admin_users_absent: []

    # The login screen's Env line. A node is not a stack; it is what the
    # stacks run on.
    autolab_environment: hypervisor

    # Backups, per node. Every node backs up to ark, but not by the same
    # road and not the same guests, and not every node's key is saved yet.
    #
    # pbs_server: ark's bridge address (.11, declared in the lab machines map)
    # on the node that runs ark, because a bridge does not span hosts; any
    # other node reaches it over the tailnet, by name.
    #
    # exclude: templates (rebuilt from Git; 9000 alone is 4 GB a night), and
    # on xps-pve ark itself (104). Snapshot mode freezes the guest's
    # filesystems, and a frozen PBS cannot accept the backup connection from
    # the node — the first nightly deadlocked on exactly that. Nothing on ark
    # needs backing up: the chunk store is on the NAS, the key is off the
    # node, and the pbs role recreates its configuration. On pve, the stopped
    # qcicd guests (502–505) and their templates (598, 599) are left alone:
    # they are not AUTOLAB's, and 502 alone is a 500 GB disk.
    #
    # enabled: a job runs only once its node's /etc/pve/priv/storage/ark.enc
    # is in the password manager and R2 — a backup nobody can decrypt is a
    # file. xps-pve's was saved 2026-09-20; this line is the record of that.
    # pve's key is generated on its first apply.
    autolab_pve_backup_by_node:
      xps-pve:
        pbs_server: 10.42.0.11
        exclude: [9000, 9001, 9002, 104]
        enabled: true
      pve:
        pbs_server: "ark.{{ lookup('env', 'AUTOLAB_TAILNET_DOMAIN') }}"
        exclude: [9002, 502, 503, 504, 505, 598, 599]
        enabled: false
    autolab_pve_backup: "{{ autolab_pve_backup_by_node[inventory_hostname] }}"

    autolab_pve_pbs_storages:
      - name: ark
        server: "{{ autolab_pve_backup.pbs_server }}"
        datastore: singularity
        username: pve@pbs

    autolab_pve_backup_jobs:
      - id: autolab-nightly
        storage: ark
        schedule: "02:00"
        exclude: "{{ autolab_pve_backup.exclude }}"
        enabled: "{{ autolab_pve_backup.enabled }}"

  roles:
    - role: proxmox-node
      tags: [proxmox, base]
    - role: gitops-user
      tags: [proxmox, users]
    - role: admin-users
      tags: [proxmox, users]
    - role: proxmox-repos
      tags: [proxmox, repos]
    - role: proxmox-nag
      tags: [proxmox, nag]
    # sshd and the UI on 8006 are the node's LAN-exposed surfaces; the
    # guests get the sshd jail from harden.yml.
    - role: fail2ban
      tags: [proxmox, fail2ban]
    # The same login screen as every guest, in provider green: the one
    # machine whose "Reboot: required for kernel …" line matters most.
    - role: motd
      tags: [proxmox, motd]
    # Pocket ID on the login page, once the ingress phase gave the node an
    # issuer to trust. Nothing happens until the client exists.
    - role: proxmox-openid
      tags: [proxmox, openid]
