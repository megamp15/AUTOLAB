---
# The hypervisor layer.
#
# Separate from harden.yml on purpose. That playbook applies the VM baseline —
# unattended upgrades, sshd hardening, ufw — and none of it belongs on a
# Proxmox node: its sshd carries cluster traffic, it has its own firewall, and
# unattended restarts on the machine everything runs on is a decision rather
# than a default.
#
# What is shared is the account model: named operators, a gitops automation
# account, and root used only for the first run.
- name: Bring Proxmox nodes under management
  hosts: proxmox_nodes
  become: true
  gather_facts: true

  # A fresh cloud image starts unattended-upgrades minutes after first boot
  # and holds the dpkg lock for as long as its backlog takes — ten minutes on
  # an Ubuntu 24.04 image with 186 updates pending. The baseline installs
  # that daemon on purpose, so a Builder run that lands in the window must
  # wait for it, not lose to it. The first tenant storage run lost.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 900

  vars:
    autolab_admin_users:
      - name: megamp15
    autolab_admin_users_absent: []

    # The login screen's Env line. A node is not a stack; it is what the
    # stacks run on.
    autolab_environment: hypervisor

    # Where this node's backups go. ark's bridge address is a convention
    # (.11, next to jwst's .10), declared in the lab machines map; the
    # hypervisor inventory is static so it is restated here rather than read
    # from an inventory this playbook never sees.
    autolab_pve_pbs_storages:
      - name: ark
        server: 10.42.0.11
        datastore: singularity
        username: pve@pbs

    # Enabled 2026-09-20, once /etc/pve/priv/storage/ark.enc was in the
    # password manager and R2 — this line is the record of that.
    #
    # Excluded: the templates (rebuilt from Git; 9000 alone is 4 GB a night)
    # and ark itself (104). Snapshot mode freezes the guest's filesystems,
    # and a frozen PBS cannot accept the backup connection from the node —
    # the first nightly deadlocked on exactly that. Nothing on ark needs
    # backing up: the chunk store is on the NAS, the key is off the node,
    # and the pbs role recreates its configuration.
    autolab_pve_backup_jobs:
      - id: autolab-nightly
        storage: ark
        schedule: "02:00"
        exclude: [9000, 9001, 9002, 104]
        enabled: true

  roles:
    - role: proxmox-node
      tags: [proxmox, base]
    - role: gitops-user
      tags: [proxmox, users]
    - role: admin-users
      tags: [proxmox, users]
    - role: proxmox-repos
      tags: [proxmox, repos]
    - role: proxmox-nag
      tags: [proxmox, nag]
    # sshd and the UI on 8006 are the node's LAN-exposed surfaces; the
    # guests get the sshd jail from harden.yml.
    - role: fail2ban
      tags: [proxmox, fail2ban]
    # The same login screen as every guest, in provider green: the one
    # machine whose "Reboot: required for kernel …" line matters most.
    - role: motd
      tags: [proxmox, motd]
    # Pocket ID on the login page, once the ingress phase gave the node an
    # issuer to trust. Nothing happens until the client exists.
    - role: proxmox-openid
      tags: [proxmox, openid]
