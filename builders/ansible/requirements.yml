---
collections:
  - name: community.general
    version: ">=13.0.0,<14.0.0"
  # ansible.posix.mount manages the mount and its fstab entry as one idempotent
  # operation. Doing it by hand (lineinfile on fstab plus a mount command) has
  # to reconcile the two itself and gets it wrong on changed options.
  - name: ansible.posix
    version: ">=2.0.0,<3.0.0"
  # community.docker.docker_compose_v2 drives the observability stack. Shelling
  # out to `docker compose` would work but reports changed on every run.
  - name: community.docker
    version: ">=4.0.0,<5.0.0"
