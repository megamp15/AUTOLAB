---
# Static, and committed, like the hypervisors and the NAS.
#
# A workstation is a Linux environment on a machine someone sits at — WSL2 on
# a desktop — that is part of the lab while that machine is on and simply
# absent while it is off. OpenTofu does not create it, so nothing generates
# this file, and being off is its normal state, not an outage.
#
# Deliberately NOT a child of linux_servers. 05 deploys observability to
# limit=all on every merge and fails on any host it cannot reach; a machine
# that is off most nights would fail every one of those runs. It is configured
# by 13_workstation.yml, dispatched by hand while it is on.
all:
  children:
    workstations:
      hosts:
        # WSL2 Ubuntu on the desktop. Its own tailnet node (tag:autolab-ws),
        # separate from the Windows host's.
        quasar: {}

      vars:
        # Names, not addresses, exactly as for the hypervisors: the tailnet
        # comes from the environment so it is not written into this repo.
        ansible_host: >-
          {{ inventory_hostname }}.{{ lookup('env', 'AUTOLAB_TAILNET_DOMAIN')
             or undef('AUTOLAB_TAILNET_DOMAIN is unset: export the tailnet domain (secrets.TAILNET_DOMAIN in CI)') }}
        # gitops exists from the host's first, hand-run baseline on
        # (docs/gitops/workstations.md); CI never needs a bootstrap account.
        ansible_user: gitops
