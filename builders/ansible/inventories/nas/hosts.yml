---
# Physical appliances belong outside the generated Proxmox VM inventory.
# Supply the existing UGOS SSH account; this playbook never creates OS users.
all:
  children:
    nas_servers:
      hosts:
        singularity:
          ansible_host: singularity
          ansible_user: "{{ lookup('ansible.builtin.env', 'AUTOLAB_NAS_SSH_USER') | default('root', true) }}"
          ansible_port: "{{ lookup('ansible.builtin.env', 'AUTOLAB_NAS_SSH_PORT') | default('22', true) | int }}"
          autolab_nas_stack_host: jwst
