# Static, and committed rather than an example.
#
# Every other inventory is generated from OpenTofu output, because those hosts
# are things OpenTofu creates. A hypervisor is the thing they are created *on*,
# so nothing in the machines map describes it and nothing would generate it.
#
# Adding a second node is a line here and a run of playbooks/proxmox.yml. That
# is the whole point of this layer: the work is done once, not per node.
#
# Deliberately NOT a child of linux_servers. A hypervisor in the same group as
# its guests means a hypervisor outage blocks config from reaching anything —
# the Builder already had that failure once with a single stopped VM.
all:
  children:
    proxmox_nodes:
      hosts:
        xps-pve:
          # Name, not address. Tailnet addresses belong to devices and change;
          # this one has already moved once this week on a rebuilt guest.
          # The name comes from the environment (vars.PROXMOX_HOST in CI,
          # exported by hand locally) so the tailnet is not written into a
          # public repository. Unset is an error, not a silent default.
          ansible_host: >-
            {{ lookup('env', 'AUTOLAB_PVE_HOST')
               or undef('AUTOLAB_PVE_HOST is unset: export the tailnet name of the node (vars.PROXMOX_HOST in CI)') }}

      vars:
        # root until the accounts below exist, then gitops. The first run is
        # the only one that needs root, exactly like the autolab break-glass
        # user on a new VM.
        ansible_user: "{{ autolab_proxmox_user | default('root') }}"
