<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUTOLAB · Photos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0A'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F4F4F5' stroke-width='1.6'/%3E%3C/svg%3E">
<meta name="theme-color" content="#08080A">
<!--
  Photo Jobs. The page is the design of home.lab.pmahir.space (Space Grotesk and IBM Plex Mono,
  thin borders, ink on paper, the black hole behind everything) carrying a tool instead of a
  list. Plain HTML and JS, no framework: the server serves this one file and answers /api/*.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08080A; --fg:#F4F4F5; --ok:#7BC47F; --warn:#E3B341; --bad:#E5645C;
          --line:color-mix(in srgb,var(--fg) 22%,transparent); --soft:color-mix(in srgb,var(--fg) 8%,transparent);
          --dim:color-mix(in srgb,var(--fg) 62%,transparent); --panel:color-mix(in srgb,var(--bg) 82%,transparent); }
  :root.light { --bg:#FFFFFF; --fg:#0A0A0A; --ok:#2E7D32; --warn:#9A6B00; --bad:#B3261E; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:'Space Grotesk',system-ui,sans-serif; font-size:14px; line-height:1.5; min-height:100dvh; }
  a { color:inherit; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  canvas#sky { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none; }
  #app { position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:clamp(14px,2vw,28px) clamp(14px,2vw,28px) 90px; display:flex; flex-direction:column; gap:14px; min-height:100dvh; }
  :focus-visible { outline:1px dashed var(--dim); outline-offset:3px; }

  /* header: wordmark, tabs, clock — the same row as home */
  #bar { display:flex; align-items:center; gap:12px 40px; flex-wrap:wrap; }
  #brand { font-size:11px; letter-spacing:.34em; }
  #brand span { opacity:.6; }
  .tabs { display:flex; gap:28px; }
  .tabs button { color:inherit; background:none; border:0; border-bottom:2px solid transparent; padding:6px 0; font:inherit; font-size:13px; cursor:pointer; }
  .tabs button[aria-selected="true"] { border-bottom-color:currentColor; }
  .tabs button:focus-visible { outline:none; border-bottom-style:dashed; border-bottom-color:currentColor; }
  .tabs small { opacity:.6; margin-left:6px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; }
  #right { margin-left:auto; display:flex; align-items:center; gap:14px; }
  #clock { font-size:11px; letter-spacing:.2em; font-variant-numeric:tabular-nums; }
  #flip { width:30px; height:30px; padding:0; display:grid; place-items:center; cursor:pointer; background:transparent; color:var(--fg); border:1px solid var(--fg); border-radius:999px; }
  hr.rule { border:0; height:1px; background:var(--fg); margin:0; width:100%; transform-origin:left; animation:rule 1s .15s both cubic-bezier(.2,.7,.2,1); }
  @keyframes rule { from { transform:scaleX(0); } }

  /* panels, headings, buttons */
  .panel { border:1px solid var(--line); border-radius:6px; background:var(--panel); backdrop-filter:blur(6px); padding:16px 18px; position:relative; }
  .head { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.3em; text-transform:uppercase; margin:0 0 12px; }
  .head span { opacity:.75; }
  h2 { margin:0 0 4px; font-size:20px; font-weight:500; }
  p.muted, .muted { color:var(--dim); margin:0; }
  .btn { color:inherit; background:none; border:1px solid var(--fg); border-radius:4px; padding:8px 16px; font:inherit; font-size:13px; cursor:pointer; letter-spacing:.02em; transition:background-color .2s, color .2s; }
  .btn:hover:not(:disabled) { background:var(--fg); color:var(--bg); }
  .btn.primary { background:var(--fg); color:var(--bg); }
  .btn.primary:hover:not(:disabled) { background:transparent; color:var(--fg); }
  .btn.small { padding:4px 10px; font-size:11.5px; }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.quiet { border-color:var(--line); }
  .btn.quiet:hover:not(:disabled) { border-color:var(--fg); }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .grow { flex:1 1 auto; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile { border:1px solid var(--line); border-radius:5px; padding:12px 14px; }
  .tile b { display:block; font-size:26px; font-weight:500; letter-spacing:.01em; font-variant-numeric:tabular-nums; }
  .tile small { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .tile.kind { cursor:pointer; text-align:left; color:inherit; background:none; font:inherit; transition:border-color .2s, opacity .2s; }
  .tile.kind:hover { border-color:var(--fg); }
  .tile.kind.off { opacity:.4; }
  .tile.kind.off b { text-decoration:line-through; }

  /* custom checkbox and radio: a thin square, filled when on */
  .tick { appearance:none; -webkit-appearance:none; width:16px; height:16px; border:1px solid var(--dim); border-radius:3px; margin:0; display:inline-grid; place-items:center; cursor:pointer; flex:none; background:transparent; transition:border-color .15s, background-color .15s; }
  .tick:hover { border-color:var(--fg); }
  .tick:checked { background:var(--fg); border-color:var(--fg); }
  .tick:checked::after { content:""; width:8px; height:4px; border:solid var(--bg); border-width:0 0 1.6px 1.6px; transform:translateY(-1px) rotate(-45deg); }
  .tick.radio { border-radius:50%; }
  .tick.radio:checked::after { width:6px; height:6px; border:0; border-radius:50%; background:var(--bg); transform:none; }

  /* a progress line that sweeps while the total is unknown */
  .progress { height:2px; background:var(--soft); position:relative; overflow:hidden; margin-top:10px; }
  .progress i { position:absolute; left:0; top:0; bottom:0; background:var(--fg); transition:width .4s; }
  .progress.unknown i { width:30% !important; animation:sweep 1.4s ease-in-out infinite; }
  @keyframes sweep { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
  .dot { width:7px; height:7px; border-radius:50%; border:1px solid currentColor; display:inline-block; flex:none; }
  .dot.on { background:currentColor; }

  /* lists */
  .list { display:flex; flex-direction:column; }
  .item { display:grid; grid-template-columns:auto 84px minmax(0,1fr); gap:6px 14px; align-items:start; padding:9px 2px; border-bottom:1px solid var(--soft); transition:padding-left .2s; }
  .item:hover { padding-left:8px; }
  .item.off { opacity:.4; }
  .tag { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; border:1px solid var(--line); border-radius:3px; padding:2px 6px; text-align:center; align-self:start; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .path { font-family:'IBM Plex Mono',monospace; font-size:11.5px; overflow-wrap:anywhere; }
  .path .arrow { opacity:.5; margin:0 6px; }
  .path .to { opacity:.95; }
  .why { color:var(--dim); font-size:11.5px; margin-top:2px; }
  .live { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; border:1px solid var(--line); border-radius:3px; padding:0 5px; margin-left:8px; color:var(--dim); }
  .bar { position:sticky; bottom:12px; z-index:3; display:flex; align-items:center; gap:14px; flex-wrap:wrap; border:1px solid var(--fg); border-radius:6px; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px); padding:12px 16px; }
  input.search { background:transparent; color:inherit; border:1px solid var(--line); border-radius:4px; padding:6px 10px; font:inherit; font-size:12.5px; min-width:220px; }
  input.search:focus { border-color:var(--fg); outline:none; }

  .group { border:1px solid var(--line); border-radius:5px; padding:10px 14px; margin-bottom:10px; }
  .group.off { opacity:.45; }
  .group header { display:flex; align-items:center; gap:12px; margin-bottom:6px; font-size:12px; color:var(--dim); }
  .copy { display:flex; align-items:flex-start; gap:10px; padding:4px 0; cursor:pointer; }
  .copy .path { flex:1 1 auto; }
  .copy .keep { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ok); }
  .note { border-left:2px solid var(--warn); padding:2px 12px; margin:6px 0; color:var(--dim); font-size:12.5px; }
  .empty { padding:36px 12px; text-align:center; color:var(--dim); }
  .status-ok { color:var(--ok); } .status-bad { color:var(--bad); } .status-warn { color:var(--warn); }
  dialog { background:var(--bg); color:var(--fg); border:1px solid var(--fg); border-radius:6px; padding:22px 24px; max-width:480px; }
  dialog::backdrop { background:rgba(0,0,0,.6); backdrop-filter:blur(3px); }
  dialog h2 { margin-bottom:10px; }
  dialog ul { margin:10px 0 18px; padding-left:18px; color:var(--dim); }
  .runs { display:grid; grid-template-columns:1fr auto; gap:6px 16px; padding:12px 2px; border-bottom:1px solid var(--soft); align-items:center; }
  @media (max-width:700px) {
    .item { grid-template-columns:auto 1fr; } .item .tag { grid-column:2; width:max-content; } .item > div:last-child { grid-column:1 / -1; }
    .tabs { gap:20px; order:3; flex-basis:100%; }
  }

  /* compact head, stats, toolbar, chips and the scrolling table */
  #main { display:flex; flex-direction:column; gap:12px; }
  .compact { padding:12px 16px; }
  .compact h2 { font-size:18px; }
  .stats { display:flex; flex-wrap:wrap; gap:6px 28px; margin-top:10px; }
  .stats.inline { margin:0; }
  .stat { display:flex; align-items:baseline; gap:8px; }
  .stat b { font-size:20px; font-weight:500; font-variant-numeric:tabular-nums; }
  .stat small { font:10.5px 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .toolbar { display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; margin-bottom:10px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { color:inherit; background:none; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font:inherit; font-size:12px; cursor:pointer; display:inline-flex; gap:8px; align-items:baseline; transition:background-color .15s, border-color .15s, color .15s; }
  .chip small { font:10.5px 'IBM Plex Mono',monospace; color:var(--dim); }
  .chip:hover { border-color:var(--fg); }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .chip.on small { color:inherit; opacity:.7; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .seg button { color:inherit; background:none; border:0; border-left:1px solid var(--line); padding:5px 12px; font:inherit; font-size:12px; cursor:pointer; }
  .seg button:first-child { border-left:0; }
  .seg button.on { background:var(--fg); color:var(--bg); }
  .seg button.danger.on { background:var(--bad); color:#fff; }
  .btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  .btn.danger:hover:not(:disabled) { background:transparent; color:var(--bad); }
  .note.bad { border-left-color:var(--bad); color:var(--fg); }
  .toolbar.bulk { margin:4px 0 8px; padding:6px 4px; border-top:1px solid var(--soft); border-bottom:1px solid var(--soft); font-size:12px; }
  input.search.wide { min-width:min(360px,100%); }
  .table-panel { display:flex; flex-direction:column; min-height:0; padding:12px 14px; }
  .table { display:flex; flex-direction:column; min-height:0; flex:1; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .tbody { overflow:auto; flex:1 1 auto; min-height:0; max-height:70vh; scrollbar-width:thin; }
  .tbody.groups { padding:2px 2px 0; }
  .tr { display:grid; grid-template-columns:28px 92px minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,1fr); gap:4px 14px; padding:8px 12px; border-bottom:1px solid var(--soft); align-items:start; }
  .tr.immich { grid-template-columns:28px 72px minmax(0,1fr) minmax(0,1.7fr) 90px 160px; }
  .tr:hover:not(.th) { background:var(--soft); }
  .tr.off { opacity:.42; }
  .tr.inert .tick { opacity:.3; cursor:default; }
  .album-row { display:grid; grid-template-columns:28px 72px minmax(150px,1.3fr) minmax(160px,1fr) 150px 160px; gap:8px 14px; padding:10px 12px; border-bottom:1px solid var(--soft); align-items:center; }
  .album-row:not(.album-head):hover { background:var(--soft); }
  .album-head { position:sticky; top:0; z-index:2; background:color-mix(in srgb,var(--bg) 94%,var(--fg)); font:10.5px 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); }
  .album-name { width:100%; min-width:0; }
  .album-state { font:10.5px 'IBM Plex Mono',monospace; color:var(--dim); }
  .album-state.ready, .album-state.add { color:var(--ok); }
  .album-state.not_scanned { color:var(--warn); }
  .th { position:sticky; top:0; z-index:2; background:color-mix(in srgb,var(--bg) 94%,var(--fg)); font:10.5px 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); align-items:center; }
  .tr .name { font-weight:500; font-family:'Space Grotesk',sans-serif; overflow-wrap:anywhere; }
  .immich-status { margin-top:10px; font-size:11.5px; display:flex; align-items:center; gap:8px; color:var(--dim); }
  .immich-status.status-ok { color:var(--ok); } .immich-status.status-bad { color:var(--bad); }
  h2.status-bad { color:var(--bad); }
  /* previews: a thumbnail opens the viewer; nothing here animates */
  .thumb { width:64px; height:64px; border-radius:4px; border:1px solid var(--line); background:var(--soft); object-fit:cover; display:block; cursor:zoom-in; flex:none; }
  .thumb.blank { display:grid; place-items:center; text-align:center; font:9px 'IBM Plex Mono',monospace; letter-spacing:.08em; color:var(--dim); }
  .tr.pics { grid-template-columns:28px 72px 92px minmax(0,1.25fr) minmax(0,1.25fr) minmax(0,1fr); }
  .copy .thumb { width:56px; height:56px; }
  .group header .btn { margin-left:auto; }
  dialog#viewer { max-width:none; width:min(1500px,96vw); max-height:94dvh; padding:16px 18px; overflow:auto; }
  .viewer-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:14px; margin-top:12px; }
  .viewer-grid figure { margin:0; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .frame { background:var(--soft); border:1px solid var(--line); border-radius:4px; min-height:180px; display:grid; place-items:center; overflow:hidden; }
  .frame img, .frame video { max-width:100%; max-height:66dvh; display:block; }
  .frame .blank { padding:40px 12px; color:var(--dim); font-size:12.5px; text-align:center; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:1px 14px; font:11.5px 'IBM Plex Mono',monospace; color:var(--dim); }
  .facts dt { opacity:.75; } .facts dd { margin:0; color:var(--fg); }
  .note.ok { border-left-color:var(--ok); color:var(--fg); }
  .shots { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; margin-top:12px; }
  .shot { border:1px solid var(--line); border-radius:5px; padding:8px; display:flex; flex-direction:column; gap:6px; position:relative; min-width:0; }
  .shot.on { border-color:var(--fg); background:var(--soft); }
  .shot .thumb { width:100%; height:150px; }
  .shot .tick { position:absolute; top:14px; left:14px; z-index:1; background:var(--bg); }
  .shot .name { font-size:12px; overflow-wrap:anywhere; }
  .shot .meta { font:10.5px 'IBM Plex Mono',monospace; color:var(--dim); }
  .last { font:11px 'IBM Plex Mono',monospace; color:var(--dim); margin-top:8px; letter-spacing:.02em; }
  .metaform { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:8px 2px; border-top:1px solid var(--soft); font-size:12.5px; }
  .metaform .lab { font:10.5px 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); min-width:92px; }
  .metaform input.field { min-width:0; }
  .metaform label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .refchip { display:inline-flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:5px; padding:3px 10px 3px 3px; max-width:420px; }
  .refchip .thumb { width:40px; height:40px; }
  .shot .where { font:10.5px 'IBM Plex Mono',monospace; color:var(--dim); overflow-wrap:anywhere; }
  .shot .facts2 { font:11px 'IBM Plex Mono',monospace; }
  .stat.link { cursor:pointer; text-decoration:underline dotted; text-underline-offset:4px; }
  input.field { background:transparent; color:inherit; border:1px solid var(--line); border-radius:4px; padding:6px 10px; font:inherit; font-size:12.5px; color-scheme:dark; }
  :root.light input.field { color-scheme:light; }
  input.field:focus { border-color:var(--fg); outline:none; }
  /* on a desktop the table fills the window and scrolls inside itself, so the page does not move */
  @media (min-width:701px) {
    body.fit #app { height:100dvh; padding-bottom:clamp(14px,2vw,28px); }
    body.fit #main { flex:1; min-height:0; }
    body.fit .table-panel { flex:1; min-height:0; }
    body.fit .tbody { max-height:none; }
    body.fit .bar { position:static; flex:none; }
  }
  @media (max-width:700px) { .tr, .tr.immich, .tr.pics { grid-template-columns:28px 1fr; } .th { display:none; } .tr > :nth-child(n+3) { grid-column:2; }
    .album-row { grid-template-columns:24px minmax(0,1fr); } .album-row > :nth-child(n+3) { grid-column:2; } .album-head { display:none; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <div id="bar">
    <span id="brand" class="mono">AUTOLAB <span>/ PHOTOS</span></span>
    <nav class="tabs" role="tablist" aria-label="Photo jobs">
      <button type="button" role="tab" data-tab="inbox" aria-selected="true">Inbox</button>
      <button type="button" role="tab" data-tab="duplicates" aria-selected="false">Duplicates</button>
      <button type="button" role="tab" data-tab="nodate" aria-selected="false">No date<small id="nodate-count"></small></button>
      <button type="button" role="tab" data-tab="meta" aria-selected="false">Find &amp; edit</button>
      <button type="button" role="tab" data-tab="albums" aria-selected="false">Albums</button>
      <button type="button" role="tab" data-tab="immich" aria-selected="false">Immich trash</button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">History<small id="runs-count"></small></button>
    </nav>
    <div id="right">
      <span id="jobchip" class="mono muted" style="font-size:11px; letter-spacing:.14em;" hidden></span>
      <span id="clock" class="mono">--:--</span>
      <button id="flip" type="button" aria-label="Switch theme"></button>
    </div>
  </div>
  <hr class="rule">
  <div id="lost" class="panel status-bad" hidden>Lost contact with the photo service (it may be restarting). Reconnecting…</div>
  <main id="main"></main>
</div>
<dialog id="confirm"></dialog>
<dialog id="viewer" aria-label="Photo viewer"></dialog>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const KIND_LABEL = { sorted: 'dated', 'no date': 'no date', event: 'event', merged: 'merged', duplicate: 'duplicate', sidecar: 'sidecar' };
  const fmtGiB = b => b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' GiB' : b >= 1048576 ? (b / 1048576).toFixed(b >= 1.05e7 ? 0 : 1) + ' MiB' : Math.max(1, Math.round(b / 1024)) + ' KiB';
  const ago = t => { const s = Date.now() / 1000 - t; return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 129600 ? Math.round(s / 3600) + ' h ago' : new Date(t * 1000).toLocaleDateString([], { month: 'short', day: 'numeric' }); };

  const TABS = ['inbox', 'duplicates', 'nodate', 'meta', 'albums', 'immich', 'history'];
  const state = { tab: location.hash.slice(1) || 'inbox', status: null, job: null, dark: true, runs: [], immichInfo: null, activity: [], loading: {},
                  sort: { plan: null, rows: [], total: 0, shown: 0, filter: { kind: '', pair: false, q: '' }, done: null },
                  dupes: { plan: null, groups: [], total: 0, q: '', scope: '', done: null },
                  nodate: { files: null, checked: new Set(), q: '', date: '', time: '12:00', done: null, failed: [] },
                  meta: { q: '', folder: '', kind: '', files: null, total: 0, folders: [], info: {}, checked: new Set(), ref: null, done: null, failed: [],
                          form: { date: '', time: '', loc: '', desc: '', dayOnly: true, copyLoc: true, copyDate: false, copyDesc: false } },
                  immich: { plan: null, rows: [], total: 0, selected: 0, selectable: 0, filter: { status: '', live: false, q: '' }, done: null },
                  albums: null, albumChecked: new Set(), albumConfigured: false, albumResult: '', albumResultKind: 'ok' };
  if (!TABS.includes(state.tab)) state.tab = 'inbox';
  // What you were looking at: the filters and search boxes survive a reload. (The scans themselves are saved by the service.)
  const savedUI = (() => { try { return JSON.parse(localStorage.getItem('photos-ui')) || {}; } catch (e) { return {}; } })();

  }
  async function bulkItems(on) {
    const m = state.immich; immichUI.index.forEach(({ i, row, box }) => { if (i.status === 'file') { i.selected = on; box.checked = on; row.classList.toggle('off', !on); } });
    try { await api('/plans/' + m.plan.id, { method: 'PATCH', body: { filter: m.filter, selected: on } }); await afterImmichTick(); } catch (e) { fail(e); await reloadItems(); }
  }

  // ---- History ---------------------------------------------------------------------------------------
  function viewHistory() {
    const panel = el('div', 'panel'); panel.append(el('h2', null, 'History'), el('p', 'muted', 'Every apply is recorded. Undo puts that run’s moved files back, skipping anything that has changed since. Deleted files cannot be put back.'));
    const list = el('div', 'list'); list.style.marginTop = '12px';
    if (!state.runs.length) list.append(el('div', 'empty', 'Nothing has been applied yet.'));
    const WHAT = { duplicates: 'Duplicates handled', immich: 'Immich trash removed', sort: 'Inbox sorted', 'set-date': 'Dates written', metadata: 'Metadata edited' };
    state.runs.forEach(r => {
      const row = el('div', 'runs'), left = el('div'), c = r.counts;
      left.append(el('div', null, `${WHAT[r.kind] || 'Run'} · ${ago(r.started)}`));
      left.append(el('div', 'why mono', [c.edited && `${c.edited} edited`, c.moved && `${c.moved} moved`, c.deleted && `${c.deleted} deleted for good`, c.skipped && `${c.skipped} skipped`, c.error && `${c.error} failed`].filter(Boolean).join(' · ')));
      row.append(left);
      if (r.undone) row.append(el('span', 'tag', 'undone'));
      else if (!c.moved && !c.edited) row.append(el('span', 'tag', c.deleted ? 'deleted' : 'nothing to undo'));
      else { const u = el('button', 'btn small', 'Undo'); u.disabled = busy(); u.onclick = () => undo(r.id); row.append(u); }
      list.append(row);
    });
    panel.append(list); main.append(panel);
    const act = el('div', 'panel'); act.style.marginTop = '12px';
    act.append(el('h2', null, 'Activity'), el('p', 'muted', 'Every scan and apply the service has run, and what became of it, so nothing disappears without a trace.'));
    const alist = el('div', 'list'); alist.style.marginTop = '12px';
    if (!state.activity.length) alist.append(el('div', 'empty', 'Nothing has run yet.'));
    state.activity.slice(0, 40).forEach(a => {
      const row = el('div', 'runs'), left = el('div');
      const took = a.finished ? `${Math.max(1, Math.round(a.finished - a.started))} s` : '';
      left.append(el('div', null, `${JOB_DID[a.kind] || a.kind}${a.resumed ? ' (resumed after a restart)' : ''} · ${ago(a.started)}${took ? ' · took ' + took : ''}`));
      left.append(el('div', 'why mono' + (['error', 'interrupted'].includes(a.state) ? ' status-bad' : ''), outcome(a)));
      row.append(left); alist.append(row);
    });
    act.append(alist); main.append(act);
  }

  // ---- doing things ------------------------------------------------------------------------------
  const dlg = $('#confirm');
  function confirmApply(plan) {
    const del = plan.mode === 'delete', n = plan.kind === 'duplicates' ? plan.preview.moves : plan.selected;
    dlg.replaceChildren();
    dlg.append(el('h2', del ? 'status-bad' : null, del ? `Delete ${n.toLocaleString()} files for good?` : `Apply ${n.toLocaleString()} moves?`));
    const facts = del
      ? ['These files are removed from the disk. There is no undo and no trash.', plan.kind === 'immich' ? 'Each one is checked to still be the exact file Immich trashed.' : 'Each one is checked to still be identical to the copy you keep.',
         'A file that fails its check is skipped, not deleted.', 'The deletion is recorded in History.']
      : ['Only the moves you left ticked are made.', 'Each move is skipped if its file has changed since the scan.', 'Nothing is overwritten or deleted. Undo is in History.'];
    const ul = el('ul'); facts.forEach(t => ul.append(el('li', null, t)));
    dlg.append(ul);
    const row = el('div', 'row'); row.style.justifyContent = 'flex-end';
    const cancel = el('button', 'btn quiet', 'Cancel'), go = el('button', 'btn ' + (del ? 'danger' : 'primary'), del ? 'Delete for good' : 'Apply'); cancel.onclick = () => dlg.close();
    let typed = null;
    if (del) {
      typed = el('input', 'search'); typed.placeholder = 'Type DELETE to confirm'; typed.style.cssText = 'width:100%;margin-bottom:14px'; go.disabled = true;
      typed.oninput = () => { go.disabled = typed.value !== 'DELETE'; }; dlg.append(typed);
    }
    go.onclick = async () => { dlg.close(); try { watchJob((await api(`/plans/${plan.id}/apply`, { method: 'POST', body: del ? { confirm: 'DELETE' } : {} })).job); render(); } catch (e) { fail(e); } };
    row.append(cancel, go); dlg.append(row); dlg.showModal(); if (typed) typed.focus();
  }
  async function undo(id) {
    if (!confirm('Put this run’s moved files back where they were? Anything deleted stays deleted.')) return;
    try { watchJob((await api(`/runs/${id}/undo`, { method: 'POST' })).job); render(); } catch (e) { fail(e); }
  }

  // ---- the black hole: the design's own code, calmer, behind the work --------------------------------
  const sky = $('#sky'), reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const S = { parts: null, spin: 0 };
  let skyDirty = true, dpr = 1, W = 1, H = 1, intro = performance.now(), lastT = 0;
  const toRGB = hex => { const n = hex.replace('#', ''); const v = parseInt(n.length === 3 ? n.split('').map(x => x + x).join('') : n, 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
  function seed() { S.parts = []; for (let k = 0; k < 520; k++) { const u = Math.pow(Math.random(), .8); S.parts.push({ r: 1.08 + u * 2.5, a: Math.random() * 6.2832, b: .35 + Math.random() * .65, t: Math.random() * .9 + .3 }); } }
  function arc(ctx, cx, cy, s, tilt, fg) { ctx.strokeStyle = rgba(fg, s[3]); ctx.lineWidth = .6 + s[4] * 1.5; ctx.beginPath(); ctx.ellipse(cx, cy, s[0], s[0] * tilt, 0, s[1], s[1] + s[2]); ctx.stroke(); }
  function paint(T, enter) {
    dpr = Math.min(devicePixelRatio || 1, 2);
    const r = sky.getBoundingClientRect(); W = r.width; H = r.height;
    const pw = Math.round(W * dpr), ph = Math.round(H * dpr);
    if (sky.width !== pw || sky.height !== ph) { sky.width = pw; sky.height = ph; }
    if (!S.parts) seed();
    const ctx = sky.getContext('2d'), fg = toRGB(state.dark ? '#F4F4F5' : '#0A0A0A'), bg = state.dark ? '#08080A' : '#FFFFFF';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    // The hole sits at the right edge and stays small once the intro is over, so it frames the work
    // instead of competing with it. During the intro it grows to the home page's size and settles.
    const cx = W * (.5 + .33 * (1 - enter)), cy = H * (.5 - .12 * (1 - enter)), dim = .55 + .45 * enter;
    const R = Math.min(W, H) * (.09 + .05 * enter) * (1 + enter * enter * 3.5), tilt = Math.max(.04, .19 + enter * .1);
    const stretch = 1 + enter * enter * 14, breathe = 1 + .02 * Math.sin(T * .7);
    const hr = R * 3.4 * breathe, halo = ctx.createRadialGradient(cx, cy, R * .85, cx, cy, hr);
    halo.addColorStop(0, rgba(fg, .1 * dim)); halo.addColorStop(.18, rgba(fg, .05 * dim)); halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, hr, 0, 6.2832); ctx.fill();
    const lens = (1 - enter * .85) * dim * .8;
    for (let k = 0; k < 22; k++) { const u = k / 22; ctx.strokeStyle = rgba(fg, (.085 - u * .075) * lens); ctx.lineWidth = 1 + (1 - u) * 1.4;
      ctx.beginPath(); ctx.ellipse(cx, cy, R * (1.06 + u * .5), R * (1.42 + u * .85) * (1 + .012 * Math.sin(T * 1.2 + k)), 0, 0, 6.2832); ctx.stroke(); }
    const front = [];
    for (const p of S.parts) {
      const rad = R * p.r * (1 - enter * .18), spd = .9 / Math.pow(p.r, 1.4), ang = p.a + S.spin * spd;
      const dA = (.03 + p.t * .09) * (1 + stretch * .5) / p.r, dop = Math.cos(ang) < 0 ? 1.7 : .5;
      const seg = [rad, ang, dA, .1 * p.b * dop * dim * (1 + enter * .5), p.t];
      if (Math.sin(ang) > 0) front.push(seg); else arc(ctx, cx, cy, seg, tilt, fg);
    }
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, R * .995, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = rgba(fg, (.45 + .18 * Math.sin(T * 2.1) + .1 * Math.sin(T * 5.3)) * dim); ctx.lineWidth = 1.2 + .5 * Math.sin(T * 1.7);
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.008, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = rgba(fg, .12 * dim); ctx.lineWidth = 6 + 3 * Math.sin(T * .9); ctx.beginPath(); ctx.arc(cx, cy, R * 1.05, 0, 6.2832); ctx.stroke();
    front.forEach(s => arc(ctx, cx, cy, s, tilt, fg));
  }
  function loop(now) {
    const T = now / 1000, dt = Math.min(.05, Math.max(0, T - (lastT || T))); lastT = T;
    const e = reduced.matches ? 0 : 1 - clamp((now - intro) / 2600);   // 1 → 0, easing out
    const enter = e * e * (3 - 2 * e);
    S.spin += dt * (.55 + enter * 3.4);
    paint(T, enter);
    if (!reduced.matches || skyDirty) requestAnimationFrame(loop);
    skyDirty = false;
  }
  addEventListener('resize', () => { if (reduced.matches) { skyDirty = true; requestAnimationFrame(loop); } });
  reduced.addEventListener('change', () => { skyDirty = true; requestAnimationFrame(loop); });

  // ---- go ------------------------------------------------------------------------------------------
  paintTheme();
  requestAnimationFrame(loop);
  (async () => {
    try {
      await refresh();
      if (state.status.job && state.status.job.state === 'running') watchJob(state.status.job);
    } catch (e) { main.append(el('div', 'panel status-bad', 'Cannot reach the photo service: ' + e.message)); return; }
    render();            // the page is usable at once; saved scans fill in as they load
    await resume();
  })();
  // If the service goes away (a deploy, a restart) say so, and when it is back reload everything it
  // has saved, so a page left open is never stale.
  let lost = false;
  setInterval(async () => {
    try {
      await api('/job');
      if (lost) { lost = false; $('#lost').hidden = true; await refresh(); await resume(); render(); }
    } catch (e) { if (!lost) { lost = true; $('#lost').hidden = false; } }
  }, 4000);
})();
</script>
</body>
</html>
